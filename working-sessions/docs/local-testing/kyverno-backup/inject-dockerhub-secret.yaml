apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/category: Image Registry
    policies.kyverno.io/last-validated: '2025-12-07T09:22:50Z'
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod,Deployment,StatefulSet,DaemonSet,ReplicaSet
    policies.kyverno.io/title: Inject Docker Hub imagePullSecret
  name: inject-dockerhub-secret
spec:
  admission: true
  background: true
  emitWarning: false
  rules:
  - match:
      any:
      - resources:
          kinds:
          - Pod
          namespaces:
          - namespace-configuration-operator
    mutate:
      patchStrategicMerge:
        spec:
          imagePullSecrets:
          - name: dockerhub-secret
    name: inject-secret-pods
    skipBackgroundRequests: true
  - match:
      any:
      - resources:
          kinds:
          - Deployment
          names:
          - namespace-configuration-operator-controller-manager
          namespaces:
          - namespace-configuration-operator
    mutate:
      patchStrategicMerge:
        spec:
          template:
            spec:
              imagePullSecrets:
              - name: dockerhub-secret
    name: inject-secret-workloads
    skipBackgroundRequests: true
  validationFailureAction: Audit

