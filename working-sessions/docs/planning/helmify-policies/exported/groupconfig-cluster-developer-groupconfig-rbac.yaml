apiVersion: redhatcop.redhat.io/v1alpha1
kind: GroupConfig
metadata:
  annotations:
    description: 'Cluster RBAC: edit ClusterRole for cluster-developer groups'
  finalizers:
  - redhatcop.redhat.io/groupconfig-controller
  labels:
    app.kubernetes.io/component: cluster-rbac-automation
    app.kubernetes.io/name: namespace-configuration-operator
    rbac.ocp.io/kind: GroupConfig
    rbac.ocp.io/scope: cluster-wide
  name: cluster-developer-groupconfig-rbac
spec:
  annotationSelector: {}
  labelSelector:
    matchExpressions:
    - key: group-sync-operator.redhat-cop.io/sync-provider
      operator: Exists
  templates:
  - excludedPaths:
    - .spec.replicas
    - .metadata
    - .status
    objectTemplate: "{{- if hasSuffix \"-cluster-developer\" .Name }}\napiVersion:\
      \ rbac.authorization.k8s.io/v1\nkind: ClusterRoleBinding\nmetadata:\n  name:\
      \ \"{{ .Name }}-crb\"\n  labels:\n    app.kubernetes.io/managed-by: namespace-configuration-operator\n\
      \    app.kubernetes.io/version: 0.1.0\n    rbac.ocp.io/policy-version: 0.1.0\n\
      \    rbac.ocp.io/role-type: cluster-developer\n    rbac.ocp.io/group-name: \"\
      {{ .Name }}\"\n    rbac.ocp.io/access-level: edit-cluster-wide\n    rbac.ocp.io/config-source:\
      \ cluster-rbac\n  annotations:\n    rbac.ocp.io/created-by: namespace-configuration-operator\n\
      \    rbac.ocp.io/source-groupconfig: cluster-developer-groupconfig-rbac\n  \
      \  rbac.ocp.io/group-pattern: \"app-ocp-rbac-*-cluster-developer\"\n    rbac.ocp.io/scope-restriction:\
      \ \"cluster-wide\"\nsubjects:\n- kind: Group\n  name: \"{{ .Name }}\"\n  apiGroup:\
      \ rbac.authorization.k8s.io\nroleRef:\n  apiGroup: rbac.authorization.k8s.io\n\
      \  kind: ClusterRole\n  name: edit\n{{- end }}\n"

