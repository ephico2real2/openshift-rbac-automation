apiVersion: redhatcop.redhat.io/v1alpha1
kind: NamespaceConfig
metadata:
  finalizers:
  - redhatcop.redhat.io/namespaceconfig-controller
  name: multitenant
spec:
  annotationSelector: {}
  labelSelector:
    matchLabels:
      multitenant: 'true'
  templates:
  - excludedPaths:
    - .metadata
    - .status
    - .spec.replicas
    objectTemplate: "apiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n\
      \  name: allow-from-same-namespace\n  namespace: {{ .Name }}\nspec:\n  podSelector:\
      \ {}\n  ingress:\n  - from:\n    - podSelector: {}\n"
  - excludedPaths:
    - .status
    - .spec.replicas
    - .metadata
    objectTemplate: "apiVersion: networking.k8s.io/v1\nkind: NetworkPolicy    \nmetadata:\n\
      \  name: allow-from-default-namespace\n  namespace: {{ .Name }}\nspec:\n  podSelector:\
      \ {}\n  ingress:\n  - from:\n    - namespaceSelector:\n        matchLabels:\n\
      \          name: default        \n"

