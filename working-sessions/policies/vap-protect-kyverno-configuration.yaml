# =============================================================================
# Companion to kyverno-restrict-nco-writers.yaml: protect Kyverno's own configuration
# =============================================================================
# WHY THIS EXISTS, AND WHY IT IS NOT A KYVERNO POLICY
# Kyverno decides whether a request is shown to any policy BEFORE the policies run: requests
# that match the resourceFilters in ConfigMap kyverno/kyverno, or whose requester carries a
# group in excludeGroups, are skipped (pkg/webhooks/handlers/filter.go). That ConfigMap, and
# Kyverno's admission Deployment, are themselves exempt from every Kyverno policy: on this
# cluster resourceFilters carries "[*/*,kyverno,*]", and the webhooks skip the namespace.
#
# The population the guardrail restricts, the chart's cluster-wide `admin` and `edit` tiers,
# holds edit on every namespace, kyverno included. Measured on the sandbox cluster with a server
# dry run as the developer tier: `oc patch cm kyverno -n kyverno` succeeded, `oc scale deploy
# kyverno-admission-controller --replicas=0` succeeded, and with "[NamespaceConfig,*,*]" added to
# resourceFilters a NamespaceConfig CREATE and DELETE by that tier were admitted with the
# guardrail's execution counter unchanged: the request never reached it. No Kyverno policy can
# close that; the API server's own admission can, and no Kyverno configuration filters it.
#
# WHAT IT CHECKS
# CREATE, UPDATE and DELETE of ConfigMaps and Deployments (and the scale subresource) in the
# kyverno namespace are allowed only for the platform administrators. That is the guardrail's
# own allow-list, evaluated in process here: the names OpenShift itself uses (system:admin,
# system:masters, system:cluster-admins); the chart's -cluster-admin tier by PATTERN,
# app-ocp-rbac-<mnemonic>-cluster-admin, the trusted platform admins by the chart's design (the
# same pattern as the guardrail, for the same reasons); groups allowed BY NAME in
# namedPlatformAdminGroups, for a group that does not fit the pattern; and the API server's
# authorizer asked whether the requester may do verb "*" on resource "*" in group "*", which only
# a wildcard rule (a cluster-admin binding) grants. The -cluster-developer tier, which holds edit,
# is refused. If Kyverno is deployed by a GitOps controller rather than by an administrator
# running Helm, add that controller's service account to the validation.
#
# No Kyverno service account is exempted, on purpose. Measured: none of them has ever written
# this ConfigMap or these Deployments (managedFields carry helm, kubectl and, through the status
# subresource only, kube-controller-manager), and the developer tier can create ServiceAccounts,
# Pods and tokens in the kyverno namespace, so an exemption by service-account name is an
# identity that tier can mint. Kubernetes' own controllers write Deployments through /status,
# which this policy does not match.
#
# TESTING (server dry runs, as the developer tier that holds edit)
#   oc patch cm kyverno -n kyverno --type=merge -p '{"data":{"probe":"x"}}' --dry-run=server \
#     --as=probe-dev --as-group=app-ocp-rbac-alpha-cluster-developer --as-group=system:authenticated
#   before: configmap/kyverno patched      after: ... ValidatingAdmissionPolicy ... denied request
#   the same as kubeadmin, system:admin or --as-group=app-ocp-rbac-alpha-cluster-admin: patched
#   (no change). A ConfigMap in another namespace as the developer: created.
# =============================================================================
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: protect-kyverno-configuration
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/component: rbac-validation
    app.kubernetes.io/part-of: rbac-automation
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kyverno
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [configmaps]
      - apiGroups: [apps]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [deployments, deployments/scale]
  variables:
    - name: groups
      expression: "has(request.userInfo.groups) ? request.userInfo.groups : []"
    - name: isClusterAdmin
      expression: >-
        request.userInfo.username == 'system:admin' ||
        'system:masters' in variables.groups ||
        'system:cluster-admins' in variables.groups
    - name: isPlatformAdminTier
      # The chart's -cluster-admin tier: the same pattern as the guardrail, see its comment there.
      expression: variables.groups.exists(g, g.startsWith('app-ocp-rbac-') && g.endsWith('-cluster-admin'))
    - name: namedPlatformAdminGroups
      # Groups allowed by exact name, for platform admins outside the pattern. One string per
      # group, for example ['ocp-platform-admins', 'sre-oncall']. Empty means none.
      expression: "[]"
    - name: isNamedPlatformAdmin
      expression: variables.groups.exists(g, g in variables.namedPlatformAdminGroups)
  validations:
    - expression: >-
        variables.isClusterAdmin || variables.isPlatformAdminTier || variables.isNamedPlatformAdmin ||
        authorizer.group('*').resource('*').check('*').allowed()
      messageExpression: >-
        request.operation + ' on ' + request.resource.resource +
        ' in namespace kyverno is restricted to platform administrators; refused for ' + request.userInfo.username
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: protect-kyverno-configuration
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/component: rbac-validation
    app.kubernetes.io/part-of: rbac-automation
spec:
  policyName: protect-kyverno-configuration
  validationActions: [Deny]
