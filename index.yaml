  namespace-configuration-operator:
  - annotations:
      artifacthub.io/operator: "true"
      artifacthub.io/operatorCapabilities: Basic Install
    apiVersion: v2
    appVersion: 1.2.6
    created: "2026-09-01T08:49:45.963293908Z"
    description: Installs the Red Hat CoP Namespace Configuration Operator (NCO) on
      OpenShift via OLM — a dedicated namespace, an AllNamespaces (global) OperatorGroup,
      and a Subscription. It can ALSO deploy RBAC policies (NamespaceConfig CRs) from
      namespaceConfigPolicy and clusterRbac, one policy per flag — the baseline tiers
      ship ENABLED, so a stock install grants RBAC; the raw manifests under working-sessions/policies
      stay the readable reference for those.
    digest: 757a7edcb8833068094066de4f807a7fc06af76d0d2dc6a5700fddf7ea0104fc
    home: https://github.com/ephico2real2/openshift-rbac-automation
