{{- if and .Values.namespaceConfigPolicy.enabled .Values.namespaceConfigPolicy.oudGroup.enabled }}
{{- $p := .Values.namespaceConfigPolicy.oudGroup }}
{{- if not $p.labelKey }}
{{- fail "namespaceConfigPolicy.oudGroup.labelKey is empty. It is the label the NamespaceConfig selects on AND the label whose VALUE becomes the bound group, so empty would render a config that selects EVERY namespace and binds a group called \"\". Set it, or disable the policy." }}
{{- end }}
# =============================================================================
# NamespaceConfig — company.net/oud-group
# =============================================================================
# Converted from working-sessions/policies/oud-group-namespaceconfig.yaml, which STAYS in the repo as
# the readable reference and the record of why this access model exists. This file is the deployable
# form; that file is the explanation. Neither replaces the other.
#
# ── THE ONE THING THAT MAKES THIS TEMPLATE UNUSUAL ───────────────────────────
# There are TWO template engines in play and they use the same delimiters.
#
#   Helm          evaluates this file at `helm template` / `helm upgrade` time.
#   The OPERATOR  evaluates each objectTemplate body LATER, once per matching namespace, where
#                 .Name is the namespace and .Labels are its labels.
#
# An expression meant for the operator must SURVIVE Helm and reach the cluster unevaluated. Helm has
# no leave-this-alone block, so the operator's two expressions are BUILT AS STRINGS below — $ns and
# $group — and substituted in. Helm renders a string; it does not recurse into what it produced.
#
# NOTE THAT A # COMMENT IS NOT A HELM COMMENT. It is a YAML comment, and Helm processes this file as
# text before YAML ever sees it — so an action written inside one of these comments IS EVALUATED.
# That is why the paragraphs below describe the operator's expressions in words instead of quoting
# them; an earlier draft quoted them and failed to render with `unexpected "\\" in operand`. The
# literal syntax lives in the source policy file named above, and in $ns / $group below.
#
# WHY NOT PIPE THROUGH `quote`. It escapes the inner double quotes of the index expression, and that
# breaks the operator: it renders each objectTemplate as a Go template FIRST and parses the result as
# YAML SECOND, so at render time a backslash-quote is not an escape — it is a backslash inside an
# action, and the parse fails. The quotes are therefore LITERAL TEXT here, outside the substitution.
#
# WHICH IS ALSO WHY AN objectTemplate IS NOT VALID YAML UNTIL IT IS RENDERED. Measured: handing one to
# a YAML parser fails on the nested double quotes around the index expression — they only nest
# correctly once the expression has been replaced by a plain value. So verify a change here by
# rendering the expressions out and THEN parsing, never by parsing the objectTemplate directly.
#
# WHY NOT `.Files.Get`, which would sidestep the escaping entirely: the body would be opaque, so the
# label key, the role name and the verbs could not come from values — the whole point of templating it.
#
# Equivalence to the source policy is proven rather than assumed: both objectTemplates were rendered
# with the same namespace context and compared as parsed YAML. Identical, both templates.
#
# The operator's own expressions, as strings. printf takes the quote characters as ARGUMENTS, because
# a literal escaped quote written inside a Helm action would be escaped again into the output.
{{- $ns := "{{ .Name }}" }}
{{- $group := printf "{{ index .Labels %s%s%s }}" "\"" $p.labelKey "\"" }}
apiVersion: redhatcop.redhat.io/v1alpha1
kind: NamespaceConfig
metadata:
  name: {{ $p.name }}
  labels:
    {{- include "nco.labels" . | nindent 4 }}
    app.kubernetes.io/component: rbac-automation
    rbac.ocp.io/scope: namespace-scoped
    rbac.ocp.io/kind: NamespaceConfig
    # LDAP-backed, like every policy in this chart — the groups this binds are synced from the directory,
    # so `-l rbac.ocp.io/identity-source=ldap-groups` must find this one too.
    rbac.ocp.io/identity-source: ldap-groups
    # AND THE AXIS THAT MAKES THIS POLICY DIFFERENT: the group name is the namespace label's value,
    # verbatim, with no prefix and no tier suffix. The other three compute theirs from the naming
    # convention and are labelled `pattern`.
    rbac.ocp.io/group-naming: namespace-label
    # CUSTOM, because this policy DEFINES its own namespace-scoped Role from a permission set in
    # values — a workload submitter no built-in tier expresses. The baseline policies bind
    # OpenShift's admin/edit/view instead, and are labelled `baseline`. So the two kinds are one
    # query apart across both CRDs:
    #   oc get namespaceconfig,groupconfig -l rbac.ocp.io/policy-family=custom
    # Before this label existed, that query returned only 13-custom-'s CR and silently omitted this
    # one — the sort of gap that makes an inventory look complete when it is not.
    rbac.ocp.io/policy-family: custom
  annotations:
    # One description key, on every policy — the "no prefix is added" fact is stated selectably by
    # rbac.ocp.io/group-naming: namespace-label above, so it does not need a second annotation here.
    description: "Namespace RBAC: bind the group named by the {{ $p.labelKey }} label value, verbatim and with no prefix added"
    # After the operator is installed and its CSV is running. A NamespaceConfig applied before the CRD
    # exists fails the release; applied before the controller is up it simply sits there.
    argocd.argoproj.io/sync-wave: "3"
spec:
  labelSelector:
    matchExpressions:
      # The ONLY requirement. No mnemonic, no environment — the label says everything.
      - key: {{ $p.labelKey }}
        operator: Exists
  templates:
    # -------------------------------------------------------------------------
    # Namespace-scoped submitter Role
    # -------------------------------------------------------------------------
    - excludedPaths:
        {{- toYaml $p.excludedPaths | nindent 8 }}
      objectTemplate: |
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: {{ $p.roleName }}
          namespace: "{{ $ns }}"
          labels:
            # This is the Role, not a binding — so no group-name and no bound-role. A Role has no
            # subject to name, and it IS the role rather than referencing one. It is also one per
            # NAMESPACE, not one per group (fixed name {{ $p.roleName }}), so tying it to a single
            # group name would be wrong rather than merely redundant.
            app.kubernetes.io/managed-by: namespace-configuration-operator
            rbac.ocp.io/config-source: {{ $p.configSource }}
            rbac.ocp.io/role-type: {{ $p.roleType }}
            rbac.ocp.io/scope: namespace-scoped
          annotations:
            rbac.ocp.io/source-namespaceconfig: {{ $p.name }}
        rules:
          {{- toYaml $p.rules | nindent 10 }}

    # -------------------------------------------------------------------------
    # RoleBinding — subject is the label value, used VERBATIM
    # -------------------------------------------------------------------------
    - excludedPaths:
        {{- toYaml $p.excludedPaths | nindent 8 }}
      objectTemplate: |
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: "{{ $group }}-rb"
          namespace: "{{ $ns }}"
          labels:
            app.kubernetes.io/managed-by: namespace-configuration-operator
            rbac.ocp.io/config-source: {{ $p.configSource }}
            rbac.ocp.io/role-type: {{ $p.roleType }}
            rbac.ocp.io/bound-role: {{ $p.roleName }}
            rbac.ocp.io/scope: namespace-scoped
            # THE SAME KEY EVERY POLICY USES for the bound group, so one query finds every grant to a
            # group across all of them:
            #   oc get rolebinding,clusterrolebinding -A -l rbac.ocp.io/group-name=<group>
            rbac.ocp.io/group-name: "{{ $group }}"
          annotations:
            # No group-pattern: this policy's group comes from a NAMESPACE LABEL, not from a name
            # pattern, so there is no wildcard to record. That absence is correct, not a gap.
            rbac.ocp.io/source-namespaceconfig: {{ $p.name }}
        subjects:
          - kind: Group
            name: "{{ $group }}"
            apiGroup: rbac.authorization.k8s.io
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: {{ $p.roleName }}
{{- end }}
