apiVersion: v2
name: namespace-configuration-operator
description: >-
  Installs the Red Hat CoP Namespace Configuration Operator (NCO) on OpenShift via
  OLM — a dedicated namespace, an AllNamespaces (global) OperatorGroup, and a
  Subscription. It can ALSO deploy RBAC policies (NamespaceConfig CRs) from
  namespaceConfigPolicy, one policy per flag and every one off by default; the raw
  manifests under ../policies stay the readable reference for those.
type: application
# 0.4.0, MINOR: a new template and a new TOP-LEVEL values stanza. `clusterRbac` renders one
# GroupConfig carrying the three cluster-wide tiers (admin/view/edit ClusterRoles bound to the
# -cluster-* groups). Its own key rather than a child of namespaceConfigPolicy, because it is a
# different CRD emitting ClusterRoleBindings — see values.yaml. Ships disabled, so nothing changes for
# an existing release.
#
# 0.3.0, MINOR: a new template and a new values stanza. `namespaceConfigPolicy.baseline` renders the
# nonprod and prod NamespaceConfigs — the standard access tiers every team receives. Nothing changes
# for an existing release: like every policy here, both ship disabled.
# 0.5.0, MINOR: a new template and a new top-level `extraGroupConfig` stanza — ADDITIONAL access on
# top of the baseline, reusing the roles the OpenShift monitoring stack already ships. It also FIXES a
# defect carried by the source policy: alert-routing-edit was bound as a Role when it is a ClusterRole,
# which produces a binding that is created, reports healthy, and grants nothing.
# `customGroupConfig` is reserved for a future stanza binding ClusterRoles we define ourselves.
version: 0.5.0
appVersion: "1.2.6"
home: https://github.com/ephico2real2/openshift-rbac-automation
keywords:
  - openshift
  - olm
  - rbac
  - namespace-configuration-operator
  - redhat-cop
maintainers:
  - name: ephico2real2
sources:
  - https://github.com/ephico2real2/openshift-rbac-automation
  - https://github.com/redhat-cop/namespace-configuration-operator
annotations:
  artifacthub.io/operator: "true"
  artifacthub.io/operatorCapabilities: Basic Install
