apiVersion: v2
name: namespace-configuration-operator
description: >-
  Installs the Red Hat CoP Namespace Configuration Operator (NCO) on OpenShift via
  OLM — a dedicated namespace, an AllNamespaces (global) OperatorGroup, and a
  Subscription. It can ALSO deploy RBAC policies (NamespaceConfig CRs) from
  namespaceConfigPolicy, one policy per flag and every one off by default; the raw
  manifests under ../policies stay the readable reference for those.
type: application
version: 0.2.0
appVersion: "1.2.6"
home: https://github.com/ephico2real2/openshift-rbac-automation
keywords:
  - openshift
  - olm
  - rbac
  - namespace-configuration-operator
  - redhat-cop
maintainers:
  - name: ephico2real2
sources:
  - https://github.com/ephico2real2/openshift-rbac-automation
  - https://github.com/redhat-cop/namespace-configuration-operator
annotations:
  artifacthub.io/operator: "true"
  artifacthub.io/operatorCapabilities: Basic Install
