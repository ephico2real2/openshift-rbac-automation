# CRC / local test cluster — every policy on.
#
# A per-cluster values file, replacing the five --set flags this release was previously installed with.
# The flags are recorded here instead so the enabled set is reviewable in git rather than living in
# someone's shell history, and so an upgrade cannot silently drop one.
#
# WHY THAT MATTERS MORE THAN IT SOUNDS: `helm upgrade` resets to chart defaults the moment either -f or
# --set is given. A flag omitted from a later command is a policy switched OFF, and switching a policy
# off is a REVOCATION — the CR carries a controller finalizer, so the operator deletes every object it
# created. With the set written down, that cannot happen by omission.
#
# Install or upgrade with:
#
#   helm upgrade --install nco charts/namespace-configuration-operator \
#     -n namespace-configuration-operator \
#     -f charts/namespace-configuration-operator/crc-values.yaml
#
# Everything else CRC needs is already the chart default and deliberately not repeated here:
# createNamespace: false (the namespace predates the chart), the operator resources sized for a
# single-node cluster, and operatorImage pointing at the quay build.

namespaceConfigPolicy:
  # The master switch, stated explicitly because this file is the record of what this cluster runs — a
  # reader should not have to open values.yaml to know whether policies are on.
  enabled: true

  # Namespace RBAC keyed on company.net/oud-group.
  #
  # The MASTER switch is on here; the individual policy is enabled below. values.yaml ships every policy
  # off, so this file is the record of what THIS cluster actually grants.
  oudGroup:
    enabled: true
    policies:
      # bdp is off in values.yaml. Turning it on is a per-cluster decision, so it lives here.
      #
      # Its CR name and config-source are DERIVED from this key: `bdp` gives bdp-oud-group-rbac for both.
      # So renaming the key renames the CR, and Helm treats that as delete-plus-create — the finalizer
      # revokes this policy's objects and rebuilds them. Rename deliberately, not while tidying.
      bdp:
        enabled: true

        # THE LABEL THIS POLICY KEYS ON, stated explicitly for the same reason the baseline's two keys
        # are below: this file is the record of what the cluster grants, and a reader should not have to
        # open values.yaml to learn which label decides it.
        #
        # It is deliberately NOT the baseline's mnemonic label. This policy selects on its own key and
        # reads the GROUP NAME from that label's value, so one namespace can be in the baseline's world
        # and this one at the same time without the two grants colliding.
        labelKey: company.net/oud-group

        # SHARED with `trino` below since 0.20.0, which is why both narrow. This policy takes the
        # spark family: label values starting bda-rbac-spark- (the guard appends the hyphen, so
        # bda-rbac-sparkles can never match). On this cluster that is oud-poc-spark's
        # bda-rbac-spark-theta-apps. The trailing -* spelling would mean the same; bare is used here.
        groupPrefix: bda-rbac-spark

      # The trino family, sharing company.net/oud-group with bdp above — the 0.20.0 capability this
      # cluster exists to exercise. A FULL policy body: per-policy fields do not inherit across map
      # keys, so everything bdp gets from values.yaml defaults must be stated here.
      #
      # CR name derives from the key: trino-oud-group-rbac. On this cluster it matches oud-poc-trino's
      # bda-rbac-trino-alpha-users.
      trino:
        enabled: true
        labelKey: company.net/oud-group
        # The -* spelling, deliberately different from bdp's bare one so this file demonstrates both
        # normalize to the same guard shape. Values starting bda-rbac-trino-.
        groupPrefix: bda-rbac-trino-*
        # Its OWN Role. Distinct from bdp's spark-job-submitter-role — with disjoint prefixes sharing
        # a roleName would be safe (the guards partition the namespaces), but distinct names keep
        # `oc get role -A -l rbac.ocp.io/config-source=...` unambiguous per family.
        roleName: trino-job-submitter-role
        roleType: trino-job-submitter
        excludedPaths:
          - .metadata
          - .status
        # Leaner than spark's deliberately: a trino workload reads and inspects, it does not manage
        # secrets or bulk-delete. The difference is also the point — two families on one labelKey
        # carrying genuinely different grants is what this feature is for.
        rules:
          - apiGroups: [""]
            resources:
              - pods
              - services
              - configmaps
            verbs:
              - create
              - get
              - list
              - watch
              - delete
          - apiGroups: [""]
            resources:
              - pods/log
            verbs:
              - get
              - list

  # The baseline every team receives. As of 0.9.0 nonprod grants developer + audit (admin removed) and
  # prod grants audit only (developer removed).
  baseline:
    enabled: true

    # THE TWO LABELS THIS CLUSTER KEYS ON, stated explicitly rather than inherited from values.yaml.
    # They are not decoration: mnemonicLabelKey both SELECTS the namespaces and supplies the mnemonic that
    # names the bound group, and environmentLabelKey is what partitions nonprod from prod. Get either
    # wrong and the policy either matches nothing or lets a prod namespace collect the nonprod grants — so
    # a per-cluster values file should say out loud which labels it depends on. The template refuses to
    # render if either is empty.
    mnemonicLabelKey: company.net/mnemonic
    environmentLabelKey: company.net/app-environment

# The cluster-wide tiers.
clusterRbac:
  enabled: true

# THE TWO GENUINE OVERRIDES are this and oudGroup.policies.bdp.enabled above — the only flags false in
# values.yaml, so without this line an upgrade with -f would switch it off and revoke the
# app-ocp-rbac-alpha-database-admin-crb binding. It stays on here because the LDAP group and the
# ClusterRole both exist on this cluster:
#   working-sessions/policies/database-admin-clusterrole.yaml
#   group-sync-operator-helm-chart/setup-local-ldap-testing/ldap-rbac-groups-database-admin.ldif
customGroupConfig:
  enabled: true
