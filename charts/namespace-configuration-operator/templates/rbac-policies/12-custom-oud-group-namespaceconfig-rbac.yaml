{{- if and .Values.namespaceConfigPolicy.enabled .Values.namespaceConfigPolicy.oudGroup.enabled }}
{{- $og := .Values.namespaceConfigPolicy.oudGroup }}
{{- if not $og.policies }}
{{- fail "namespaceConfigPolicy.oudGroup.policies is empty, so this would render nothing while the flag is on — a silent no-op. Give it at least one policy, or disable oudGroup." }}
{{- end }}
# =============================================================================
# NamespaceConfig — oud-group families, ONE CR PER POLICY
# =============================================================================
# Ranges over namespaceConfigPolicy.oudGroup.policies and renders a separate NamespaceConfig for each,
# exactly as 10-baseline- does for nonprod/prod, so each family gets its own CR.
#
# WHY A MAP OF POLICIES AND NOT AN `entries` LIST, which is what 13-custom-groupconfig- uses. An entries
# list renders multiple objectTemplates INSIDE ONE CR, and they all share that CR's single labelSelector.
# These policies each select on their OWN labelKey and define their OWN Role, so they cannot share a CR.
# Different selector -> different CR. That is also why two policies on the same labelKey are refused
# below: both would match the same namespaces and create the same RoleBinding name with different roles,
# and the operator would rewrite one over the other on every reconcile.
#
# CONTEXT INSIDE THE RANGE: `.` is the POLICY, not the chart root, so the shared label block is included
# as `$` — `include "nco.labels" $`. Using `.` there fails with "nil pointer evaluating interface
# {}.Name", which is how this was caught the first time.
# Converted from working-sessions/policies/oud-group-namespaceconfig.yaml, which STAYS in the repo as
# the readable reference and the record of why this access model exists. This file is the deployable
# form; that file is the explanation. Neither replaces the other.
#
# ── TWO TEMPLATE ENGINES, SAME { } DELIMITERS ──────────────────────────────
# Helm renders this file at install; the OPERATOR renders each objectTemplate later, once per matching
# namespace, where .Name is the namespace and .Labels are its labels. Expressions meant for the operator are BUILT AS STRINGS below so
# Helm cannot evaluate them — if it does, it tests an undefined .Name, renders the object away, and
# reports success. There is no error, only a missing grant.
#
# A `#` COMMENT IS NOT A HELM COMMENT — it is YAML, and Helm processes this file as text first, so an
# action inside one IS evaluated. Never `| quote` a built string either: the operator renders each
# objectTemplate as a Go template FIRST and parses YAML SECOND, so a backslash-quote breaks the parse.
#
# Full explanation, including how $group is derived three different ways:
#   working-sessions/docs/templating-guide.md
{{- $ns := "{{ .Name }}" }}
{{- range $key, $p := $og.policies }}
{{- if not $p.enabled }}
{{- else }}
{{- if not $p.labelKey }}
{{- fail (printf "namespaceConfigPolicy.oudGroup.policies.%s has no labelKey. It is the label the NamespaceConfig selects on AND the label whose VALUE becomes the bound group, so empty would select EVERY namespace and bind a group called \"\"." $key) }}
{{- end }}
{{- if not $p.roleName }}
{{- fail (printf "namespaceConfigPolicy.oudGroup.policies.%s has no roleName. The RoleBinding's roleRef names it, and a RoleBinding pointing at a Role that does not exist is created successfully, reports healthy, and grants NOTHING." $key) }}
{{- end }}
{{- if not $p.rules }}
{{- fail (printf "namespaceConfigPolicy.oudGroup.policies.%s has no rules, so it would create an empty Role that grants nothing while looking configured." $key) }}
{{- end }}
{{- /*
  ONE labelKey PER POLICY — a convention, not a render-time guard, because it cannot be one. The
  RoleBinding is named "<label value>-rb", and that value is read from a namespace at reconcile time, so
  Helm cannot know whether two policies would collide. Uniqueness is (namespace, name), which makes it a
  fact about the cluster rather than about values.

  IF TWO POLICIES DO SHARE A labelKey, the failure is silent — measured by trying it:
    - both Roles are created and coexist; only the RoleBinding is contested
    - the second policy creates ZERO RoleBindings, because roleRef is immutable:
        RoleBinding "…-rb" is invalid: roleRef: Invalid value: …: cannot change roleRef
    - the operator error-loops on that patch while the CR logs "resources processed successfully"

  So the CR reads healthy and the grant is absent. If a grant here is missing, grep the manager log for
  "cannot change roleRef" first.
*/ -}}
{{- /*
  NAME AND configSource ARE DERIVED FROM THE MAP KEY, so the key is the single place a policy's identity
  is written. values.yaml ships both as '' and this fills them in: key `abc` gives the CR name
  abc-oud-group-rbac and the config-source label abc-oud-group-rbac. Setting either explicitly overrides
  the derivation, which is the escape hatch for a policy that has to keep a name it already has on a
  cluster.

  THE CONSEQUENCE OF DERIVING, worth knowing before renaming a key: the CR name IS cluster identity, and
  Helm treats a renamed resource as delete-plus-create — the old CR's finalizer revokes every object it
  made and the new CR rebuilds them. So renaming a key here is not a cosmetic values edit; it is a
  revocation and rebuild of that policy's objects. Measured elsewhere in this chart at ~4s to revoke and
  ~50s to restore. Rename deliberately, not while tidying.
*/ -}}
{{- $name := $p.name | default (printf "%s-oud-group-rbac" $key) }}
{{- $group := printf "{{ index .Labels %s%s%s }}" "\"" $p.labelKey "\"" }}
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: NamespaceConfig
metadata:
  name: {{ $name }}
  labels:
    {{- include "nco.labels" $ | nindent 4 }}
    app.kubernetes.io/component: rbac-automation
    rbac.ocp.io/scope: namespace-scoped
    rbac.ocp.io/kind: NamespaceConfig
    # LDAP-backed, like every policy in this chart — the groups this binds are synced from the directory,
    # so `-l rbac.ocp.io/identity-source=ldap-groups` must find this one too.
    rbac.ocp.io/identity-source: ldap-groups
    # AND THE AXIS THAT MAKES THIS POLICY DIFFERENT: the group name is the namespace label's value,
    # verbatim, with no prefix and no tier suffix. The other three compute theirs from the naming
    # convention and are labelled `pattern`.
    rbac.ocp.io/group-naming: namespace-label
    # CUSTOM, because this policy DEFINES its own namespace-scoped Role from a permission set in
    # values — a workload submitter no built-in tier expresses. The baseline policies bind
    # OpenShift's admin/edit/view instead, and are labelled `baseline`. So the two kinds are one
    # query apart across both CRDs:
    #   oc get namespaceconfig,groupconfig -l rbac.ocp.io/policy-family=custom
    # Before this label existed, that query returned only 13-custom-'s CR and silently omitted this
    # one — the sort of gap that makes an inventory look complete when it is not.
    rbac.ocp.io/policy-family: custom
  annotations:
    # One description key, on every policy — the "no prefix is added" fact is stated selectably by
    # rbac.ocp.io/group-naming: namespace-label above, so it does not need a second annotation here.
    description: "Namespace RBAC: bind the group named by the {{ $p.labelKey }} label value, verbatim and with no prefix added"
    # After the operator is installed and its CSV is running. A NamespaceConfig applied before the CRD
    # exists fails the release; applied before the controller is up it simply sits there.
    argocd.argoproj.io/sync-wave: "3"
spec:
  labelSelector:
    matchExpressions:
      # The ONLY requirement. No mnemonic, no environment — the label says everything.
      - key: {{ $p.labelKey }}
        operator: Exists
  templates:
    # -------------------------------------------------------------------------
    # Namespace-scoped submitter Role
    # -------------------------------------------------------------------------
    - excludedPaths:
        {{- toYaml $p.excludedPaths | nindent 8 }}
      objectTemplate: |
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: {{ $p.roleName }}
          namespace: "{{ $ns }}"
          labels:
            # This is the Role, not a binding — so no group-name and no bound-role. A Role has no
            # subject to name, and it IS the role rather than referencing one. It is also one per
            # NAMESPACE, not one per group (fixed name {{ $p.roleName }}), so tying it to a single
            # group name would be wrong rather than merely redundant.
            app.kubernetes.io/managed-by: namespace-configuration-operator
            # The CR that created this object. A LABEL, so it can be selected on — see
            # working-sessions/docs/labels-and-annotations.md for the full contract.
            rbac.ocp.io/config-source: {{ $name }}
            # Which CRD owns it, so config-source and this pair up without a lookup. Also a label:
            #   oc get rolebinding,role -A -l rbac.ocp.io/source-kind=NamespaceConfig
            rbac.ocp.io/source-kind: NamespaceConfig
            rbac.ocp.io/role-type: {{ $p.roleType }}
            rbac.ocp.io/scope: namespace-scoped
          annotations:
            # THE CR THAT CREATED THIS OBJECT, in readable form. The same value is on the
            # rbac.ocp.io/config-source LABEL above, and that duplication is deliberate rather than
            # sloppy: the label is what you SELECT on, this is what you READ when you pull the object
            # with `oc get -o yaml` or `oc describe`, where annotations are shown and labels are easy to
            # skim past. The key name also carries which CRD owns it.
            #
            # It is also why the old `oc -l` trap is now harmless: if someone selects on this annotation
            # and gets nothing, the label beside it holds the identical value and does work.
            rbac.ocp.io/source-namespaceconfig: {{ $name }}
        rules:
          {{- toYaml $p.rules | nindent 10 }}

    # -------------------------------------------------------------------------
    # RoleBinding — subject is the label value, used VERBATIM
    # -------------------------------------------------------------------------
    - excludedPaths:
        {{- toYaml $p.excludedPaths | nindent 8 }}
      objectTemplate: |
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: "{{ $group }}-rb"
          namespace: "{{ $ns }}"
          labels:
            app.kubernetes.io/managed-by: namespace-configuration-operator
            # The CR that created this object. A LABEL, so it can be selected on — see
            # working-sessions/docs/labels-and-annotations.md for the full contract.
            rbac.ocp.io/config-source: {{ $name }}
            # Which CRD owns it, so config-source and this pair up without a lookup. Also a label:
            #   oc get rolebinding,role -A -l rbac.ocp.io/source-kind=NamespaceConfig
            rbac.ocp.io/source-kind: NamespaceConfig
            rbac.ocp.io/role-type: {{ $p.roleType }}
            rbac.ocp.io/bound-role: {{ $p.roleName }}
            rbac.ocp.io/scope: namespace-scoped
            # THE SAME KEY EVERY POLICY USES for the bound group, so one query finds every grant to a
            # group across all of them:
            #   oc get rolebinding,clusterrolebinding -A -l rbac.ocp.io/group-name=<group>
            rbac.ocp.io/group-name: "{{ $group }}"
          annotations:
            # The CR that created this object, readable. Same value as the config-source LABEL above:
            # the label is what you select on, this is what you read in `oc get -o yaml` / `oc describe`.
            # No group-pattern — this policy reads its group from a namespace label, not a wildcard.
            rbac.ocp.io/source-namespaceconfig: {{ $name }}
            # No group-pattern: this policy's group comes from a NAMESPACE LABEL, not from a name
            # pattern, so there is no wildcard to record. That absence is correct, not a gap.
        subjects:
          - kind: Group
            name: "{{ $group }}"
            apiGroup: rbac.authorization.k8s.io
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: {{ $p.roleName }}
{{- end }}
{{- end }}
{{- end }}
