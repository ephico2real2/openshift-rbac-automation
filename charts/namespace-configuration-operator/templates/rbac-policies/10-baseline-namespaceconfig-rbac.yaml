{{- if and .Values.namespaceConfigPolicy.enabled .Values.namespaceConfigPolicy.baseline.enabled }}
{{- $b := .Values.namespaceConfigPolicy.baseline }}
{{- if not $b.mnemonicLabelKey }}
{{- fail "namespaceConfigPolicy.baseline.mnemonicLabelKey is empty. It selects the namespaces AND supplies the mnemonic that names the bound group, so empty would match EVERY namespace and bind groups named from nothing. Set it, or disable the baseline." }}
{{- end }}
{{- if not $b.environmentLabelKey }}
{{- fail "namespaceConfigPolicy.baseline.environmentLabelKey is empty. It is what partitions nonprod from prod, so empty would let a prod namespace receive the nonprod grants — including ns-admin, which prod deliberately withholds. Set it, or disable the baseline." }}
{{- end }}
# =============================================================================
# NamespaceConfig — the BASELINE namespace RBAC every team receives
# =============================================================================
# Converted from working-sessions/policies/{nonprod,prod}-namespaceconfig-rbac.yaml, which STAY in the
# repo as the readable reference. This file is the deployable form; those are the explanation.
#
# ── WHY THIS FILE HOLDS TWO POLICIES AND 12-custom-oud-group- HOLDS ONE ──────────────
# SAME SHAPE -> ONE TEMPLATE. DIFFERENT SHAPE -> ITS OWN FILE.
#
# `nonprod` and `prod` differ only in DATA: which environments they select, which roles they grant,
# and which roles they grant. prod withholding ns-admin is a SHORTER LIST, not a different structure.
# So they share this template and are distinguished entirely in values.
#
# `oud-group` keeps its own file because it differs STRUCTURALLY — it creates a namespace-scoped Role
# instead of binding existing ClusterRoles, its selector is one expression, and its group name is the
# label value verbatim rather than a pattern. Merging it here would need conditionals, and conditionals
# are the complication this rule exists to prevent.
#
# WHEN THE NEXT POLICY ARRIVES: if it is the same shape, add it to values. If it needs an extra
# selector expression, a different subject kind, or its own Role, it gets its OWN numbered file — the
# way oud-group did. It does not get an `if` in here.
#
# ── WHY THESE BIND CLUSTERROLES RATHER THAN DEFINING ROLES ────────────────────
# admin / edit / view are OpenShift's built-in AGGREGATED ClusterRoles. A RoleBinding that references
# a ClusterRole grants those verbs in THAT NAMESPACE ONLY — which is the namespace-scoped grant.
# Re-implementing them as per-namespace Roles would create copies that drift silently as OpenShift
# adds APIs to the aggregation. oud-group defines its own Role only because a workload submitter is a
# bespoke permission set no built-in tier expresses. Standard tier -> bind a ClusterRole; bespoke set
# -> define a Role. ClusterRoleBindings are a different thing entirely and live in the GroupConfig
# policies, not here.
#
# ── TWO TEMPLATE ENGINES, SAME { } DELIMITERS ──────────────────────────────
# Helm renders this file at install; the OPERATOR renders each objectTemplate later, once per matching
# namespace, where .Name is the namespace and .Labels are its labels. Expressions meant for the operator are BUILT AS STRINGS below so
# Helm cannot evaluate them — if it does, it tests an undefined .Name, renders the object away, and
# reports success. There is no error, only a missing grant.
#
# A `#` COMMENT IS NOT A HELM COMMENT — it is YAML, and Helm processes this file as text first, so an
# action inside one IS evaluated. Never `| quote` a built string either: the operator renders each
# objectTemplate as a Go template FIRST and parses YAML SECOND, so a backslash-quote breaks the parse.
#
# Full explanation, including how $group is derived three different ways:
#   working-sessions/docs/templating-guide.md
{{- $ns := "{{ .Name }}" }}
{{- $mn := printf "{{ index .Labels %s%s%s }}" "\"" $b.mnemonicLabelKey "\"" }}
{{- $env := printf "{{ index .Labels %s%s%s }}" "\"" $b.environmentLabelKey "\"" }}
{{- range $key, $p := $b.policies }}
{{- if $p.enabled }}
{{- if not $p.roles }}
{{- fail (printf "namespaceConfigPolicy.baseline.policies.%s has no roles, so it would render a NamespaceConfig that selects namespaces and grants nothing — a silent no-op with the flag switched on. Give it roles, or disable it." $key) }}
{{- end }}
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: NamespaceConfig
metadata:
  name: {{ $p.name }}
  labels:
    {{- include "nco.labels" $ | nindent 4 }}
    app.kubernetes.io/component: rbac-automation
    rbac.ocp.io/scope: namespace-scoped
    rbac.ocp.io/kind: NamespaceConfig
    # WHERE THE IDENTITIES COME FROM, which the spec cannot tell you. A subject here is a Group name;
    # nothing in the manifest says that group is externally managed. It is: the app-ocp-rbac-* family is
    # synced from LDAP by GroupSync/ldap-groupsync, filter (&(objectClass=groupOfNames)(cn=app-ocp-rbac-*)).
    # Measured on this cluster — app-ocp-rbac-demo-ns-admin carries
    # openshift.io/ldap.uid: cn=app-ocp-rbac-demo-ns-admin,ou=Groups,dc=ephico2real,dc=com.
    #
    # WHICH MATTERS OPERATIONALLY: you change who holds this access in the DIRECTORY, not by editing a
    # RoleBinding. An edit here would be reverted by the next sync, and adding a user to the OpenShift
    # Group by hand is undone the same way.
    #
    # An earlier draft set this to "mnemonic-environment", which was filler — it restated the selector
    # printed a few lines below. A label should carry a fact the spec does not.
    rbac.ocp.io/identity-source: ldap-groups
    # HOW THE GROUP NAME IS DERIVED — a separate axis from where the identities come from, and separate
    # keys because every policy here is LDAP-backed while they do NOT all name groups the same way.
    # `pattern` means computed from the naming convention (prefix + mnemonic + tier); 12-custom-oud-group
    # sets `namespace-label` because it reads the name from a label value verbatim.
    rbac.ocp.io/group-naming: pattern
    # THE FAMILY, so the two halves are queryable as one thing:
    #   oc get namespaceconfig -l rbac.ocp.io/policy-family=built-in
    # A label rather than a rename. The CRs keep their environment names because on
    # `oc get namespaceconfig` the tier IS the identifying fact — and renaming a resource in a Helm
    # release deletes the old and creates the new, which for a NamespaceConfig means the controller's
    # finalizer revokes every RoleBinding it made before the replacement rebuilds them. Grouping is
    # not worth an access gap.
    rbac.ocp.io/policy-family: built-in
  annotations:
    description: {{ $p.description | quote }}
    # After the operator is installed and its CSV is running. A NamespaceConfig applied before the CRD
    # exists fails the release; applied before the controller is up it simply sits there.
    # WAVE 3, AND IT MUST STAY ABOVE THE SUBSCRIPTION'S WAVE (0). ArgoCD deletes in REVERSE wave order,
    # so a higher wave here means the policy CRs are removed FIRST on teardown — while the operator is
    # still running and can execute their finalizers. Drop this below the Subscription and teardown
    # deadlocks: the CRs sit in Terminating with a finalizer no controller is left to run, and their
    # objects are stranded. ci.yaml asserts the ordering so this cannot regress unnoticed.
    argocd.argoproj.io/sync-wave: "3"
    # ArgoCD dry-runs every resource BEFORE applying it, and a dry-run against a kind the cluster does not
    # serve yet fails with "the server could not find the requested resource" — which fails THE WHOLE SYNC,
    # not just this document. That is the exact shape of a first sync here: this CRD is not in the manifest
    # (it belongs to the operator's OLM bundle) and arrives mid-sync, when OLM installs the CSV in wave 0.
    # The ArgoCD docs call out this case explicitly — "the CRD is not part of the sync, but it could be
    # created in another way, e.g. by a controller in the cluster".
    #
    # It does NOT weaken validation once the operator is installed: "The dry run will still be executed if
    # the CRD is already present in the cluster." So on every sync after the first, this document is
    # dry-run exactly as before, and a malformed spec is still caught here rather than at apply time.
    #
    # It does NOT help plain `helm install`, which resolves every kind against API discovery before applying
    # anything and has no equivalent escape. That path still needs the two-step first install documented at
    # namespaceConfigPolicy.enabled in values.yaml.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  labelSelector:
    matchExpressions:
      # Any namespace that declares a mnemonic. The mnemonic also names the groups bound below.
      - key: {{ $b.mnemonicLabelKey }}
        operator: Exists
      # The partition. EXPLICIT allow-list, so an environment nobody has ruled on gets nothing rather
      # than falling into whichever policy happens to match.
      - key: {{ $b.environmentLabelKey }}
        operator: In
        values:
          {{- toYaml $p.environments | nindent 10 }}
      {{- if $p.excludeEnvironments }}
      # Redundant against the allow-list above, and kept deliberately: if somebody adds an excluded
      # environment to `environments` by mistake, this still refuses it. A second lock on the same
      # door, visible in values rather than assumed.
      - key: {{ $b.environmentLabelKey }}
        operator: NotIn
        values:
          {{- toYaml $p.excludeEnvironments | nindent 10 }}
      {{- end }}
  # NO excludedPaths DECLARED, AND THE OPERATOR ADDS ITS OWN ANYWAY. Measured on this cluster: the
  # live CR carries [.metadata, .status, .spec.replicas] on every template even though neither this
  # chart nor the source policy sends any, the CRD schema defines no default, and there is no mutating
  # webhook — the operator writes them into the spec on reconcile (CR generation goes 1 -> 2).
  #
  # Not mirrored here on purpose: .spec.replicas is meaningless for a RoleBinding, so writing it into
  # this policy would imply a field these objects do not have. The operator's default is its business.
  #
  # WHAT IT MEANS FOR YOU, and it is the same trap oud-group documents as GOTCHA 9: because .metadata
  # is excluded, editing labels or annotations in an objectTemplate below changes NOTHING on
  # RoleBindings that already exist. The operator reports success and the old metadata stays, so a
  # cluster ends up with two generations of it. Spec-level edits (subjects, roleRef) DO propagate.
  # To roll metadata forward, delete the objects and let the operator rebuild them. SELECT ON
  # config-source, which is a LABEL. source-namespaceconfig carries the same value but is an ANNOTATION,
  # and `oc -l` matches labels only — selecting on it returns nothing and the delete reads as a clean
  # no-op. Read the annotation, select on the label.
  #   oc delete rolebinding -A -l rbac.ocp.io/config-source=baseline-nonprod-rbac   # baseline-prod-rbac for the prod CR
  templates:
    {{- range $r := $p.roles }}
    {{- $group := printf "%s-%s-ns-%s" $b.groupPrefix $mn $r.name }}
    # ---------------------------------------------------------------------
    # {{ $r.name }} — binds ClusterRole/{{ $r.clusterRole }} in the namespace
    # ---------------------------------------------------------------------
    - objectTemplate: |
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: "{{ $mn }}-{{ $r.name }}-rb"
          namespace: "{{ $ns }}"
          labels:
            app.kubernetes.io/managed-by: namespace-configuration-operator
            # The CR that created this object. A LABEL, so it can be selected on — see
            # working-sessions/docs/labels-and-annotations.md for the full contract.
            rbac.ocp.io/config-source: {{ $p.name }}
            # Which CRD owns it, so config-source and this pair up without a lookup. Also a label:
            #   oc get rolebinding,role -A -l rbac.ocp.io/source-kind=NamespaceConfig
            rbac.ocp.io/source-kind: NamespaceConfig
            rbac.ocp.io/role-type: ns-{{ $r.name }}
            rbac.ocp.io/bound-role: {{ $r.clusterRole }}
            rbac.ocp.io/scope: namespace-scoped
            rbac.ocp.io/group-name: "{{ $group }}"
            rbac.ocp.io/mnemonic: "{{ $mn }}"
            rbac.ocp.io/environment: "{{ $env }}"
          annotations:
            # THE CR THAT CREATED THIS OBJECT, in readable form. The same value is on the
            # rbac.ocp.io/config-source LABEL above, and that duplication is deliberate rather than
            # sloppy: the label is what you SELECT on, this is what you READ when you pull the object
            # with `oc get -o yaml` or `oc describe`, where annotations are shown and labels are easy to
            # skim past. The key name also carries which CRD owns it.
            #
            # It is also why the old `oc -l` trap is now harmless: if someone selects on this annotation
            # and gets nothing, the label beside it holds the identical value and does work.
            rbac.ocp.io/source-namespaceconfig: {{ $p.name }}
            # NO group-pattern on this policy: it computes a CONCRETE group name, not a wildcard, and
            # that name is the rbac.ocp.io/group-name LABEL above where it can be selected on. The
            # annotation exists only on the two GroupConfig policies, whose value really is a pattern.
        subjects:
        - kind: Group
          name: "{{ $group }}"
          apiGroup: rbac.authorization.k8s.io
        roleRef:
          kind: ClusterRole
          name: {{ $r.clusterRole }}
          apiGroup: rbac.authorization.k8s.io
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
