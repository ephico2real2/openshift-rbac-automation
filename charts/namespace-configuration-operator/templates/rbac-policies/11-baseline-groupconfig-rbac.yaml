{{- if .Values.clusterRbac.enabled }}
{{- $c := .Values.clusterRbac }}
{{- if not $c.syncProviderLabelKey }}
{{- fail "clusterRbac.syncProviderLabelKey is empty. It is the ONLY thing narrowing this policy to synced groups, so empty would select every Group on the cluster — including local ones nobody intended to grant cluster-wide access to. Set it, or disable clusterRbac." }}
{{- end }}
{{- if not $c.groupPrefix }}
{{- fail "clusterRbac.groupPrefix is empty. It documents which group family this policy is for, on the rbac.ocp.io/group-pattern annotation. Set it, or disable clusterRbac." }}
{{- end }}
{{- if not $c.roles }}
{{- fail "clusterRbac.roles is empty, so this would render a GroupConfig that selects every synced group and grants nothing — a silent no-op with the flag switched on. Give it roles, or disable clusterRbac." }}
{{- end }}
# =============================================================================
# GroupConfig — the BASELINE cluster-wide RBAC
# =============================================================================
# Converted from working-sessions/policies/cluster-{admin,audit,developer}-groupconfig-rbac.yaml,
# which STAY in the repo as the readable reference. This file is the deployable form.
#
# ── A DIFFERENT CRD AND A DIFFERENT SCOPE FROM 10-baseline- ───────────────────
# That file is NamespaceConfig, keyed on a NAMESPACE, emitting RoleBindings. This is GroupConfig,
# keyed on a GROUP, emitting ClusterRoleBindings. Inside an objectTemplate here `.Name` is the GROUP
# name, not a namespace. Do not carry assumptions between the two.
#
# ── THREE SOURCE FILES, ONE CR ────────────────────────────────────────────────
# The three sources share an IDENTICAL labelSelector and differ only in the suffix each guards on,
# the ClusterRole it binds, and the labels derived from those. spec.templates is an ARRAY, so one CR
# carries all three and the per-template guard does the narrowing — the same construction
# 10-baseline- uses for its per-role templates, which is why the filenames are parallel.
#
# A TEMPLATE THAT DOES NOT MATCH RENDERS EMPTY, and the operator is fine with that. Measured before
# this file existed: 63 synced groups against the three original CRs is 189 template evaluations
# producing 12 ClusterRoleBindings, so 177 already rendered empty with no ill effect. Consolidating
# changed the count, not the mechanism.
#
# ── TWO TEMPLATE ENGINES, SAME { } DELIMITERS ──────────────────────────────
# Helm renders this file at install; the OPERATOR renders each objectTemplate later, once per matching
# group, where .Name is the GROUP name, not a namespace. Expressions meant for the operator are BUILT AS STRINGS below so
# Helm cannot evaluate them — if it does, it tests an undefined .Name, renders the object away, and
# reports success. There is no error, only a missing grant.
#
# A `#` COMMENT IS NOT A HELM COMMENT — it is YAML, and Helm processes this file as text first, so an
# action inside one IS evaluated. Never `| quote` a built string either: the operator renders each
# objectTemplate as a Go template FIRST and parses YAML SECOND, so a backslash-quote breaks the parse.
#
# Full explanation, including how $group is derived three different ways:
#   working-sessions/docs/templating-guide.md
{{- $group := "{{ .Name }}" }}
{{- $endif := "{{- end }}" }}
apiVersion: redhatcop.redhat.io/v1alpha1
kind: GroupConfig
metadata:
  name: {{ $c.name }}
  labels:
    {{- include "nco.labels" . | nindent 4 }}
    # ONE value across all four policies, so a single query finds the whole set. The axes that might
    # tempt you to vary it — scope, family — each have their own key below.
    app.kubernetes.io/component: rbac-automation
    rbac.ocp.io/scope: cluster-wide
    rbac.ocp.io/kind: GroupConfig
    # Identities come from the directory, which the spec cannot tell you: a subject here is a Group
    # name, and nothing in the manifest says it is externally managed. The group family is synced from
    # LDAP by GroupSync, which is also what puts the selector label below on each Group. So you change
    # who holds this access in the DIRECTORY — an edit to a ClusterRoleBinding is reverted by the next
    # reconcile, and adding a user to the OpenShift Group by hand is undone by the next sync.
    rbac.ocp.io/identity-source: ldap-groups
    rbac.ocp.io/group-naming: pattern
    # THE FAMILY, and the value names WHAT IS BOUND rather than the policy's standing: these bind
    # OpenShift's BUILT-IN aggregated ClusterRoles (admin / edit / view), where the `custom` family
    # binds roles defined outside the platform. That is the distinction an auditor cares about — a
    # built-in role's contents are Red Hat's and move with the release; a custom one is ours.
    #   oc get groupconfig,namespaceconfig -l rbac.ocp.io/policy-family=built-in
    #   oc get groupconfig,namespaceconfig -l rbac.ocp.io/policy-family=custom
    # The FILENAMES still say `baseline`, which is the other true thing about them: built-in describes
    # the roles, baseline describes the fact that every team gets these.
    rbac.ocp.io/policy-family: built-in
  annotations:
    description: {{ $c.description | quote }}
    # After the operator is installed and its CSV is running. A GroupConfig applied before the CRD
    # exists fails the release; applied before the controller is up it simply sits there.
    argocd.argoproj.io/sync-wave: "3"
spec:
  labelSelector:
    matchExpressions:
      # SYNCED GROUPS ONLY. GroupSync puts this label on every Group it manages, so this excludes
      # locally-created Groups — which must not collect cluster-wide access from a directory policy.
      - key: {{ $c.syncProviderLabelKey }}
        operator: Exists
  templates:
    {{- range $r := $c.roles }}
    {{- if not $r.clusterRole }}
    {{- fail (printf "clusterRbac.roles entry %q has no clusterRole, so it would render a ClusterRoleBinding whose roleRef names nothing — it grants no access while looking configured. Give it one, or remove the entry." $r.name) }}
    {{- end }}
    {{- $suffix := printf "-cluster-%s" $r.name }}
    {{- $guard := printf "{{- if hasSuffix %s%s%s .Name }}" "\"" $suffix "\"" }}
    # ---------------------------------------------------------------------
    # {{ $r.name }} — groups ending {{ $suffix }} get ClusterRole/{{ $r.clusterRole }}, cluster-wide
    # ---------------------------------------------------------------------
    - objectTemplate: |
        {{ $guard }}
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: "{{ $group }}-crb"
          labels:
            app.kubernetes.io/managed-by: namespace-configuration-operator
            # The CR that created this object. A LABEL, so it can be selected on — see
            # working-sessions/docs/labels-and-annotations.md for the full contract.
            rbac.ocp.io/config-source: {{ $c.name }}
            # Which CRD owns it, so config-source and this pair up without a lookup. Also a label:
            #   oc get rolebinding,role -A -l rbac.ocp.io/source-kind=NamespaceConfig
            rbac.ocp.io/source-kind: GroupConfig
            rbac.ocp.io/role-type: cluster-{{ $r.name }}
            rbac.ocp.io/bound-role: {{ $r.clusterRole }}
            rbac.ocp.io/scope: cluster-wide
            rbac.ocp.io/group-name: "{{ $group }}"
          annotations:
            rbac.ocp.io/source-groupconfig: {{ $c.name }}
            # A REAL WILDCARD — this is the expression the operator matched groups against. Only the
            # GroupConfig policies set this; the namespace-keyed ones compute a concrete name instead and
            # put it in the group-name label.
            rbac.ocp.io/group-pattern: "{{ $c.groupPrefix }}-*{{ $suffix }}"
        subjects:
        - kind: Group
          name: "{{ $group }}"
          apiGroup: rbac.authorization.k8s.io
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: {{ $r.clusterRole }}
        {{ $endif }}
    {{- end }}
{{- end }}
