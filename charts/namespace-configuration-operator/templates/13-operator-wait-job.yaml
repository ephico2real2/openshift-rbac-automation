{{- if .Values.operatorWait.enabled }}
# Blocks until the operator can actually serve NamespaceConfig and GroupConfig, so nothing downstream acts
# on a cluster where the CRDs are not yet established.
#
# WHY THIS EXISTS. The Subscription is an ordinary resource, so Helm creates it and moves on — OLM then
# resolves it, approves or waits for an InstallPlan, installs the CSV and starts the operator, all
# asynchronously. Everything after that point in this chart assumes the operator is serving:
#
#   the policy CRs        are NamespaceConfig/GroupConfig objects, and the apiserver only serves those kinds
#                         once their CRDs report Established
#   the orphan sweeper    lists those same kinds to decide what to delete; against a cluster where they are
#                         not served yet it would see nothing and draw conclusions from it
#
# TWO ORDERING MECHANISMS, both required, because they solve the same problem in different tools:
#
#   helm.sh/hook-weight: 6     runs after the InstallPlan approver (5), which is what lets OLM install the
#                              CSV in the first place, and before the image override (10) and the sweeper
#                              (20). Under plain Helm this is the only ordering that exists.
#   argocd sync-wave: 2        after the Subscription (0) and the approver (1), BEFORE the policy CRs (3).
#                              ArgoCD waits for each wave to be healthy before starting the next, so a
#                              failing wait here stops the CRs being applied at all — which is the
#                              behaviour a declarative sync needs and hook weights cannot provide.
#
# WHAT IT DOES NOT FIX, so nobody looks for it here: a FIRST install on a cluster with no operator still
# needs the policy flags off, because Helm resolves every kind against API discovery before applying
# anything — earlier than any hook, at any weight. See namespaceConfigPolicy.enabled in values.yaml for the
# two commands. This Job is what makes that first step trustworthy: it does not return until the CRDs are
# established, so the second command cannot race it.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nco.operatorWait.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nco.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator-wait
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    # A Job's spec.template is immutable, so the previous run must be deleted before the next is created or
    # the sync fails with "field is immutable". HookSucceeded keeps a failed run for its log.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    # NO sync-options here, deliberately, though the sibling group-sync chart carries
    # `SkipDryRunOnMissingResource=true,Replace=true` on its equivalent Job. Both are valid options and
    # neither does anything for THIS resource, checked against the ArgoCD docs rather than copied:
    #   SkipDryRunOnMissingResource  exists for "new custom resource types" — a dry-run against a CRD
    #                                that is not installed fails the whole sync. This is a batch/v1 Job,
    #                                a built-in kind that is always present, so there is nothing to skip.
    #   Replace                      makes ArgoCD use `kubectl replace`/`create` instead of `apply`, to
    #                                get past a Job's immutable spec.template. BeforeHookCreation above
    #                                already deletes the previous hook before creating this one, so the
    #                                immutable-field case cannot arise — and the docs warn Replace "has
    #                                the potential to be destructive".
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "6"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.operatorWait.backoffLimit }}
  # Bounds the whole Job rather than one attempt, so a cluster that never converges fails visibly instead of
  # retrying until the Helm hook times out with no explanation of its own. Just above the script's own
  # budget, so the script's message is the one you see.
  activeDeadlineSeconds: {{ add .Values.operatorWait.waitSeconds 120 }}
  ttlSecondsAfterFinished: {{ .Values.operatorWait.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "nco.labels" . | nindent 8 }}
        app.kubernetes.io/component: operator-wait
    spec:
      serviceAccountName: {{ include "nco.operatorWait.name" . }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wait-for-operator
          image: {{ .Values.operatorImage.job.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # oc writes a cache under $HOME and the root filesystem is read-only.
            - name: HOME
              value: /tmp
          command:
            - /bin/bash
            - -c
            - |
              # No `set -e`: each check reports its own failure with the command to run next, which is more
              # use than an exit code.
              set -uo pipefail

              # `required` rather than a plain lookup on both of these. A misspelled values key renders as an
              # EMPTY string, and an empty identifier does not fail — it makes every query match nothing, so
              # the Job runs its full budget and then reports "no CSV reached Succeeded", which reads as an OLM
              # or InstallPlan problem. That is a five-minute wait and a wrong diagnosis for a typo. `required`
              # turns the same mistake into a render-time error naming the key.
              NAMESPACE="{{ required "operatorWait: .Values.namespace must be set" .Values.namespace }}"
              SUBSCRIPTION="{{ required "operatorWait: .Values.subscription.packageName must be set" .Values.subscription.packageName }}"
              DEPLOYMENT="{{ required "operatorWait: .Values.operatorImage.csvDeploymentName must be set" .Values.operatorImage.csvDeploymentName }}"
              # Both kinds this chart's policies use. Waiting on only one would let a GroupConfig be applied
              # against an apiserver that does not serve it yet.
              CRDS="namespaceconfigs.redhatcop.redhat.io groupconfigs.redhatcop.redhat.io"

              # max 1: integer division makes any waitSeconds below 5 render 0 attempts, and `seq 1 0` is
              # empty — every loop would be skipped and the Job would fail instantly, blaming OLM for a
              # values typo. The wall-clock deadline still caps the total, so a floor of one is safe.
              ATTEMPTS={{ max 1 (div .Values.operatorWait.waitSeconds 5) }}
              INTERVAL=5

              # ONE budget shared by every check, which is what waitSeconds promises. ATTEMPTS is computed
              # once and used by three loops, so without this each check could take the full budget and the
              # total could reach 3x the documented number — at which point activeDeadlineSeconds kills the
              # pod part-way with no message of its own.
              DEADLINE=$(( $(date +%s) + {{ .Values.operatorWait.waitSeconds }} ))
              out_of_time() { [ "$(date +%s)" -ge "$DEADLINE" ]; }

              log()  { printf '%s  [operator-wait] %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$*"; }
              fail() { printf '[operator-wait] FAILED: %s\n' "$*" >&2; exit 1; }

              # Ask the Subscription which CSV it installed rather than matching CSV names by prefix. OLM sets
              # .status.installedCSV to the exact name, so this survives every version bump without the chart
              # knowing the version — the same reason 03-image-override-rbac.yaml reads it to find its patch
              # target. A prefix match would also have to assume the CSV name begins with the package name,
              # which is true for this operator but is not a rule OLM enforces.
              installed_csv() {
                oc get subscription "$SUBSCRIPTION" -n "$NAMESPACE" --ignore-not-found=true \
                   -o jsonpath='{.status.installedCSV}' 2>/dev/null
              }
              csv_phase() {
                oc get csv "$1" -n "$NAMESPACE" --ignore-not-found=true \
                   -o jsonpath='{.status.phase}' 2>/dev/null
              }
              deploy_ready() {
                oc get deploy "$DEPLOYMENT" -n "$NAMESPACE" --ignore-not-found=true \
                   -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo 0
              }
              crd_established() {
                oc get crd "$1" --ignore-not-found=true \
                   -o jsonpath='{.status.conditions[?(@.type=="Established")].status}' 2>/dev/null || echo "False"
              }

              log "namespace=${NAMESPACE} subscription=${SUBSCRIPTION} budget={{ .Values.operatorWait.waitSeconds }}s"

              # --- 1. the CSV ---------------------------------------------------------------------------
              # Both halves in ONE loop, because they are the same wait from a user's point of view and
              # splitting them would let each consume the shared budget in turn. installedCSV appearing is the
              # step that blocks on InstallPlan approval; the phase reaching Succeeded is the step that blocks
              # on the install itself. The log line names which of the two we are still on, so a stall is
              # diagnosable from the log alone.
              echo "=== Waiting for the ${SUBSCRIPTION} Subscription to report a Succeeded CSV ==="
              CSV=""; PHASE=""
              for i in $(seq 1 "$ATTEMPTS"); do
                CSV="$(installed_csv)"
                if [ -n "$CSV" ]; then
                  PHASE="$(csv_phase "$CSV")"
                  [ "$PHASE" = "Succeeded" ] && { log "csv=${CSV} phase=Succeeded"; break; }
                  log "attempt ${i}/${ATTEMPTS}: csv=${CSV} phase=${PHASE:-<no phase yet>}"
                else
                  log "attempt ${i}/${ATTEMPTS}: subscription has no .status.installedCSV yet"
                fi
                out_of_time && break
                sleep "$INTERVAL"
              done
              [ "$PHASE" = "Succeeded" ] || fail "the ${SUBSCRIPTION} Subscription has no Succeeded CSV (installedCSV='${CSV:-<empty>}', phase='${PHASE:-<none>}').
                Inspect: oc get csv,subscription,installplan -n ${NAMESPACE}
                An empty installedCSV points at the InstallPlan, not the install: installPlanApproval Manual
                with the approver disabled leaves it unapproved forever — check
                subscription.autoApproveInstallPlan.enabled."

              # --- 2. a ready replica ------------------------------------------------------------------
              # A Succeeded CSV is not enough: the pod can be in CrashLoopBackOff while the CSV still says
              # Succeeded, which is exactly the state an image override can produce.
              echo "=== Waiting for ${DEPLOYMENT} to have a ready replica ==="
              READY=0
              for i in $(seq 1 "$ATTEMPTS"); do
                READY="$(deploy_ready)"
                [ "${READY:-0}" -ge 1 ] 2>/dev/null && { log "${DEPLOYMENT} ready=${READY}"; break; }
                log "attempt ${i}/${ATTEMPTS}: ready=${READY:-0}"
                out_of_time && break
                sleep "$INTERVAL"
              done
              [ "${READY:-0}" -ge 1 ] 2>/dev/null || fail "${DEPLOYMENT} has no ready replica.
                Inspect: oc get pods -n ${NAMESPACE}
                         oc logs -n ${NAMESPACE} deploy/${DEPLOYMENT} -c manager --tail=100"

              # --- 3. the CRDs --------------------------------------------------------------------------
              # Established is the condition that says the apiserver serves the kind. Anything applying a
              # NamespaceConfig or GroupConfig before this is true fails on discovery.
              for crd in $CRDS; do
                echo "=== Waiting for CRD ${crd} to be Established ==="
                EST="False"
                for i in $(seq 1 "$ATTEMPTS"); do
                  EST="$(crd_established "$crd")"
                  [ "$EST" = "True" ] && { log "${crd} Established"; break; }
                  log "attempt ${i}/${ATTEMPTS}: ${crd} Established=${EST:-<not present yet>}"
                  out_of_time && break
                  sleep "$INTERVAL"
                done
                [ "$EST" = "True" ] || fail "CRD ${crd} is not Established.
                  Inspect: oc get crd ${crd} -o yaml
                  A Succeeded CSV that did not create this CRD usually means the wrong package is installed."
              done

              # A CLOSING LINE THAT SAYS IT FINISHED, then commands labelled as commands.
              #
              # These are NOT run here and their output is NOT shown, deliberately. This SA cannot read either
              # kind — it is scoped to the CSV, the Subscription, the operator Deployment and two CRDs by name,
              # because waiting is all it does. And `oc get ... 2>/dev/null | wc -l` renders a Forbidden as `0`,
              # so a count printed here would read "0 policy CR(s) present" on a cluster holding five (measured
              # exactly that: 5 as cluster-admin, 0 as this SA). A log line indistinguishable from a permissions
              # error is worse than no line at all — it is the same conflation that let 0.19.1's sweeper treat
              # Forbidden as not-found and delete every RoleBinding it managed.
              #
              # The earlier version printed the two commands as bare trailing log lines, which made a successful
              # run look like a log that had been cut off mid-write. Hence the explicit terminal banner and the
              # "run these yourself" framing: the last thing in the log now states the outcome.
              ELAPSED=$(( $(date +%s) - (DEADLINE - {{ .Values.operatorWait.waitSeconds }}) ))
              echo "=== operator-wait: SUCCESS — CSV Succeeded, ${DEPLOYMENT} ready, both CRDs Established (${ELAPSED}s) ==="
              echo "    The policy CRs can now be applied. Nothing further runs in this Job."
              echo
              echo "    To see what the operator does with them, run these yourself — this Job has no"
              echo "    permission to read either kind, so it prints the commands rather than a count it"
              echo "    cannot actually measure:"
              echo "      oc get namespaceconfig,groupconfig"
              echo "      oc get rolebinding,clusterrolebinding -A -l app.kubernetes.io/managed-by=namespace-configuration-operator"
          resources:
            {{- toYaml .Values.operatorWait.resources | nindent 12 }}
{{- end }}
