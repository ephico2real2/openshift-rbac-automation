{{- if .Values.orphanSweeper.enabled }}
# Deletes RBAC objects whose owning policy CR no longer exists.
#
# WHY THIS IS NEEDED — measured, not hypothetical. Two ways objects outlive their policy:
#
#   1. THE OPERATOR IS DOWN WHEN A CR IS DELETED. It processes the deletion on restart, but the
#      per-object controllers for those objects are already gone, so some objects survive. Observed
#      exactly this: 3 CRs deleted while the operator was restarting left 20 RoleBindings alive, still
#      granting, with no owning policy. `oc get` looks healthy — the objects carry valid-looking
#      provenance pointing at a CR that is not there.
#
#   2. A TEMPLATE IS REMOVED FROM A CR rather than the CR being deleted. Dropping ns-admin from the
#      baseline left 6 of its 10 RoleBindings alive, still granting ClusterRole/admin. The operator
#      shuts down that object's controller ("Shutdown signal received") without deleting the object.
#
#   Neither case is cleaned up by anything: the objects have NO ownerReferences, so Kubernetes GC never
#   collects them, and no future reconcile touches them. Case 2 is not detectable from provenance alone
#   (the CR still exists), so this sweeper addresses case 1 — the one ArgoCD pruning can cause.
#
# WHY IT RUNS UNDER ARGOCD. A declarative sync has nobody to notice a dangling grant. The sweeper runs
# PostSync, so orphans produced by that same sync's pruning are cleaned in the same sync.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nco.orphanSweeper.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nco.labels" . | nindent 4 }}
    app.kubernetes.io/component: orphan-sweeper
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  sweep-orphans.sh: |
    #!/bin/bash
    set -euo pipefail

    log()  { printf '%s  %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$*"; }
    fail() { log "ERROR: $*"; exit 1; }

    # DELETE ONE OBJECT, WITH RETRIES AND A PAUSE. Shared by both sweeps below so the pacing cannot drift
    # between them — the first revokes grants whose policy is gone, the second revokes bindings whose Role
    # is gone, and both are writes against the same apiserver the operator is reconciling.
    #
    # Only the LAST attempt keeps stderr. An earlier failure is usually a conflict with the operator's own
    # reconcile of the same object and is expected to succeed on retry; printing it three times would make a
    # healthy run look broken, while discarding the last one would hide a real failure.
    #
    # Returns non-zero when every attempt failed, so the CALLER counts it. There is no global counter in
    # here on purpose: this used to be inlined in a `printf | while read` pipeline, which runs in a SUBSHELL
    # where an incremented counter is discarded — every delete could fail and the run would still report
    # success.
    delete_one() {   # $1 kind (fully qualified)  $2 name  $3 namespace, empty for cluster-scoped
      _k="$1"; _n="$2"; _ns="${3:-}"
      _attempt=1
      while :; do
        if [ "$_attempt" -ge "$RETRIES" ]; then
          if [ -n "$_ns" ]; then
            oc delete "$_k" "$_n" -n "$_ns" --ignore-not-found 2>&1 | sed 's/^/    /' && return 0
          else
            oc delete "$_k" "$_n" --ignore-not-found 2>&1 | sed 's/^/    /' && return 0
          fi
          return 1
        fi
        if [ -n "$_ns" ]; then
          oc delete "$_k" "$_n" -n "$_ns" --ignore-not-found >/dev/null 2>&1 && return 0
        else
          oc delete "$_k" "$_n" --ignore-not-found >/dev/null 2>&1 && return 0
        fi
        log "        attempt ${_attempt}/${RETRIES} failed, retrying in ${RETRY_DELAY}s"
        _attempt=$((_attempt+1))
        sleep "$RETRY_DELAY"
      done
    }

    # ORPHAN_LIMIT is required alongside the other two: an UNSET limit used to default to 0, which means
    # "no cap" — so running this script outside the Job (a runbook, a debug pod) silently discarded the
    # blast-radius guard values.yaml promises. Required-and-numeric makes 0 an explicit choice, never an
    # accident of a missing env var or a typo'd value.
    : "${MANAGED_BY:?}" "${DRY_RUN:?}" "${ORPHAN_LIMIT:?}" "${PAUSE_SECONDS:?}" "${RETRIES:?}" "${RETRY_DELAY:?}"
    case "$ORPHAN_LIMIT" in ''|*[!0-9]*) fail "ORPHAN_LIMIT must be a whole number (0 disables the cap), got '${ORPHAN_LIMIT}' — refusing to run without a working blast-radius guard";; esac

    # A HEADER THAT STATES WHAT THIS RUN WILL DO, before it does any of it. Reading a sweeper log after the
    # fact, the first question is always "what was it configured to do" — a cap that silently refused, or a
    # dry run that explains why nothing was deleted, are both invisible unless the settings are printed.
    log "=========================================================================="
    log "ORPHAN SWEEPER"
    log "  selects       objects labelled app.kubernetes.io/managed-by=${MANAGED_BY}"
    log "                AND carrying rbac.ocp.io/config-source=<the CR that should own it>"
    log "  deletes       only those whose named CR does not exist"
    log "  leaves        anything with no config-source label — not ours to reason about"
    if [ "$DRY_RUN" = "true" ]; then
      log "  mode          DRY RUN — nothing will be deleted"
    else
      log "  mode          LIVE — orphans will be deleted"
    fi
    if [ "$ORPHAN_LIMIT" -gt 0 ]; then
      log "  circuit break refuse the run if more than ${ORPHAN_LIMIT} orphans are found (orphanSweeper.limit)"
    else
      log "  circuit break none (orphanSweeper.limit=0) — the sweep completes however large it is"
    fi
    log "  pacing        ${PAUSE_SECONDS}s between deletes, up to ${RETRIES} attempts each, ${RETRY_DELAY}s apart"
    log "=========================================================================="

    # Which policy CRs currently exist, in ANY state. A CR mid-deletion still counts as existing: its
    # finalizer is running and revoking its own objects, so sweeping underneath it would be racing the
    # operator for no benefit.
    #
    # A FAILED LOOKUP IS NOT AN EMPTY RESULT. These used to end in `2>/dev/null || true`, which turned
    # any API error into "no policy CRs exist" — and every managed object would then look orphaned.
    # ORPHAN_LIMIT would have caught the resulting mass deletion, but a limit is a backstop, not a
    # diagnosis. Abort instead; the API's own message goes to the log on stderr, just above the abort.
    #
    # STDOUT ONLY on every capture in this script, deliberately: oc prints warnings to STDERR with
    # rc=0, and a warning merged into a parsed result becomes a phantom data row — or, on the named-role
    # probe below, makes an ABSENT Role read as PRESENT. Anything oc says that is not data belongs in
    # the pod log, not in a variable.
    # NAMED IN FULL, and this is the call where it matters most. These two lists decide which
    # managed RoleBindings still have a policy behind them — everything NOT listed here is
    # treated as an orphan and deleted. A short name can bind to another API group (measured
    # elsewhere in this chart: `oc get subscription` resolved to messaging.knative.dev and
    # returned Forbidden), and a misrouted list returns NOTHING rather than failing. That would
    # make every managed object look orphaned — which is exactly the 0.19.1 bug that deleted all
    # 42 of them, reachable again through a name collision instead of a missing verb.
    NCS="$(oc get namespaceconfigs.redhatcop.redhat.io -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')" \
      || fail "cannot list namespaceconfigs, so which CRs are alive is unknown and NOTHING will be swept — the API's error is printed above"
    GCS="$(oc get groupconfigs.redhatcop.redhat.io -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')" \
      || fail "cannot list groupconfigs, so which CRs are alive is unknown and NOTHING will be swept — the API's error is printed above"
    EXISTING="$(printf '%s\n%s\n' "$NCS" "$GCS" | sed '/^$/d')"
    log ""
    log "--- PHASE 1/4: DISCOVER LIVE POLICY CRs ----------------------------------"
    log "  These are the owners. Any managed object naming something NOT in this list is an orphan,"
    log "  so an incomplete list here becomes a mass deletion downstream — which is why a failed"
    log "  lookup aborts above instead of reading as 'no CRs exist'."
    # `printf '%s\n'`, NOT `printf '%s'`. Command substitution strips every trailing newline, so $NCS is
    # "a\nb\nc" with nothing after the last entry — `wc -l` then counts SEPARATORS and reports one fewer,
    # and `while read` exits before the body runs for the final line. Measured: 5 live CRs displayed as "4"
    # with one missing from each list, while the sweep itself was correct because grep -qxF does not care.
    # A count that is quietly one short is worse than no count, in a log whose whole job is to be believed.
    NC_COUNT="$(printf '%s\n' "$NCS" | sed '/^$/d' | wc -l | tr -d ' ')"
    GC_COUNT="$(printf '%s\n' "$GCS" | sed '/^$/d' | wc -l | tr -d ' ')"
    log "  namespaceconfigs.redhatcop.redhat.io : ${NC_COUNT}"
    printf '%s\n' "$NCS" | sed '/^$/d' | while read -r c; do log "      ${c}"; done
    log "  groupconfigs.redhatcop.redhat.io     : ${GC_COUNT}"
    printf '%s\n' "$GCS" | sed '/^$/d' | while read -r c; do log "      ${c}"; done
    log "  live policy CRs total: $(printf '%s\n' "$EXISTING" | sed '/^$/d' | wc -l | tr -d ' ')"

    # The cap below guards against a run whose CR list is legitimately EMPTY or legitimately WRONG for
    # the objects on the cluster — every flag switched off by a bad -f upgrade, or a label-value
    # migration where existing objects still carry a config-source no CR matches (measured at 0.16.0:
    # 36 stale objects, and this cap turned the mass revocation into a failed sync). A failed lookup no
    # longer reaches here at all — it aborts above.

    # NO HEREDOC HERE, deliberately. A heredoc terminator has to sit at the start of its line, which
    # ends the enclosing YAML block scalar and makes this ConfigMap unparseable — `helm lint` catches it
    # as "could not find expected ':'". Lines are split with parameter expansion instead, which also
    # keeps the loop in the current shell so the counters below actually accumulate (a `... | while read`
    # pipeline would run in a subshell and lose them).
    log ""
    log "--- PHASE 2/4: SCAN MANAGED OBJECTS -------------------------------------"
    log "  Every object is put in exactly one bucket: owned (its CR is live), no-provenance (no"
    log "  config-source label, left alone by design), or ORPHANED (its named CR is gone)."
    KEPT=0; CANDIDATES=""
    # $'\n' rather than a literal two-line string: a closing quote at column 0 would end the YAML block
    # scalar this script lives in, which is the same trap the heredoc hit.
    NL=$'\n'
    # FULLY QUALIFIED, like every other resource in this chart. These are held in a variable, so the CI
    # guard that checks literal `oc` arguments cannot see them — which is exactly why they are worth
    # spelling out by hand: rbac.authorization.k8s.io is not a reserved plural either.
    for kind in rolebindings.rbac.authorization.k8s.io \
                clusterrolebindings.rbac.authorization.k8s.io \
                roles.rbac.authorization.k8s.io; do
      # -A is invalid for a cluster-scoped kind, so the flag is chosen per kind.
      scope="-A"; [ "${kind%%.*}" = "clusterrolebindings" ] && scope=""
      # READS THE config-source LABEL, not the old source-{namespace,group}config annotations. As of
      # 0.16.0 there is ONE provenance key and it is a label, so this is a single field lookup instead of
      # two concatenated annotations — and it is the same key a human would select on, so the sweeper and
      # the runbook cannot disagree about what owns an object.
      # Same rule as the CR lookup above: an error must not masquerade as an empty result. Here the
      # consequence is the opposite direction — a swallowed failure means a genuine orphan is missed and
      # the log still says "no orphans found" — which is why it aborts rather than reporting a clean run.
      RAW="$(oc get "$kind" $scope -l "app.kubernetes.io/managed-by=${MANAGED_BY}" \
               -o jsonpath="{range .items[*]}{.metadata.namespace}|{.metadata.name}|{.metadata.labels.rbac\.ocp\.io/config-source}{'\n'}{end}")" \
        || fail "cannot list ${kind}, so this sweep would report a clean run without having checked — the API's error is printed above"
      K_SCANNED=0; K_OWNED=0; K_NOPROV=0; K_ORPHAN=0
      OLDIFS="$IFS"; IFS="$NL"
      for line in $RAW; do
        IFS="$OLDIFS"
        [ -z "$line" ] && { IFS="$NL"; continue; }
        K_SCANNED=$((K_SCANNED+1))
        ns="${line%%|*}"
        rest="${line#*|}"
        name="${rest%%|*}"
        owner="${rest#*|}"
        if [ -z "$name" ]; then IFS="$NL"; continue; fi
        # No config-source label: not ours to reason about, left alone deliberately. The sweeper only
        # ever acts on an object that NAMES the policy which should own it.
        if [ -z "$owner" ]; then
          KEPT=$((KEPT+1)); K_NOPROV=$((K_NOPROV+1)); IFS="$NL"; continue
        fi
        if printf '%s\n' "$EXISTING" | grep -qxF "$owner"; then
          KEPT=$((KEPT+1)); K_OWNED=$((K_OWNED+1)); IFS="$NL"; continue
        fi
        K_ORPHAN=$((K_ORPHAN+1))
        CANDIDATES="${CANDIDATES}${kind}|${ns}|${name}|${owner}${NL}"
        IFS="$NL"
      done
      IFS="$OLDIFS"
      # Per kind, so a surprising total can be attributed rather than guessed at.
      log "  ${kind%%.*}: scanned=${K_SCANNED} owned=${K_OWNED} no-provenance=${K_NOPROV} ORPHANED=${K_ORPHAN}"
    done

    COUNT="$(printf '%s' "$CANDIDATES" | sed '/^$/d' | wc -l | tr -d ' ')"
    # NO EARLY EXIT HERE. The dangling-Role sweep below is independent of this one and must run even when
    # every object has a live owner — a roleName change leaves bindings dangling while their CR is
    # perfectly healthy, so an `exit 0` on "no orphans" would skip exactly the case it needs to catch.
    if [ "$COUNT" -eq 0 ]; then
      log ""
      log "--- PHASE 3/4: DELETE ORPHANS -------------------------------------------"
      log "  nothing to delete — all ${KEPT} managed object(s) are owned by a live CR"
    fi

    # ORPHAN_LIMIT IS OFF BY DEFAULT (0). It is an opt-in circuit breaker, not a size limit: a real sweep
    # is however big it is, and the work below paces itself rather than refusing. Anyone who wants the
    # circuit breaker back sets orphanSweeper.limit; anyone who does not is not asked to keep raising a
    # number as their cluster grows. The reason a cap existed at all is worth keeping in view — at 0.16.0 a
    # label-value migration left 36 objects whose config-source named no CR, and the cap turned a mass
    # revocation into a failed sync. That failure mode has not gone away, so the count and the live CR list
    # are always logged before anything is deleted: a run that reports "429 orphaned" against five live
    # policies is telling you the list is wrong, whether or not a cap stops it.
    if [ "$COUNT" -gt 0 ] && [ "$ORPHAN_LIMIT" -gt 0 ] && [ "$COUNT" -gt "$ORPHAN_LIMIT" ]; then
      log "found ${COUNT} orphan candidates:"
      printf '%s' "$CANDIDATES" | sed '/^$/d' | sed 's/^/    /'
      fail "refusing to delete ${COUNT} objects, which exceeds the circuit breaker orphanSweeper.limit=${ORPHAN_LIMIT} (0 disables it, and 0 is the default). Confirm 'oc get namespaceconfigs.redhatcop.redhat.io,groupconfigs.redhatcop.redhat.io' lists the policies you expect — if it does not, the objects are not orphaned and the list is wrong."
    fi

    if [ "$COUNT" -gt 0 ]; then
    log ""
    log "--- PHASE 3/4: DELETE ORPHANS -------------------------------------------"
    log "  ${COUNT} object(s) name a CR that does not exist. Each one is a live grant with no policy"
    log "  behind it, which is what this Job exists to revoke."
    log "  candidates:"
    printf '%s' "$CANDIDATES" | sed '/^$/d' | while IFS='|' read -r kind ns name owner; do
      log "      ${kind} ${ns:-<cluster>}/${name}  ->  missing CR '${owner}'"
    done

    if [ "$DRY_RUN" = "true" ]; then
      log "DRY RUN: leaving all ${COUNT} in place"
    else

    # DELETES ONE AT A TIME, WITH A PAUSE AND RETRIES, and NOT in a pipeline. The previous version was
    # `printf ... | while read`, which runs the loop in a SUBSHELL: a failure counter incremented there is
    # lost when the pipeline ends, so every delete could fail and the run would still report success. Same
    # trap the candidate loop above documents. Split with parameter expansion instead so the counter is real.
    #
    # PAUSE_SECONDS between writes rather than a batch: the apiserver is being asked to revoke access, and
    # a burst of hundreds of deletes competes with the operator's own reconcile for the same objects.
    # RETRIES covers the transient half of that — a conflict or a timeout is worth retrying, and only the
    # LAST attempt keeps stderr, so a genuine failure is explained once instead of three times.
    SWEPT=0; FAILED=0; INDEX=0
    log "  deleting, ${PAUSE_SECONDS}s apart:"
    OLDIFS="$IFS"; IFS="$NL"
    for line in $(printf '%s' "$CANDIDATES" | sed '/^$/d'); do
      IFS="$OLDIFS"
      kind="${line%%|*}"; rest="${line#*|}"
      ns="${rest%%|*}";   rest="${rest#*|}"
      name="${rest%%|*}"
      INDEX=$((INDEX+1))
      # PROGRESS PER OBJECT, not one summary at the end. The previous version printed the candidate list,
      # then went silent for the whole sweep — 74 seconds for 30 objects — and printed one line when it
      # finished. That is indistinguishable from a hung Job, and it is why a run that WAS deleting was read
      # as "it only lists them, nothing deletes".
      log "  [${INDEX}/${COUNT}] ${kind%%.*} ${ns:-<cluster>}/${name}"
      if delete_one "$kind" "$name" "$ns"; then
        SWEPT=$((SWEPT+1))
        log "        deleted"
      else
        FAILED=$((FAILED+1))
        log "        FAILED after ${RETRIES} attempts — this grant is STILL LIVE"
      fi
      # Between writes, not around the batch. Hundreds of revocations in a burst compete with the
      # operator's own reconcile for the same objects.
      sleep "$PAUSE_SECONDS"
      IFS="$NL"
    done
    IFS="$OLDIFS"
    log "  deleted ${SWEPT} of ${COUNT}; failed ${FAILED}"
    [ "$FAILED" -gt 0 ] && fail "${FAILED} of ${COUNT} object(s) could not be deleted after ${RETRIES} attempts each; access they grant is still live. The per-object errors are above."
    fi
    fi
    # --- SECOND SWEEP: RoleBindings whose Role no longer exists -----------------------------
    # Renaming a policy's roleName cannot be applied in place: roleRef is IMMUTABLE in Kubernetes, so the
    # operator creates the new Role, REMOVES the old one, and then fails forever trying to repoint the
    # binding — "cannot change roleRef" — while the CR still logs "resources processed successfully". The
    # binding is left referencing a Role that is gone, which grants nothing and reports nothing.
    #
    # Deleting the binding is the fix, because the operator recreates it from the CR with the correct
    # roleRef on the next reconcile. That makes a roleName change self-healing on a plain `helm upgrade`,
    # with no manual CR delete.
    #
    # SCOPED TO roleRef kind=Role ON PURPOSE. A Role is created by the same policy that binds it, so a
    # missing target means a rename. A ClusterRole is EXTERNAL — customGroupConfig deliberately binds
    # roles this chart does not create — and one may be legitimately absent while someone applies it.
    # Deleting those bindings would fight the operator in a delete/recreate loop, so they are left alone
    # and remain the documented silent-dangle case.
    # ABSENT AND UNREADABLE ARE DIFFERENT ANSWERS, and conflating them is how this sweep deleted three
    # healthy RoleBindings on a no-op upgrade. The test was `! oc get role ... >/dev/null 2>&1`, which is
    # true for "not found" AND for "Forbidden" — and the ClusterRole granted list+delete on roles but not
    # `get`, so EVERY managed RoleBinding looked dangling on EVERY sync. The operator rebuilt each one
    # within a second or two, so the object counts matched afterwards and nothing in `oc get` showed it.
    #
    # `--ignore-not-found` gives the three-way answer this decision actually needs. Measured on this
    # cluster before relying on it:
    #   absent     rc=0, empty output                      -> the rename case, safe to delete
    #   exists     rc=0, "role.rbac.../<name>"             -> leave alone
    #   forbidden  rc=1, "Error from server (Forbidden)"   -> UNKNOWN, must not delete
    # Deleting RBAC on an unknown is the one outcome a sweeper must never produce, so rc!=0 aborts.
    # STDOUT ONLY, like every capture above: oc warnings arrive on stderr with rc=0, and one captured
    # here would make an absent Role read as present — the sweep would keep the dangling binding and
    # report a clean run, silently un-fixing the roleName self-heal.
    log ""
    log "--- PHASE 4/4: BINDINGS WHOSE ROLE IS GONE ------------------------------"
    log "  Independent of phase 3 and it runs even when nothing was orphaned: roleRef is immutable, so a"
    log "  renamed roleName leaves the binding pointing at a Role that no longer exists while its CR stays"
    log "  perfectly healthy. Deleting the binding lets the operator rebuild it with the right roleRef."
    log "  Scoped to roleRef kind=Role — a missing ClusterRole may be external and legitimately absent."
    DANGLING=0
    # Same no-heredoc rule as the sweep above: a terminator at column 0 would end this YAML block scalar.
    RAWRB="$(oc get rolebinding -A -l "app.kubernetes.io/managed-by=${MANAGED_BY}" \
               -o jsonpath="{range .items[?(@.roleRef.kind=='Role')]}{.metadata.namespace}|{.metadata.name}|{.roleRef.name}{'\n'}{end}")" \
      || fail "cannot list rolebindings for the dangling-Role sweep — the API's error is printed above"
    OLDIFS="$IFS"; IFS="$NL"
    for line in $RAWRB; do
      IFS="$OLDIFS"
      if [ -n "$line" ]; then
        dns="${line%%|*}"; drest="${line#*|}"; dname="${drest%%|*}"; drole="${drest#*|}"
        if [ -n "$dname" ] && [ -n "$drole" ]; then
          if ROLEOUT="$(oc get role "$drole" -n "$dns" --ignore-not-found -o name)"; then
            if [ -z "$ROLEOUT" ]; then
              if [ "$DRY_RUN" = "true" ]; then
                log "  rolebinding ${dns}/${dname} -> Role/${drole} does not exist; would delete so the operator rebuilds it"
              else
                log "  rolebinding ${dns}/${dname} -> Role/${drole} does not exist; deleting so the operator rebuilds it"
                delete_one rolebindings.rbac.authorization.k8s.io "$dname" "$dns" \
                  || fail "could not delete dangling rolebinding ${dns}/${dname} after ${RETRIES} attempts; it still grants a role that does not exist. The error is above."
                sleep "$PAUSE_SECONDS"
              fi
              DANGLING=$((DANGLING+1))
            fi
          else
            fail "cannot determine whether Role/${drole} exists in ${dns}, so ${dns}/${dname} is being LEFT ALONE rather than deleted on a guess. Most likely the sweeper's ClusterRole is missing 'get' on roles — the API's error is printed above"
          fi
        fi
      fi
      IFS="$NL"
    done
    IFS="$OLDIFS"
    if [ "$DANGLING" -gt 0 ]; then
      log "  found ${DANGLING} rolebinding(s) pointing at a missing Role$([ "$DRY_RUN" = "true" ] && echo ' (dry run: left in place)')"
    else
      log "  no rolebinding points at a missing Role"
    fi

{{- end }}
