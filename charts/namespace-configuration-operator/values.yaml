# Namespace Configuration Operator (NCO) — OLM install chart values
# Installs the redhat-cop Namespace Configuration Operator via OLM.
# Full guide: chart README.md. Policies (GroupConfig/NamespaceConfig) are separate.

# -------------------- Install namespace --------------------
# The operator is installed into this namespace. It watches ALL namespaces
# (AllNamespaces / global mode), because it configures namespaces cluster-wide.
namespace: namespace-configuration-operator

# Create the install namespace as part of this release.
# Set to false if the namespace already exists or is managed elsewhere
# (e.g. installing into the built-in "openshift-operators" namespace).
#
# FALSE here because this namespace predates the chart (created 234d ago, already carries the
# privileged audit/warn PSA labels). The namespace template is a pre-install HOOK, and Helm
# creates hook resources rather than applying them — so with this true, `helm install` fails
# with "namespaces already exists". Flip to true only for a genuinely new namespace.
createNamespace: false

# -------------------- OperatorGroup --------------------
# Create an AllNamespaces (global) OperatorGroup in the install namespace.
# NCO must watch every namespace, so the OperatorGroup has NO targetNamespaces
# (an empty spec = AllNamespaces mode). This is the key difference from a targeted
# operator like group-sync (which scopes to specific namespaces).
#
# IMPORTANT: set to false when installing into a namespace that ALREADY has a global
# OperatorGroup (e.g. "openshift-operators") — two global OperatorGroups in one
# namespace is an OLM conflict that breaks operator installs in that namespace.
createOperatorGroup: true

# -------------------- Subscription (OLM) --------------------
subscription:
  # Package name in the catalog source.
  packageName: namespace-configuration-operator
  # Update channel (alpha is the only channel published for this operator).
  channel: alpha
  # Catalog source and its namespace (default OpenShift community catalog).
  source: community-operators
  sourceNamespace: openshift-marketplace
  # Manual = OLM stages an InstallPlan that you approve before the operator (re)installs.
  # Automatic = OLM applies InstallPlans without approval.
  #
  # MANUAL, and it stays honest: the autoApproveInstallPlan Job below approves ONLY the
  # InstallPlan for the pinned startingCSV, so a fresh install still completes unattended
  # while any later channel upgrade is staged and waits for a human. Declared state matches
  # live state, which matters because this chart is ArgoCD-annotated — a Job that mutated
  # this field instead would show as permanent drift and be reverted by self-heal.
  installPlanApproval: Manual
  # Pin the initial CSV version for reproducible installs (empty = channel head).
  # With autoApproveInstallPlan below, this pin is also the APPROVAL AUTHORITY: only an
  # InstallPlan for exactly this CSV is approved automatically.
  startingCSV: "namespace-configuration-operator.v1.2.6"

  # Scoped InstallPlan approver. Makes installPlanApproval: Manual workable unattended.
  #
  # Approves only the InstallPlan installing `csv` (defaults to startingCSV) and owned by
  # this chart's Subscription. Anything else — a newer CSV appearing in the alpha channel,
  # or another operator's InstallPlan sharing the namespace — is logged and left unapproved.
  # To adopt a new version, bump startingCSV and re-sync: the upgrade becomes a reviewable
  # git change instead of an `oc patch` on the cluster.
  #
  # Set enabled: false for a strictly hands-on install (you approve the InstallPlan yourself,
  # and the image-override hook will wait for you up to its own timeout).
  autoApproveInstallPlan:
    enabled: true
    # Empty = use startingCSV. Set explicitly only to approve a CSV other than the pin.
    csv: ""
    # How long to wait for the InstallPlan to appear, and then to reach Complete.
    waitSeconds: 300
    backoffLimit: 3
    activeDeadlineSeconds: 900
    ttlSecondsAfterFinished: 3600

  # Operator runtime env, injected via Subscription spec.config.env (an OLM-supported
  # override). zap logger controls (the operator uses controller-runtime's zap logger):
  #   ZAP_LOG_LEVEL: verbosity — debug | info | error (or a level number)
  #   ZAP_DEVEL:     development-mode logging (console encoder + stacktraces); "false" for prod
  zapLogLevel: "info"
  zapDevel: "false"

  # UNUSED — the template no longer reads this, so setting it has NO effect.
  #
  # RELATED_IMAGE_MANAGER does not change THIS operator's own image: it is an operand-image
  # hint and NCO deploys no operand pods. Proven on-cluster — the env var was injected and
  # the manager image stayed upstream (docs/local-testing/LOCAL_TEST_operator_image_override.md §4a),
  # so the env block is commented out in templates/02-subscription.yaml.
  #
  # Use operatorImage.enabled below to override the image. This key is retained only so an
  # existing values file that still sets it does not fail to render; it is inert and can be
  # dropped once no environment references it.
  relatedImageManager: ""

  # Extra env vars appended to spec.config.env, as a list of {name, value}.
  extraEnv: []

  # Operator resource requests/limits (spec.config.resources). Empty {} to omit.
  #
  # SIZED FOR CRC. This single-node cluster allocates 4800m CPU and already sits at ~89%
  # requested, leaving roughly 500m. A rolling update needs TWO operator pods briefly, so the
  # previous 250m request (=500m for the pair) wedged the rollout with "Pending: Insufficient
  # cpu" — that is the failure recorded in docs/local-testing/ §4c. 100m matches what the
  # operator actually ran with under the CSV defaults and leaves headroom for the rollout.
  # Raise these on a properly-sized cluster.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -------------------- Operator image override (CSV patch) --------------------
# Runs our own build of the operator instead of the catalog's image.
#
# OLM has no supported operator-image override: Subscription.spec.config carries no image
# field, and RELATED_IMAGE_MANAGER is an *operand* hint that this operator ignores (proven —
# docs/local-testing/LOCAL_TEST_operator_image_override.md). What DOES work is patching the
# installed CSV: OLM treats spec.install.spec.deployments[] as the source of truth for the
# operator Deployment and re-applies it within seconds. A Job does that patch, replacing the
# Kyverno image-rewrite policy.
#
# TRADE-OFF vs Kyverno: Kyverno enforced at admission, so it self-healed. This is a one-shot
# patch — an OLM operator upgrade installs a fresh CSV and the upstream image comes back.
# Enable `reconcile` below to get the self-healing behaviour back.
operatorImage:
  # ON: this chart now owns the operator image. The Kyverno policies that used to do it
  # (replace-operator-image-to-dockerhub, inject-dockerhub-secret) have been deleted — they
  # would fight this Job, mutating the Deployment back to docker.io at admission and making
  # the Job's propagation check fail. Both are backed up in docs/local-testing/kyverno-backup/.
  enabled: true

  # The image to run. Must be pullable by the cluster (set imagePullSecret if private).
  repository: quay.io/ephico2real/namespace-configuration-operator
  tag: latest
  # Always, so a moving ":latest" tag is re-pulled on every pod start.
  pullPolicy: Always

  # Safety guard. The patch is applied only when the CSV's current image either sits in the
  # `repository` above (a tag bump — always in policy) or matches this pattern. Anything else
  # is refused rather than silently overwritten, which is what makes the unattended reconcile
  # CronJob safe. Widen it if you fork from a different upstream.
  expectedImagePattern: '^quay\.io/redhat-cop/namespace-configuration-operator(@sha256:[0-9a-f]{64}|:[A-Za-z0-9_.-]+)$'

  # Where inside the CSV to patch. Both are matched BY NAME and the array indices are
  # discovered at runtime — in v1.2.6 the manager is containers[1] and kube-rbac-proxy is
  # containers[0], and that ordering is a bundle detail, not a contract.
  csvDeploymentName: namespace-configuration-operator-controller-manager
  containerName: manager

  # Pull secret for a private registry, written into the CSV deployment's podSpec. Leave
  # empty for a public image — the default quay repo is public, so none is needed.
  # (This is the knob that replaces the `inject-dockerhub-secret` Kyverno policy.)
  imagePullSecret: ""

  # Periodic drift correction — the Kyverno-equivalent self-healing. Each run is idempotent
  # and exits early when the CSV is already correct. Leave off if you would rather the image
  # revert visibly on an operator upgrade than be silently re-patched.
  # ON: Kyverno used to enforce the image continuously at admission, and deleting it removed
  # that self-healing. Without this CronJob an OLM operator upgrade would silently revert the
  # operator to the upstream catalog image. Each run is a cheap no-op when the CSV is correct.
  reconcile:
    enabled: true
    schedule: "*/10 * * * *"
    startingDeadlineSeconds: 120
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 3

  job:
    # `oc` client image. The openshift/cli imagestream ships on every OpenShift cluster and
    # needs no pull credentials.
    image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
    # Per-wait budget: how long to wait for the CSV to appear, for OLM to propagate the
    # patch, and for the rollout. Generous, because with installPlanApproval=Manual the
    # InstallPlan may sit unapproved for a while.
    waitSeconds: 300
    backoffLimit: 3
    activeDeadlineSeconds: 1200
    ttlSecondsAfterFinished: 3600
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

# -------------------- Namespace Pod Security --------------------
# NCO's controller runs with elevated privileges. The live operator namespace sets
# audit/warn to "privileged" (non-enforcing — they only log/warn, never block).
# Applied only when createNamespace is true.
podSecurity:
  audit: privileged
  warn: privileged

# -------------------- RBAC Policies (NamespaceConfig CRs) --------------------
# THIS EXTENDS THE CHART'S SCOPE, deliberately, and Chart.yaml's description says so.
#
# Until now this chart installed the OPERATOR and nothing else, and the policies under
# working-sessions/policies were applied by hand. That split costs something real: a policy applied
# with `oc apply` has no owner, no release history and no `helm diff` — the only way to know what is
# on the cluster is to look. Bringing a policy in here makes it versioned with the operator that
# reads it, which is the thing it cannot work without.
#
# The raw YAML under working-sessions/policies/ IS NOT REPLACED. It stays as the readable reference
# and the record of why each access model exists; this stanza is the deployable form. A policy is
# converted one at a time, each behind its own flag, so a chart upgrade cannot adopt a policy the
# operator did not ask for.
#
# OFF BY DEFAULT — all of it. A NamespaceConfig grants access, so nothing here may arrive because
# somebody upgraded the operator. Turn on the parent flag, then the policy you want.
namespaceConfigPolicy:
  # Master switch for every policy below. With this false, no policy renders whatever its own flag
  # says — one place to stop the chart writing RBAC at all.
  enabled: true

  # -------- company.net/oud-group --------
  # The label holds the WHOLE group name and the template uses it verbatim:
  #
  #   company.net/oud-group: bda-rbac-trino-alpha-users   ->   bound as-is
  #
  # rather than holding a fragment that the template prefixes. That makes it explicit —
  # `oc get ns --show-labels` shows exactly what gets bound, and `oc get group <value>` works with no
  # transformation — and family-agnostic: one config binds app-ocp-rbac-*, bda-rbac-*, or a future
  # family, instead of one config per family with the prefix baked in.
  #
  # THE COST, stated: the hardcoded prefix was a guardrail that made it impossible for a namespace to
  # bind anything outside its family. With the full name in the label that constraint has to live
  # somewhere else, so it lives in Kyverno — working-sessions/policies/kyverno-namespace-oud-group.yaml
  # — where it is visible and auditable rather than buried in an objectTemplate.
  oudGroup:
    enabled: true

    # The CR's name, and the value written into every generated object's
    # rbac.ocp.io/source-namespaceconfig ANNOTATION — so a generated Role can be traced back to what
    # made it. Annotation, not a label: `oc -l` will not match it, so use
    # rbac.ocp.io/config-source below to select this policy's objects.
    #
    # CHANGING THIS IS A REVOCATION, not an orphaning. Helm treats a renamed resource as a delete plus
    # a create: the old CR is deleted, its namespaceconfig-controller finalizer revokes every object it
    # made, and the new CR then rebuilds them under the new name. Measured on this cluster: 6 objects
    # (3 Roles + 3 RoleBindings) gone in ~4s and back within ~50s. Nothing is left behind — an earlier
    # version of this comment claimed objects would be orphaned, which is the opposite of what happens
    # and would have led someone to hunt for stale objects instead of planning a window.
    name: abc-oud-group-namespaceconfig-rbac

    # THE LABEL, and it does two jobs: the CR selects namespaces that HAVE it, and the template binds
    # whatever its VALUE says. Both, from one key — which is why the template refuses to render when
    # it is empty rather than selecting every namespace and binding a group called "".
    labelKey: company.net/oud-group

    # The policy's short name, written to rbac.ocp.io/config-source on every object this policy creates.
    # That label is the ONE reliable way to select a policy's objects — which a metadata change needs,
    # since it requires deleting and rebuilding them. See working-sessions/docs/labels-and-annotations.md
    # §6. Keep it short and distinct from every other policy's.
    configSource: oud-group-rbac

    # The Role the RoleBinding points at. One Role per namespace, created by the first template.
    roleName: oud-group-submitter-role

    # The TIER, written to rbac.ocp.io/role-type on both the Role and the RoleBinding — the same key
    # every policy uses, so one query finds every tier across all of them. Descriptive only: it grants
    # nothing, `rules` below is the grant.
    roleType: spark-job-submitter

    # Paths the operator IGNORES when comparing what it would create against what exists, so a
    # cluster-assigned field does not read as drift and cause a rewrite every reconcile.
    excludedPaths:
      - .metadata
      - .status

    # THE ACTUAL PERMISSIONS. Namespace-scoped, so nothing here can grant cluster-wide access — a
    # Role bound by a RoleBinding in one namespace.
    #
    # `deletecollection` is the one worth noticing: it lets the holder delete every pod in the
    # namespace in one call. That is intended for a workload submitter cleaning up a run, and it is
    # also the verb to remove first if this is ever narrowed.
    #
    # pods/log is a separate rule because it is a SUBRESOURCE — listing it beside `pods` in the same
    # rule would grant get/list/create/delete on it too, and `oc auth can-i get pods/log` answers
    # `no` even on a correct grant because it reads pods/log as a resource NAME. Use
    # --subresource=log to check it.
    rules:
      - apiGroups: [""]
        resources:
          - pods
          - services
          - configmaps
          - persistentvolumeclaims
        verbs:
          - create
          - get
          - list
          - watch
          - delete
          - deletecollection
          - patch
          - update
      - apiGroups: [""]
        resources:
          - secrets
        verbs:
          - create
          - get
          - watch
          - delete
          - update
          - patch
      - apiGroups: [""]
        resources:
          - pods/log
        verbs:
          - get
          - list

  # -------- the BASELINE: mnemonic + environment --------
  # THIS IS WHAT EVERY TEAM GETS. A namespace that declares a mnemonic and an environment receives the
  # standard access tiers for that environment, with no per-namespace configuration. oudGroup above is
  # a PoC beside it; this is the documented flow the README's install steps run.
  #
  # ONE TEMPLATE SERVES BOTH nonprod AND prod because they differ only in data — which environments and
  # which roles. See the header of
  # charts/namespace-configuration-operator/templates/rbac-policies/10-baseline-namespaceconfig-rbac.yaml for when a future policy earns its own file
  # instead of an entry here.
  #
  # THESE BIND OPENSHIFT'S BUILT-IN CLUSTERROLES (admin / edit / view) through RoleBindings, which
  # grants them in one namespace only. They are aggregated roles maintained by the platform; defining
  # local copies would drift as OpenShift adds APIs. ClusterRoleBindings are a different thing and
  # live in the GroupConfig policies, not here.
  baseline:
    # OFF is CHART SAFETY, not a statement about this policy's standing. These are the baseline, but a
    # chart must never create RBAC because somebody upgraded the operator. Turn it on deliberately.
    #
    # TURNING IT BACK OFF IS A REVOCATION, NOT A NO-OP. The CR carries the finalizer
    # redhatcop.redhat.io/namespaceconfig-controller, so removing it makes the operator delete every
    # RoleBinding it created. Measured on CRC: 36 RoleBindings gone in 2 seconds, and
    # `oc auth can-i delete pods` for a bound group went from yes to no. Re-enabling restored all of
    # them 44 seconds after the delete — so a flag flip on a shared cluster is a 44-second window with
    # no namespace access for anyone this grants. Same applies to renaming a policy's `name`: Helm
    # deletes the old resource and creates the new one.
    enabled: true

    # The group family. Combined with the mnemonic and the role, this produces
    # app-ocp-rbac-<mnemonic>-ns-<role> — the convention
    # working-sessions/policies/kyverno-group-naming-app-ocp-rbac.yaml already validates, and the
    # family GroupSync syncs from LDAP. Changing it here does not change what Kyverno enforces.
    groupPrefix: app-ocp-rbac

    # THE TWO SELECTOR LABELS, and both do double duty:
    #   mnemonicLabelKey     selects namespaces that have it, AND its value names the bound groups
    #   environmentLabelKey  selects on its value, AND that value is recorded on every RoleBinding
    # The template refuses to render when either is empty rather than matching every namespace, or
    # letting a prod namespace collect the nonprod grants.
    mnemonicLabelKey: company.net/mnemonic
    environmentLabelKey: company.net/app-environment


    policies:
      # ---- non-production: rnd / eng / qa / uat ----
      nonprod:
        enabled: true
        name: nonprod-namespaceconfig-rbac
        description: "Nonprod RBAC: admin/developer/audit access for rnd/eng/qa/uat environments only"

        # AN EXPLICIT ALLOW-LIST, not "everything that is not prod". An environment nobody has ruled on
        # gets nothing, rather than silently inheriting non-production access — which is why
        # `production` (a real label value on this cluster, distinct from `prod`) matches neither
        # policy and receives no bindings at all.
        environments:
          - rnd
          - eng
          - qa
          - uat

        # Redundant against the allow-list above, and kept on purpose: if somebody adds prod to
        # `environments`, this still refuses it. A second lock on the same door, visible here rather
        # than assumed. Rendered as a NotIn expression only when non-empty.
        excludeEnvironments:
          - prod

        # `name` names the group and the binding; `clusterRole` IS the grant. Everything else — the
        # RoleBinding name, role-type, bound-role, group name — derives from these two; see
        # working-sessions/docs/templating-guide.md §3 for the full derivation table. clusterRole is
        # explicit because it is NOT derivable from the tier (developer -> edit, audit -> view) and
        # because it is the field an auditor reads.
        roles:
          - name: developer
            clusterRole: edit
          - name: audit
            clusterRole: view

      # ---- production ----
      # ON, because the baseline means BOTH halves. A cluster running the baseline with only the
      # nonprod half would give prod namespaces no managed access at all, which is not a safer state —
      # it is an unmanaged one, and somebody would fill the gap with hand-made bindings.
      #
      # THIS DOES NOT MEAN PROD RBAC SHIPS BY DEFAULT. The two switches above it —
      # namespaceConfigPolicy.enabled and baseline.enabled — are both false, so a plain `helm install`
      # still creates nothing. This flag decides what the baseline CONTAINS once somebody turns it on,
      # and the answer is: the full baseline. Turn this off only to deploy the nonprod half alone.
      prod:
        enabled: true
        name: prod-namespaceconfig-rbac
        description: "Prod RBAC: developer/audit access for prod environments only (no admin or edit)"
        environments:
          - prod
        # Nothing to exclude: the allow-list is already a single value.
        excludeEnvironments: []

        # NO admin, DELIBERATELY, and this is the whole reason prod is a separate policy rather than
        # another environment in the nonprod list. Namespace-admin in production is granted by a
        # reviewed exception, never by a namespace label. Adding an admin entry here would hand it to
        # every prod namespace at once.
        roles:
          - name: audit
            clusterRole: view

# ---------------------------------------------------------------------------
# Cluster-wide baseline RBAC  (GroupConfig -> ClusterRoleBinding)
# ---------------------------------------------------------------------------
# ITS OWN TOP-LEVEL KEY, not a child of namespaceConfigPolicy above, because the two parents mirror
# the two CRDs: namespaceConfigPolicy renders NamespaceConfig CRs that emit RoleBindings; this renders
# a GroupConfig CR that emits ClusterRoleBindings. Filing a GroupConfig under a key named for
# NamespaceConfig would misdescribe half of what that key controls.
#
# The accepted cost of separate parents: there is no single master switch for "all chart-managed
# RBAC". Turning everything off is two flags, this one and namespaceConfigPolicy.enabled.
#
# THE CLUSTER-WIDE HALF OF THE BASELINE. namespaceConfigPolicy.baseline grants access inside a
# namespace that carries a mnemonic; this grants it across ALL namespaces to groups whose NAME ends in
# a cluster tier. Both are keyed on the same app-ocp-rbac-* family synced from LDAP.
clusterRbac:
  # OFF is CHART SAFETY, not a statement about this policy's standing. This is the baseline, but a
  # chart must never create cluster-wide RBAC because somebody upgraded the operator.
  #
  # TURNING IT BACK OFF IS A REVOCATION, NOT A NO-OP. The CR carries the finalizer
  # redhatcop.redhat.io/groupconfig-controller, so removing it makes the operator delete every
  # ClusterRoleBinding it created. Measured on the namespace equivalent: 39 objects gone in 2 seconds,
  # restored 44 seconds later. On a shared cluster that is a window with no cluster-wide access for
  # anyone this grants.
  enabled: true

  # ONE CR for all three tiers. The three source policies under working-sessions/policies/ are three
  # separate CRs; this is deliberately one, because they share an identical selector and differ only
  # in data. Renaming this ORPHANS nothing but DOES delete and recreate: the operator revokes the old
  # CR's bindings and the new CR rebuilds them.
  name: baseline-groupconfig-rbac
  description: "Cluster RBAC baseline: admin/view/edit ClusterRoles for the cluster tiers of synced groups"

  # SYNCED GROUPS ONLY, and this is the only thing narrowing the selector. GroupSync sets this label
  # on every Group it manages, so a locally-created Group cannot collect cluster-wide access from a
  # policy meant for the directory. The template refuses to render when it is empty.
  syncProviderLabelKey: group-sync-operator.redhat-cop.io/sync-provider

  # Documents which group family this is for, on each binding's rbac.ocp.io/group-pattern annotation.
  # It does NOT narrow anything: the guard inside each objectTemplate matches on the SUFFIX, so a
  # group from another family ending in -cluster-admin would still match. Kyverno enforces the naming
  # (working-sessions/policies/kyverno-group-naming-app-ocp-rbac.yaml); this records it.
  groupPrefix: app-ocp-rbac


  # ONE objectTemplate PER ROLE, generated by ranging over this list — the same construction
  # namespaceConfigPolicy.baseline uses. Each template guards on `-cluster-<name>` and renders empty
  # for groups of other tiers.
  #
  # `name` supplies the suffix the guard matches and the role-type label. `clusterRole` IS the grant,
  # and it is NOT derivable from the name — note audit -> view. Everything else derives; see the
  # template header for the five derivations.
  #
  # A TIER IS PRESENT OR IT IS NOT IN THIS LIST. There is no per-role enabled flag, deliberately —
  # one way to express one thing. Removing an entry removes its template, and the operator prunes that
  # tier's ClusterRoleBindings on the next reconcile, which is a revocation.
  roles:
    - name: admin
      clusterRole: admin
    - name: audit
      clusterRole: view
    - name: developer
      clusterRole: edit

# ---------------------------------------------------------------------------
# EXTRA access  (GroupConfig -> RoleBindings in a platform namespace)

# ---------------------------------------------------------------------------
# CUSTOM ClusterRoles  (GroupConfig -> ClusterRoleBinding or RoleBinding)
# ---------------------------------------------------------------------------
# The counterpart to clusterRbac above. That binds OpenShift's BUILT-IN aggregated ClusterRoles
# (admin / edit / view) to the three -cluster-* tiers. This binds ClusterRoles the platform does NOT
# ship — ones we define — to any group-name suffix we choose. For custom roles, and for CRD access.
#
# THIS CHART DOES NOT CREATE THE CLUSTERROLE, and that is deliberate. A chart that both defines a
# privileged ClusterRole and binds it hides the grant's contents in a values file; keeping them apart
# means the role is reviewed wherever roles are reviewed. Nor can the template check existence: Helm's
# `lookup` is empty during `helm template` and `--dry-run=client`, so the check would be a false
# negative half the time.
#
# SO KNOW THE FAILURE MODE. A binding whose roleRef names a ClusterRole that does not exist is created
# SUCCESSFULLY, reports healthy, and grants NOTHING. If a grant seems inert, check the role first:
#   oc get clusterrole <name>
#
# THE SELECTOR IS FIXED, THOUGH EVERYTHING ELSE IS FREE-FORM. Free-form selectors on this CRD fail
# dangerously and the repo has proof: working-sessions/docs/examples/redhat-cop-custom-crd-access.yaml
# writes a regex selector that the API silently PRUNES, leaving a CR with no selector — which
# apimachinery resolves to labels.Everything(), i.e. EVERY group. The template hardcodes the
# combination proven to narrow (sync-provider Exists, plus a per-entry hasSuffix guard) and lets you
# vary only the axes where variation is safe.

customGroupConfig:
  # OFF is chart safety. Turning it back off is a REVOCATION: the CR carries the
  # groupconfig-controller finalizer, so the operator deletes every binding it made.
  enabled: false

  name: custom-groupconfig-rbac
  description: "Custom RBAC: bind ClusterRoles defined outside this chart to chosen group suffixes"
  configSource: custom-rbac

  # SYNCED GROUPS ONLY — the only thing narrowing the selector, and the template refuses it empty.
  syncProviderLabelKey: group-sync-operator.redhat-cop.io/sync-provider

  # Documents the group family on each binding's rbac.ocp.io/group-pattern annotation. It does NOT
  # narrow anything — the suffix guard does that.
  groupPrefix: app-ocp-rbac

  # FREE-FORM BY DESIGN: any suffix you choose, bound to any ClusterRole you have defined. Three axes
  # vary — the suffix, the role, and whether the grant is cluster-wide or confined to one namespace.
  # Add an entry per pairing. Two entries MAY share a suffix (a group gets both roles), because the
  # binding name includes the entry name; what must be unique is `name`.
  #
  # scope: cluster    -> ClusterRoleBinding. The role applies in EVERY namespace. Use for genuinely
  #                      cluster-wide grants.
  # scope: namespace  -> RoleBinding in targetNamespace. The role applies THERE ONLY, however broad it
  #                      is. Use for operator/CRD access that lives in one namespace.
  #
  # Guards refuse, at render time: a missing name/suffix/clusterRole, a duplicate name, a suffix
  # without its leading hyphen (hasSuffix "admin" would also match -cluster-admin and -ns-admin), a
  # scope that is not exactly cluster or namespace, and scope namespace with no targetNamespace.
  entries:
    # THE SHIPPED EXAMPLE, from working-sessions/policies/database-admin-groupconfig-rbac.yaml, whose
    # roleRef comment — "Custom ClusterRole (must exist)" — is where this stanza came from.
    #
    # Inert today, and correctly so: the database-admin ClusterRole does not exist on the reference
    # cluster, the repo does not define it, and 0 groups end in -database-admin. It is here as the
    # worked shape, not as a live grant.
    - name: database-admin
      suffix: -database-admin
      # OPTIONAL, defaults to `name`. Set here because the default would stutter — the group already
      # ends in -database-admin, so <group>-database-admin reads twice. `crb` reproduces the source
      # policy's exact binding name. Two entries may not resolve to the same value; the template
      # refuses that, because the binding names would collide.
      bindingSuffix: crb
      scope: cluster
      clusterRole: database-admin

