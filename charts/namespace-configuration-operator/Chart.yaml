apiVersion: v2
name: namespace-configuration-operator
description: >-
  Installs the Red Hat CoP Namespace Configuration Operator (NCO) on OpenShift via
  OLM — a dedicated namespace, an AllNamespaces (global) OperatorGroup, and a
  Subscription. It can ALSO deploy RBAC policies (NamespaceConfig CRs) from
  namespaceConfigPolicy and clusterRbac, one policy per flag — the baseline tiers ship
  ENABLED, so a stock install grants RBAC; the raw manifests under
  working-sessions/policies stay the readable reference for those.
type: application
# 0.4.0, MINOR: a new template and a new TOP-LEVEL values stanza. `clusterRbac` renders one
# GroupConfig carrying the three cluster-wide tiers (admin/view/edit ClusterRoles bound to the
# -cluster-* groups). Its own key rather than a child of namespaceConfigPolicy, because it is a
# different CRD emitting ClusterRoleBindings — see values.yaml. Ships disabled, so nothing changes for
# an existing release.
#
# 0.3.0, MINOR: a new template and a new values stanza. `namespaceConfigPolicy.baseline` renders the
# nonprod and prod NamespaceConfigs — the standard access tiers every team receives. Nothing changes
# for an existing release: like every policy here, both ship disabled.
# 0.6.0, MINOR: WITHDRAWS the `extraGroupConfig` stanza and its template, which 0.5.0 added. The user
# workload monitoring access it granted is not needed, so the chart no longer carries it. Setting
# `extraGroupConfig.*` now has no effect — it renders nothing rather than failing, which is the quiet
# direction, hence this note. The template and the values stanza it needs are parked together at
# working-sessions/policies/extra-groupconfig-rbac.helm-template.yaml with the reasoning intact.
#
# MINOR rather than MAJOR: no release of this chart ever shipped the stanza enabled, and the flag
# defaulted off, so no deployment loses access by upgrading. A cluster that DID enable it loses those
# RoleBindings on upgrade — the operator revokes what its CR created — which is the behaviour to know
# about and the reason this is not a patch.
#
# 0.5.0 added that stanza. It also carried a defect fix worth remembering even though the template is
# gone: the source policy binds alert-routing-edit as a Role when it is a ClusterRole, producing a
# binding that reports healthy and grants nothing. See the parked file.
# 0.19.3, PATCH: three install-time corrections, all found by trying a fresh install.
#
# AN OPERATOR-READINESS WAIT JOB, which this chart had none of. The Subscription is an ordinary resource, so
# Helm creates it and moves on while OLM installs the operator asynchronously — and everything after that
# assumes the operator is serving. The policy CRs ARE NamespaceConfig/GroupConfig objects, and the orphan
# sweeper LISTS those kinds to decide what to delete, so against an apiserver that does not serve them yet it
# would see nothing and act on that. The new Job blocks until the CSV is Succeeded, the operator Deployment
# has a ready replica, and BOTH CRDs report Established.
#
# It carries both ordering mechanisms, because they are not interchangeable: helm.sh/hook-weight 6 places it
# after the InstallPlan approver (5) and before the image override (10) and the sweeper (20), which is the
# only ordering plain Helm has; argocd sync-wave 2 places it after the Subscription (0) and approver (1) and
# BEFORE the policy CRs (3), and ArgoCD waits for a wave to be healthy before starting the next — so a failed
# wait stops the CRs being applied at all, which no hook weight can do. Same shape as the sibling group-sync
# chart, whose approver sits at weight -1 / wave 1 and whose wait sits at weight 0 / wave 2.
#
# Its RBAC is read-only and split by scope: a Role for the CSV, Subscription and Deployment in the install
# namespace, and a ClusterRole for the two CRDs, which are cluster-scoped and pinned by resourceNames.
#
# A FIRST INSTALL ON A BARE CLUSTER IS NOW ONE COMMAND, for `helm install` and for an ArgoCD sync alike.
# Since 0.18.0 the policy flags default to ON, so the manifest contains NamespaceConfig and GroupConfig
# objects — and Helm resolves every kind against API discovery BEFORE applying anything, so on a cluster
# whose CRDs do not exist yet the install failed with "no matches for kind NamespaceConfig ... ensure CRDs
# are installed first". No hook weight and no sync-wave can fix that: both are read long after the failure.
#
# An earlier draft of 0.19.3 answered this with a documented two-step install — policies off, then upgrade
# with them on. That is not hands-free, so it is gone. The two CRDs are now vendored in crds/, which Helm
# applies before it renders templates. Measured in an isolated sandbox chart: as a post-install hook at
# weight 99 the CR fails "unable to build kubernetes object for deleting hook"; as an ordinary resource it
# fails "unable to build kubernetes objects from release manifest"; in crds/ one `helm install` works. It is
# the only mechanism Helm offers, and it is why the sibling group-sync chart carries one.
#
# The staleness objection to vendoring is real but self-correcting, and was measured rather than assumed: on
# a cluster that already has the CRD, Helm SKIPS it — an `olm.managed=true` label survived a `helm upgrade`
# untouched — and on a bare cluster Helm creates the copy first, then OLM reconciles the CRD to the bundle's
# own version moments later. After the bare-cluster install both CRDs carried `olm.managed=true` and NO
# `meta.helm.sh/release-name`, so OLM owns them and Helm never claimed them. `helm uninstall` also never
# deletes anything in crds/, so removing the release cannot cascade-delete a policy CR or the RBAC its
# finalizer is responsible for. refresh-vendored-crds.sh regenerates them from the pinned CSV, and
# check-ordering.py asserts every policy kind the chart renders has its CRD vendored.
#
# Under ArgoCD set `skipCrds: true` on the Application: Argo renders with `helm template --include-crds`, so
# it would otherwise manage and possibly prune a CRD that OLM owns. Argo does not need the file — the
# readiness wait (wave 2) plus SkipDryRunOnMissingResource on the policy CRs (wave 3) cover the ordering.
#
# Verified end to end on a bare cluster, every NCO CRD, CSV and policy CR deleted first: one `helm install`
# → revision 1 deployed in 3m21s, 2/2 CRDs, CSV Succeeded, operator ready, 5/5 policy CRs, 42 managed RBAC
# objects rebuilt. The wait Job's first poll saw the CSV still `Installing`, so it is load-bearing.
#
# THE INSTALL-NAMESPACE TEMPLATE IS AN ORDINARY RESOURCE, not a pre-install hook.
#
# Helm CREATES hook resources rather than applying them, and never records them in the release. That gave the
# namespace three behaviours that are all wrong for a namespace:
#   - createNamespace=true against an EXISTING namespace failed with "namespaces ... already exists" instead
#     of adopting it. The false default and its "flip to true only for a genuinely new namespace" comment were
#     working around the hook rather than the hook being right.
#   - `helm upgrade` never reconciled the labels, so changing podSecurity.audit/warn did nothing to a
#     namespace that already existed.
#   - `helm uninstall` left the namespace behind, untracked and unmanaged.
#
# The ordering the hook-weight provided is not lost: Helm installs by KIND, and Namespace sorts ahead of
# OperatorGroup, Subscription and everything else in this chart. Under ArgoCD sync-wave -2 does it, as before.
#
# createNamespace still defaults to false, because adopting a namespace Helm did not create needs that
# namespace stamped with the release's ownership metadata first — the values comment now gives the two
# commands instead of implying the hook made it impossible. The sibling group-sync chart has always shipped
# its namespace as an ordinary resource; this brings the two into line.

# 0.19.2, PATCH: applies the accepted findings of the 0.19.1 adversarial review
# (working-sessions/docs/REVIEW_chart_0.19.1.md — 19 accepted, 2 rejected, 3 amended). Two behaviour
# changes; everything else corrects comments and docs to say what the chart actually ships.
#
# 1. THE SWEEPER CAPTURES STDOUT ONLY AND REFUSES A NON-NUMERIC ORPHAN_LIMIT. Every $(oc ...) used to
#    merge stderr into the parsed result (2>&1), so a warning printed on rc=0 would become a phantom
#    orphan row on the list calls — or make an ABSENT Role read as PRESENT on the named-role probe,
#    silently un-fixing 0.19.0's roleName self-heal. That half was LATENT, not active: measured with a
#    4.13.6 client against the 4.18.2 server (a five-minor skew), stderr was empty on rc=0 for all four
#    of the script's commands. Fixed anyway — a delete decision must not be read from a stream that can
#    carry non-data, and the API's message still reaches the pod log via stderr. The ORPHAN_LIMIT half
#    WAS active, and reachable through a values typo: `limit: abc` renders straight into the Job env,
#    `[ -gt ]` errors inside an && list, and the cap then silently does not fire — measured, 30
#    deletions proceed with exit 0. ORPHAN_LIMIT now joins the :? guard and must be a whole number
#    (0 still disables the cap, as an explicit choice). The second sweep also logs "would delete"
#    under dry run instead of describing a delete that never happened.
#
# 2. THE SWEEPER'S CLUSTERROLE DROPS WHAT NOTHING EXERCISES: `get` on rolebindings and
#    clusterrolebindings (never fetched by name — the 0.19.1 incident is the measured proof that
#    delete works without get) and on the policy CR kinds (only ever listed). The rules split three
#    ways so "`get` IS REQUIRED AND WAS THE BUG" now sits only on roles, the one resource where it
#    is true.
#
# check-ordering.py GAINED TWO ASSERTIONS IT DID NOT MAKE: the sweeper must be the LAST hook of its
# events (weight DIRECTION, not just uniqueness — at weight 4, unique with every wave intact, it would
# run before the InstallPlan approver and fail a plain-Helm install, and the checker printed OK), and
# a sync-wave must be an annotation LINE, not a substring (commented out in the gated 00-namespace.yaml
# the substring still passed, and no render exists to catch a gated template). Both verified by
# mutation: each mutant fails, the real chart passes.
#
# COMMENTS AND DOCS CORRECTED where they contradicted the shipped chart: the policies ship ON since
# 0.18.0 (values.yaml claimed off-by-default in four places — a plain install DOES create RBAC); the
# sweeper matches the rbac.ocp.io/config-source LABEL, not the retired source-*config annotations,
# and the limit guards the rc=0 catastrophes now that failed lookups abort; every remediation selector
# that matched ZERO live objects is re-measured (nonprod-rbac -> baseline-nonprod-rbac, cluster-rbac ->
# baseline-cluster-rbac, abc -> bdp, 55 objects/52 bindings -> 42/39 = 26 RB + 13 CRB + 3 Roles, and
# the ns-admin row retired in 0.9.0 is dropped from the labels contract). File 12 gains the two traps
# the review measured: an EMPTY label value renders RoleBinding "-rb", which the API rejects while the
# CR logs success; and two policies sharing a roleName rewrite ONE Role's rules on every reconcile
# (rules are spec, and spec propagates), oscillating that namespace's permissions with no error. The
# phantom `configSource` values key is no longer documented as settable, and crc-values.yaml admits it
# carries TWO genuine overrides (bdp and customGroupConfig).
#
# FORM: file 12's two {{- /* */ -}} blocks are converted to `#` comments — the repo convention; files
# 10, 11 and 13 carry zero Helm comment blocks. A `#` comment survives into the rendered manifest, so
# the render hash moves against BASELINE_0.19.1.md; the proof for those edits is a YAML diff showing
# only comments moved.
#
# 0.19.1, PATCH: the dangling-Role sweep was deleting HEALTHY RoleBindings. It asked whether a
# roleRef's target existed with `! oc get role ... >/dev/null 2>&1`, which is true for "not found" AND
# for "Forbidden" — and the sweeper's ClusterRole granted list+delete on roles but NOT `get`. So the
# lookup was refused, every managed RoleBinding looked dangling, and every sync deleted all of them.
#
# It hid because the outcome looked correct. Measured on a no-op 0.18.1 -> 0.19.0 upgrade:
#   06:10:36-40  sweeper deleted 3 rolebindings, reporting "Role/spark-job-submitter-role does not exist"
#   06:10:37-42  the operator rebuilt all 3
#   before 26/13/3 = 42 objects, after 26/13/3 = 42, inventory diff IDENTICAL
# Counts matched, grants worked, and `oc get` showed nothing — while access was actually revoked for a
# second or two in three namespaces on every single sync. The 0.19.0 verification confirmed the EFFECT
# (the roleRef repointed) and never checked the MECHANISM, which is how it shipped.
#
# TWO FIXES, because either alone leaves the trap:
#   1. `get` added to the roles rule. The question needs it; list cannot answer it.
#   2. The script now distinguishes absent from unreadable, using --ignore-not-found (verified on this
#      cluster: absent rc=0/empty, exists rc=0/name, forbidden rc=1). It deletes ONLY on a definite
#      absence and ABORTS on any error, naming the missing verb as the likely cause.
#
# THE SAME DEFECT CLASS WAS FIXED IN BOTH SWEEPS. Every `2>/dev/null || true` is gone: the policy-CR
# lookups now abort instead of yielding an empty list that would make every object look orphaned
# (ORPHAN_LIMIT would have caught that mass deletion, but a limit is a backstop, not a diagnosis), and
# the per-kind object lookups abort instead of reporting a clean run they never performed.
#
# ALSO: crc-values.yaml states the bdp policy's labelKey (company.net/oud-group) explicitly, so the
# per-cluster file records which label decides the grant rather than inheriting it silently.

# 0.19.0, MINOR: a roleName change is now SELF-HEALING, and the policy comments are deduplicated.
#
# THE SWEEPER GAINED A SECOND SWEEP: any RoleBinding whose roleRef names a Role that does not exist is
# deleted, so the operator rebuilds it from the CR with the correct roleRef. That closes the one case a
# plain `helm upgrade` could not finish on its own.
#
# Helm was never the problem — it overrides the CR correctly. Kubernetes is: roleRef is IMMUTABLE, so the
# operator creates the new Role, removes the old one, and then cannot repoint the existing binding. It
# error-loops on "cannot change roleRef" while the CR logs "resources processed successfully", leaving a
# binding that references a Role that is gone and grants nothing. Measured before this change: a plain
# upgrade left `oc auth can-i` returning
#   no - RBAC: role.rbac.authorization.k8s.io "spark-job-submitter-role" not found
# Measured after: 3 bindings repointed within 15 seconds, grants intact, no manual step.
#
# SCOPED TO roleRef kind=Role DELIBERATELY. A Role is created by the same policy that binds it, so a
# missing target means a rename. A ClusterRole is EXTERNAL — customGroupConfig binds roles this chart does
# not create — and one may be legitimately absent while someone applies it; sweeping those would fight the
# operator in a delete/recreate loop. They remain the documented silent-dangle case.
#
# Also fixed a bug in the sweeper found while testing: the first sweep exited 0 on "no orphans", which
# skipped the second sweep entirely — exactly the case where the CRs are healthy and only the bindings are
# stale. Both sweeps now always run.
#
# COMMENTS DEDUPLICATED across templates/rbac-policies: the provenance explanation was copy-pasted into
# all four files and the two-engine explanation into all four, so 35 duplicated comment lines are now 25
# and the files are 20-40% shorter. The canonical explanations live in
# working-sessions/docs/labels-and-annotations.md and templating-guide.md; the templates point at them and
# keep only what is specific to each file. Version history was removed from template and values comments —
# it belongs in this changelog, not in prose that has to be re-read every time.
#
# 0.18.1, PATCH: the oudGroup Role is renamed oud-group-submitter-role -> spark-job-submitter-role, and
# the hazard that comes with it is documented at the key.
#
# CHANGING roleName NEEDS THE CR DELETED. roleRef is IMMUTABLE, so the operator cannot repoint an existing
# RoleBinding at a renamed Role — it creates the new Role, fails the patch with "cannot change roleRef",
# and error-loops while the CR keeps logging "resources processed successfully". The binding stays on the
# old Role, which the template no longer maintains.
#
# Note this is a THIRD distinct case, alongside the two in 0.18.0:
#   rename the CR        `helm upgrade` handles it — Helm deletes and recreates, the finalizer revokes
#   relabel a CR         needs a CR delete — .metadata is excluded, so labels never reach existing objects
#   rename a Role        needs a CR delete — roleRef is immutable, so the binding cannot be repointed
#
# Verified: deleted the CR, upgraded, all three RoleBindings came back on spark-job-submitter-role with
# zero "cannot change roleRef" errors, no stale Roles, 42 objects, grants confirmed.
#
# 0.18.0, MINOR: the shipped oudGroup policy is renamed abc -> bdp, and turned OFF in values.yaml.
#
# values.yaml now grants NOTHING from oudGroup by itself — the policy ships disabled and crc-values.yaml
# turns it on, the same split every other policy flag already uses. A default install of this chart no
# longer creates an oud-group policy at all: defaults render 3 policy CRs, crc-values.yaml renders 5.
#
# `helm upgrade` HANDLES THE RENAME ON ITS OWN — no manual step. Verified: a plain upgrade removed
# abc-oud-group-rbac, created bdp-oud-group-rbac, and the 6 objects came back under the new
# config-source inside 15 seconds with zero orphans.
#
#   key abc -> CR abc-oud-group-rbac, config-source abc-oud-group-rbac
#   key bdp -> CR bdp-oud-group-rbac, config-source bdp-oud-group-rbac
#
# WHY IT WORKS HERE AND NOT IN 0.16.0 — the two cases look alike and are not:
#
#   RENAMING a CR          Helm sees a resource name change, so it DELETES the old CR and CREATES the new
#                          one. Deleting the CR runs its finalizer, which revokes its objects, and the new
#                          CR rebuilds them. Helm's own diff drives it, so `helm upgrade` is enough.
#   CHANGING A LABEL       Helm patches the SAME CR. The operator injects excludedPaths [.metadata, …], so
#   on an unchanged CR     the new label never reaches objects that already exist (GOTCHA 9). Nothing in
#                          Helm's diff can fix that, which is why 0.16.0 needed the CRs deleted by hand.
#
# So: a rename is self-healing, a relabel is not. The brief window while the objects rebuild is real
# either way — for those seconds nobody this policy grants has access — so rename deliberately, not while
# tidying values.
#
# crc-values.yaml also now states baseline.mnemonicLabelKey and baseline.environmentLabelKey explicitly
# rather than inheriting them. They are not decoration — mnemonicLabelKey both SELECTS the namespaces and
# supplies the mnemonic that names the bound group, and environmentLabelKey is what partitions nonprod
# from prod. A per-cluster values file should say out loud which labels it depends on.
#
# 0.17.0, MINOR: removes the duplicate-labelKey guard from the oudGroup template. Behaviour for any
# valid configuration is unchanged — this only stops refusing a configuration it should never have judged.
#
# The guard was on the wrong axis in BOTH directions:
#   NOT NECESSARY   two policies can share a labelKey harmlessly if their objects end up named
#                   differently. The Roles already are — each policy names its own.
#   NOT SUFFICIENT  two policies with DIFFERENT labelKeys still collide if a namespace carries both
#                   labels with the SAME VALUE, since the RoleBinding is named "<label value>-rb". The
#                   guard compared labelKeys, so it permitted exactly that.
#
# AND NO RENDER-TIME GUARD CAN BE CORRECT. The RoleBinding name comes from the label's VALUE, read from a
# namespace at reconcile time — Helm cannot see it. RoleBinding uniqueness is (namespace, name), so
# whether two policies collide is a fact about the cluster, not about values.yaml.
#
# Replaced with the measured failure mode, because it does not announce itself. Applying two
# same-labelKey CRs on purpose showed:
#   - both Roles are created and coexist; only the RoleBinding is contested
#   - the second policy creates ZERO RoleBindings — roleRef is IMMUTABLE:
#       RoleBinding "…-rb" is invalid: roleRef: Invalid value: …: cannot change roleRef
#   - the operator error-loops on that patch forever while the CR still logs
#     "resources processed successfully" at INFO, so the CR looks healthy and the grant is just absent
#
# One labelKey per family is the convention, and it is the family boundary anyway: different label ->
# different namespaces -> different RoleBinding names -> nothing to contest.
#
# 0.16.0, MINOR and A MIGRATION, NOT JUST AN UPGRADE — read the procedure below before syncing.
#
# rbac.ocp.io/config-source NOW HOLDS THE NAME OF THE CR that created the object, on every object, so it
# finally means what its name says. It used to hold a short family name that matched no CR:
#
#   before   config-source: cluster-rbac              label   short family name, matched nothing
#            source-groupconfig: baseline-cluster-rbac  annotation  the actual CR
#   after    config-source: baseline-cluster-rbac     label   the actual CR
#            source-groupconfig: baseline-cluster-rbac  annotation  unchanged, same value
#            source-kind: GroupConfig                 label   NEW — which CRD owns it
#
# THE source-{namespace,group}config ANNOTATIONS ARE UNCHANGED AND STILL PRESENT. They and the label now
# carry the SAME value, and that duplication is deliberate: the label is what you SELECT on, the
# annotation is what you READ in `oc get -o yaml` / `oc describe`, and its key name says which CRD owns
# the object. group-pattern is likewise untouched on the two GroupConfig policies.
#
# It also defangs a trap this repo hit before: `oc -l` matches labels only, so selecting on the
# source-*config annotation returns nothing. That is still true — but the label beside it now holds the
# identical value and does work, so the mistake costs a retry rather than a wrong answer.
#
# source-kind is NEW: NamespaceConfig or GroupConfig, as a LABEL so one query covers either kind
# (`-l rbac.ocp.io/source-kind=GroupConfig`). The annotation key names already implied it; this makes it
# selectable.
#
# THE MIGRATION MATTERS, and skipping it is dangerous. This changes a label VALUE on 36 of 42 objects,
# and metadata does not propagate (GOTCHA 9) — so after a plain `helm upgrade` every existing object
# still carries the OLD value, which matches no CR name. The orphan sweeper reads exactly that key and
# would see all 36 as orphaned. Verified on the test cluster: it found exactly 36 and REFUSED, because
# orphanSweeper.limit is 25:
#
#   ERROR: refusing to delete 36 objects, which exceeds orphanSweeper.limit=25
#
# That guard turned a mass revocation into a failed sync, which is the outcome it exists for. Do NOT
# raise the limit to work around it.
#
# THE PROCEDURE — rebuild the objects as part of the upgrade so the interim state never exists:
#   oc delete namespaceconfig --all && oc delete groupconfig --all   # operator ALIVE; revokes cleanly
#   helm upgrade ... -f <your values>                                # recreates CRs; objects built fresh
# Under ArgoCD the policy CRs sit at a higher sync-wave than the Subscription precisely so reverse-order
# deletion runs their finalizers while the operator is still up.
#
# THE SWEEPER now reads the config-source LABEL instead of the two annotations — one field instead of two
# concatenated, and the same key a human selects on, so the sweeper and the runbook cannot disagree.
#
# The configSource values keys are gone from every stanza: the value is the CR name, so there is nothing
# left to configure.
#
# 0.15.0, MINOR: oudGroup policy `name` and `configSource` are DERIVED FROM THE MAP KEY when left empty.
#
#   policies:
#     abc:
#       name: ''            -> abc-oud-group-rbac
#       configSource: ''    -> abc-oud-group-rbac
#
# The key becomes the single place a policy's identity is written, so the key and the name cannot drift
# apart. Setting either explicitly still overrides the derivation — the escape hatch for a policy that
# must keep a name a cluster already has (verified: name: legacy-name-i-must-keep renders exactly that).
#
# THE CR NAME IS UNCHANGED for the shipped policy: key `abc` derives abc-oud-group-rbac, which is what it
# was already called. No rename, so no revocation.
#
# THE config-source LABEL DOES CHANGE, oud-group-rbac -> abc-oud-group-rbac, and that is metadata, so
# GOTCHA 9 applies: the 6 existing objects keep the OLD value until they are deleted and rebuilt. Until
# then `-l rbac.ocp.io/config-source=abc-oud-group-rbac` finds nothing and the old value still works.
# Deleting the CR and letting Helm recreate it is the fix, and is what was done on the test cluster.
#
# KNOW WHAT DERIVING COSTS: the CR name is cluster identity and Helm treats a renamed resource as
# delete-plus-create, so renaming a KEY now revokes and rebuilds that policy's objects (~4s out, ~50s
# back). That is a deliberate trade for having one source of truth — rename keys on purpose, not while
# tidying values.
#
# The name/configSource "must not be empty" guards are gone, since empty is now the normal case. The
# other guards remain: labelKey, roleName and rules are still required, and two policies may not share a
# labelKey.
#
# 0.14.0, MINOR and A BREAKING VALUES CHANGE: namespaceConfigPolicy.oudGroup becomes a MAP OF POLICIES.
#
# It was a single stanza, so exactly one oud-group policy could ever exist — adding a second name had
# nowhere to go. It now mirrors namespaceConfigPolicy.baseline.policies: a map, one NamespaceConfig per
# entry, each with its own labelKey, Role, rules and config-source.
#
#   BEFORE                                  AFTER
#   oudGroup:                               oudGroup:
#     enabled: true                           enabled: true
#     name: abc-oud-group-rbac                policies:
#     labelKey: company.net/oud-group           abc:
#     roleName: ...                               enabled: true
#     rules: [...]                                name: abc-oud-group-rbac
#                                                 labelKey: company.net/oud-group
#                                                 roleName: ...
#                                                 rules: [...]
#
# An old values file does NOT silently half-work: the template fails with "oudGroup.policies is empty"
# rather than rendering nothing. Migration is re-indenting the existing keys under policies.<name>.
#
# NOT an `entries` list like customGroupConfig uses, and the distinction matters. entries renders several
# objectTemplates inside ONE CR sharing ONE labelSelector; these policies each select on their own
# labelKey, so they need separate CRs. Two policies on the same labelKey are REFUSED — both would match
# the same namespaces and create the same RoleBinding name with different roles, and the operator would
# rewrite one over the other every reconcile.
#
# Six per-policy guards: name, labelKey, roleName, configSource and rules must be set, and labelKey must
# be unique. A policy with enabled: false is skipped, not failed.
#
# 0.13.0, MINOR: closes the ArgoCD pruning hazard. With 0.12.0's CSV self-heal, this completes the
# one-shot story — a sync repairs itself rather than leaving RBAC behind.
#
# THE HAZARD, measured. A policy CR deleted while the operator is DOWN leaves its RBAC objects alive with
# no owning policy: 3 CRs deleted during an operator restart left 20 RoleBindings still granting. They
# carry no ownerReferences, so Kubernetes GC never collects them, and no reconcile ever touches them
# again. `oc get` looks healthy — the objects carry valid-looking provenance to a CR that is gone. Under
# ArgoCD nobody is watching for that.
#
# 1. ORPHAN SWEEPER, ON BY DEFAULT (orphanSweeper.enabled). A PostSync hook at weight 20 / wave 4, so it
#    runs after the policy CRs are applied and after ArgoCD prunes. Deletes an object only when it BOTH
#    carries app.kubernetes.io/managed-by=namespace-configuration-operator AND names a policy CR in
#    rbac.ocp.io/source-{namespace,group}config that does not exist. Verified on cluster: 42 real objects
#    checked and left alone, 2 synthetic orphans found and deleted, an object with the label but no
#    provenance annotation correctly untouched.
#
#    It holds a ClusterRole with delete on rolebindings/clusterrolebindings/roles cluster-wide, because
#    RoleBindings live in every namespace and ClusterRoleBindings are cluster-scoped. Broad, and accepted
#    deliberately: a silent live admin grant is the worse outcome. orphanSweeper.limit (25) aborts a run
#    that would delete more than that — an empty CR list is what a FAILED lookup looks like, and without
#    the cap that would revoke everything the chart grants. Verified: over the limit it exits 1 with
#    every object intact, so the sync goes Degraded instead of quietly emptying the cluster.
#
# 2. WAVE ORDERING PINNED. The policy CRs sit at wave 3 and the Subscription at 0, so ArgoCD's reverse-
#    order deletion removes the CRs FIRST, while the operator can still run their finalizers. That was
#    already true but undocumented and unprotected; ci.yaml now asserts every policy CR's wave exceeds
#    the Subscription's, because an inversion looks fine in the rendered YAML and only surfaces at
#    teardown as CRs stuck in Terminating.
#
# 3. THE RECLAIM HOOK WAITS for OLM to reinstall the operator after it deletes an orphaned CSV, so later
#    hooks and the next sync's pruning find a live controller rather than the exact gap that strands
#    objects.
#
# 0.12.0, MINOR: the chart now SELF-HEALS an orphaned CSV, so install and re-install are one shot.
#
# WHY: ArgoCD will manage this release. `helm uninstall` deletes the Subscription and OLM leaves the CSV
# behind with no ownerReferences, so nothing collects it — and the next install cannot resolve
# ("clusterserviceversion ... exists and is not referenced by a subscription"). A declarative sync has
# nobody to run `oc delete csv`, so that state would fail every sync forever.
#
# NEW HOOK: templates/06a-csv-reclaim-job.yaml at hook-weight 0, ahead of the InstallPlan approver (5)
# and the image-override job (10). The weight is the point. With the reclaim living in the
# image-override job at weight 10, the approver ran FIRST and waited for an InstallPlan that a failed
# resolution can never produce — measured 03:26:53 to 03:30:29 — and the install only recovered because
# the reconcile CronJob happened to fire at 03:30:00 and clean up. That was luck, not a mechanism.
#
# Proven with the CronJob SUSPENDED so only the hook could act:
#   one-shot install over an orphaned CSV   80s   (was 240s and CronJob-dependent)
#   reclaim at 03:35:50, OLM re-resolved, 5 CRs and 42 objects back, operator 2/2
#
# UPGRADE IMPACT, measured on a healthy cluster: +5s for one extra Job, and the hook decides in ~1s
# ("reclaim-only mode: done") because installedCSV is already set. CSV uid unchanged, object count
# unchanged. It cannot touch a healthy CSV: the delete is gated on ResolutionFailed=True.
#
# SIX CONDITIONS before anything is deleted — ResolutionFailed on our Subscription, CSV in the install
# namespace, name matches the package, no ownerReferences, unreferenced by any Subscription, and NOT an
# OLM copy. That last one is load-bearing: AllNamespaces mode copies this CSV into every namespace (104
# on the test cluster) and every copy looks unowned and unreferenced. Only the source blocks resolution.
#
# Set operatorImage.reclaimOrphanedCSV=false to disable and have the hook fail loudly instead.
#
# 0.11.0, MINOR: shortens every policy CR name to <family>-<scope>-rbac.
#
#   nonprod-namespaceconfig-rbac         -> baseline-nonprod-rbac
#   prod-namespaceconfig-rbac            -> baseline-prod-rbac
#   baseline-cluster-groupconfig-rbac    -> baseline-cluster-rbac
#   abc-oud-group-namespaceconfig-rbac   -> abc-oud-group-rbac
#   custom-groupconfig-rbac              -> custom-cluster-rbac
#
# The two baseline NamespaceConfigs gain the `baseline-` prefix they were missing, and every name drops
# the CRD kind. Nothing forced the shortening — the name lands only in the rbac.ocp.io/source-*config
# ANNOTATION, which is unbounded, and no generated object name derives from it, so the 63-character label
# cap never applied. It is a readability change: `kind:` and the rbac.ocp.io/kind label already state the
# CRD, and the names now line up with the rbac.ocp.io/config-source label values.
#
# THE TEMPLATE FILENAMES DELIBERATELY KEEP THE KIND — 10-baseline-namespaceconfig-rbac.yaml,
# 11-baseline-groupconfig-rbac.yaml and so on are unchanged. Filename says which CRD a template handles;
# CR name says which policy it is on a cluster. See templates/rbac-policies/_README.txt.
#
# FIVE RENAMES IS FIVE DELETE-PLUS-CREATES: all 42 generated objects are revoked and rebuilt in one
# window. Measured on the 0.10.0 single rename: 12 objects back within ~6s, zero orphans. A rename is
# reliable, unlike removing a role from a list — see the warning on clusterRbac.roles.
#
# Anything reading rbac.ocp.io/source-namespaceconfig or source-groupconfig needs updating.
# rbac.ocp.io/config-source is UNCHANGED and remains the label to select on.
#
# 0.10.0, MINOR: renames the cluster-wide GroupConfig from baseline-groupconfig-rbac to
# baseline-cluster-groupconfig-rbac, so its name says which SCOPE it covers — the sibling NamespaceConfig
# policies already carry nonprod/prod in theirs, and "baseline" alone did not distinguish the two.
#
# A rename is a REVOCATION AND REBUILD, not a relabel. Helm treats it as delete-plus-create: the old CR's
# groupconfig-controller finalizer deletes all 12 ClusterRoleBindings, then the new CR recreates them.
# Measured on the equivalent oud-group rename in 0.9.0: objects gone in ~4s, back within ~50s. On a shared
# cluster that is a window with no cluster-wide access for anyone this policy grants.
#
# The rbac.ocp.io/source-groupconfig ANNOTATION on every generated object changes with it. Anything reading
# that value needs updating; rbac.ocp.io/config-source is unchanged (still cluster-rbac) and remains the
# label to select on.
#
# 0.9.0, MINOR and BEHAVIOUR-CHANGING IN BOTH DIRECTIONS — read before upgrading.
#
# THE POLICIES NOW SHIP ENABLED. namespaceConfigPolicy, its baseline and oudGroup children, and
# clusterRbac all default to true; only customGroupConfig is still off. A `helm install` with no flags
# used to deploy the operator alone and now deploys four policies, which WRITE RBAC on any namespace or
# group matching their selectors. If you install this chart expecting the operator only, set
# namespaceConfigPolicy.enabled=false and clusterRbac.enabled=false explicitly.
#
# TWO ACCESS TIERS WERE REMOVED, and on an existing release upgrading REVOKES them:
#   nonprod  ns-admin      gone — the tier no longer renders
#   prod     ns-developer  gone — prod is audit-only now
# Measured on this cluster before the change: 10 nonprod ns-admin and 3 prod ns-developer
# RoleBindings. Those 13 are deleted by the upgrade and do not come back. This is the whole point of
# the change, but it is an access revocation, not a refresh.
#
# THE oud-group POLICY WAS RENAMED to abc-oud-group-namespaceconfig-rbac. Helm treats a renamed
# resource as delete-plus-create, so the old CR's finalizer revokes its objects and the new CR rebuilds
# them — 6 objects, ~4s to revoke and ~50s to restore. No orphans.
#
# oud-group's Role also gained secrets (create,get,watch,delete,update,patch) and patch/update on the
# core resources. Namespace-scoped, so it is secrets in the matched namespaces only — but note that
# reading secrets in a namespace includes the ServiceAccount tokens in it.
#
# 0.8.0, MINOR but BREAKING FOR ANY QUERY THAT SELECTS ON THE OLD LABELS. Aligns labels and annotations
# across all four policies so one key carries one fact and the same key means the same thing everywhere.
# Full contract and evidence: working-sessions/docs/labels-and-annotations.md §5.
#
# MINOR rather than MAJOR because this chart is pre-1.0, where a MINOR bump is the conventional place for
# a breaking change. Calling it a patch would be dishonest; calling it 1.0.0 would claim a stability
# guarantee the chart is not ready to make.
#
# REMOVED from generated objects: access-level, custom-role, rbac-type, policy-version, access-model,
# oud-group, and the annotations created-by, source-namespace, environment-restriction,
# scope-restriction. Each was measured to be either a duplicate of another key on the same object or
# actively misleading — access-level named the bound ClusterRole in two families and the tier word in the
# other two, so "who holds view?" answered through it returned 2 of the 15 objects that bind view.
#
# ADDED to generated objects: rbac.ocp.io/bound-role (the role actually bound — makes that query return
# all 15), rbac.ocp.io/scope, and rbac.ocp.io/config-source + role-type + group-name on the policies that
# lacked them. Six keys are now on every object; the only remaining variation is structural.
#
# CR-LEVEL: access-model becomes identity-source + group-naming (it was comparing two different axes),
# app.kubernetes.io/component collapses from three values to one, custom-gc gains the scope label it was
# missing, and policy-version and part-of are gone.
#
# VALUES REMOVED: policyVersion (all four stanzas), accessLevelSuffix (nonprod and prod),
# oudGroup.accessLevel -> oudGroup.roleType. oudGroup.configSource is NEW and required. An old values
# file still renders — Helm ignores keys the templates no longer read — so the failure mode is a silently
# missing label, not an error. Check anything that greps these labels before upgrading.
#
# UPGRADING DOES NOT RELABEL EXISTING OBJECTS. The operator injects excludedPaths [.metadata, ...], so an
# objectTemplate metadata change reaches nothing that already exists (GOTCHA 9). Delete the CRs and let
# the operator rebuild — measured at 51 objects revoked in 4s and restored within 50s, which is a real
# revocation window on a shared cluster.
#
# 0.7.0, MINOR: a new template and a new top-level `customGroupConfig` stanza — binding ClusterRoles the
# platform does NOT ship, to any group-name suffix chosen in values. The counterpart to clusterRbac,
# which binds the built-in admin/edit/view. It does NOT create the roles: a chart that both defines a
# privileged ClusterRole and binds it hides the grant in a values file. Ships disabled, with
# database-admin as an inert worked example.
