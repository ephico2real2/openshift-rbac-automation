# Namespace Configuration Operator (NCO) — OLM install chart values
# Installs the redhat-cop Namespace Configuration Operator via OLM.
# Full guide: chart README.md. Policies (GroupConfig/NamespaceConfig) are separate.

# -------------------- Install namespace --------------------
# The operator is installed into this namespace. It watches ALL namespaces
# (AllNamespaces / global mode), because it configures namespaces cluster-wide.
namespace: namespace-configuration-operator

# Create the install namespace as part of this release.
# Set to false if the namespace already exists or is managed elsewhere
# (e.g. installing into the built-in "openshift-operators" namespace).
#
# FALSE here because this namespace predates the chart and is not Helm-owned. As of 0.19.3 the
# template is an ORDINARY RESOURCE rather than a pre-install hook, so Helm applies it, reconciles
# the PSA labels on upgrade, and removes it on uninstall — but adopting a namespace it did not
# create still needs that namespace stamped with the release's ownership metadata, or Helm refuses
# with "invalid ownership metadata". Leaving this false is the simpler answer for an existing
# namespace, and the only answer for openshift-operators or anything managed elsewhere.
#
# Set it true for a genuinely new namespace, or to adopt an existing one after stamping it:
#   oc label ns <ns> app.kubernetes.io/managed-by=Helm
#   oc annotate ns <ns> meta.helm.sh/release-name=<release> meta.helm.sh/release-namespace=<ns>
createNamespace: false

# -------------------- OperatorGroup --------------------
# Create an AllNamespaces (global) OperatorGroup in the install namespace.
# NCO must watch every namespace, so the OperatorGroup has NO targetNamespaces
# (an empty spec = AllNamespaces mode). This is the key difference from a targeted
# operator like group-sync (which scopes to specific namespaces).
#
# IMPORTANT: set to false when installing into a namespace that ALREADY has a global
# OperatorGroup (e.g. "openshift-operators") — two global OperatorGroups in one
# namespace is an OLM conflict that breaks operator installs in that namespace.
createOperatorGroup: true

# -------------------- Subscription (OLM) --------------------
subscription:
  # Package name in the catalog source.
  packageName: namespace-configuration-operator
  # Update channel (alpha is the only channel published for this operator).
  channel: alpha
  # Catalog source and its namespace (default OpenShift community catalog).
  source: community-operators
  sourceNamespace: openshift-marketplace
  # Manual = OLM stages an InstallPlan that you approve before the operator (re)installs.
  # Automatic = OLM applies InstallPlans without approval.
  #
  # MANUAL, and it stays honest: the autoApproveInstallPlan Job below approves ONLY the
  # InstallPlan for the pinned startingCSV, so a fresh install still completes unattended
  # while any later channel upgrade is staged and waits for a human. Declared state matches
  # live state, which matters because this chart is ArgoCD-annotated — a Job that mutated
  # this field instead would show as permanent drift and be reverted by self-heal.
  installPlanApproval: Manual
  # Pin the initial CSV version for reproducible installs (empty = channel head).
  # With autoApproveInstallPlan below, this pin is also the APPROVAL AUTHORITY: only an
  # InstallPlan for exactly this CSV is approved automatically.
  startingCSV: "namespace-configuration-operator.v1.2.6"

  # Scoped InstallPlan approver. Makes installPlanApproval: Manual workable unattended.
  #
  # Approves only the InstallPlan installing `csv` (defaults to startingCSV) and owned by
  # this chart's Subscription. Anything else — a newer CSV appearing in the alpha channel,
  # or another operator's InstallPlan sharing the namespace — is logged and left unapproved.
  # To adopt a new version, bump startingCSV and re-sync: the upgrade becomes a reviewable
  # git change instead of an `oc patch` on the cluster.
  #
  # Set enabled: false for a strictly hands-on install (you approve the InstallPlan yourself,
  # and the image-override hook will wait for you up to its own timeout).
  autoApproveInstallPlan:
    enabled: true
    # Empty = use startingCSV. Set explicitly only to approve a CSV other than the pin.
    csv: ""
    # How long to wait for the InstallPlan to appear, and then to reach Complete.
    waitSeconds: 300
    backoffLimit: 3
    activeDeadlineSeconds: 900
    ttlSecondsAfterFinished: 3600

  # Operator runtime env, injected via Subscription spec.config.env (an OLM-supported
  # override). zap logger controls (the operator uses controller-runtime's zap logger):
  #   ZAP_LOG_LEVEL: verbosity — debug | info | error (or a level number)
  #   ZAP_DEVEL:     development-mode logging (console encoder + stacktraces); "false" for prod
  zapLogLevel: "info"
  zapDevel: "false"

  # UNUSED — the template no longer reads this, so setting it has NO effect.
  #
  # RELATED_IMAGE_MANAGER does not change THIS operator's own image: it is an operand-image
  # hint and NCO deploys no operand pods. Proven on-cluster — the env var was injected and
  # the manager image stayed upstream (docs/local-testing/LOCAL_TEST_operator_image_override.md §4a),
  # so the env block is commented out in templates/02-subscription.yaml.
  #
  # Use operatorImage.enabled below to override the image. This key is retained only so an
  # existing values file that still sets it does not fail to render; it is inert and can be
  # dropped once no environment references it.
  relatedImageManager: ""

  # Extra env vars appended to spec.config.env, as a list of {name, value}.
  extraEnv: []

  # Operator resource requests/limits (spec.config.resources). Empty {} to omit.
  #
  # SIZED FOR CRC. This single-node cluster allocates 4800m CPU and already sits at ~89%
  # requested, leaving roughly 500m. A rolling update needs TWO operator pods briefly, so the
  # previous 250m request (=500m for the pair) wedged the rollout with "Pending: Insufficient
  # cpu" — that is the failure recorded in docs/local-testing/ §4c. 100m matches what the
  # operator actually ran with under the CSV defaults and leaves headroom for the rollout.
  # Raise these on a properly-sized cluster.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -------------------- Orphan sweeper (one-shot self-healing) --------------------
# Deletes RBAC objects whose owning policy CR no longer exists.
#
# ON BY DEFAULT, because the chart is meant to be one shot under ArgoCD. A declarative sync has nobody
# to notice a dangling grant, and the failure it cleans up is silent: the objects look healthy, carry
# valid-looking provenance, and point at a policy that is not there.
#
# MEASURED, not hypothetical. Three CRs deleted while the operator was restarting left 20 RoleBindings
# alive and still granting, with no owning policy. They had no ownerReferences, so Kubernetes GC would
# never have collected them, and no future reconcile would ever touch them again. They had to be found
# and deleted by hand — this stanza is that clean-up made automatic.
#
# IT HOLDS A BROAD PERMISSION. The sweeper runs with a ClusterRole granting delete on rolebindings,
# clusterrolebindings and roles cluster-wide, because RoleBindings live in every namespace and
# ClusterRoleBindings are cluster-scoped. What narrows it is the script, not the RBAC: an object is only
# ever deleted if it carries app.kubernetes.io/managed-by=namespace-configuration-operator AND names a
# policy CR in its rbac.ocp.io/config-source LABEL that does not exist. Objects without that label are
# counted and left alone.
# -------------------- Operator readiness wait --------------------
# Blocks the install until the operator can actually SERVE NamespaceConfig and GroupConfig: the CSV
# Succeeded, the operator Deployment has a ready replica, and both CRDs report Established.
#
# WHY IT IS NOT OPTIONAL IN PRACTICE. The Subscription is an ordinary resource, so Helm creates it and moves
# on while OLM installs the operator asynchronously. Everything after that assumes the operator is serving —
# the policy CRs are those kinds, and the orphan sweeper LISTS those kinds to decide what to delete. Against
# an apiserver that does not serve them yet it would see nothing and act on that.
#
# It carries BOTH ordering mechanisms because they are not interchangeable:
#   helm.sh/hook-weight 6   after the InstallPlan approver (5), before the image override (10) and the
#                           sweeper (20). The only ordering plain Helm has.
#   argocd sync-wave 2      after the Subscription (0) and approver (1), BEFORE the policy CRs (3). ArgoCD
#                           waits for a wave to be healthy before starting the next, so a failed wait stops
#                           the CRs being applied at all — which hook weights cannot do.
#
# It does NOT itself fix kind discovery on a first install: the vendored crds/ files do that, installed by
# Helm before any template renders (see namespaceConfigPolicy.enabled: one command on a bare cluster). This
# Job solves the next problem, by not returning until those CRDs are Established and the operator that
# serves them is ready.
operatorWait:
  enabled: true

  # One budget for all three checks, not per check. activeDeadlineSeconds is this + 120, so the script's own
  # message is the one you see rather than the kubelet killing the pod silently.
  waitSeconds: 300

  # 0: every check is a poll against the same state, so a retry re-waits from zero and turns a 5-minute
  # failure into a 10-minute one with no new information.
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

orphanSweeper:
  # OFF removes the Job, the ConfigMap and the ClusterRole entirely — nothing is left holding the
  # permission. The trade-off is that an orphaned grant then survives until somebody runs the query in
  # working-sessions/docs/labels-and-annotations.md §5 and notices.
  enabled: true

  # Report without deleting. Useful for one sync to see what it WOULD remove before letting it act.
  # Leave false for the one-shot behaviour: with dryRun true the sweeper logs orphans and exits 0, so
  # ArgoCD reports a healthy sync while the dangling grants remain.
  dryRun: false

  # NO CAP BY DEFAULT. A real sweep is however big it is, and refusing to finish leaves live grants behind
  # a policy that no longer exists — which is the thing this Job exists to prevent. Set a non-zero value to
  # turn the circuit breaker back on; 0 disables it.
  #
  # WHY A COUNT IS NOT THE GUARD. The blast radius is bounded by the LABEL CONTRACT, not by a number. The
  # sweep only ever considers an object carrying BOTH app.kubernetes.io/managed-by=<this chart> AND
  # rbac.ocp.io/config-source=<the CR that should own it>, and an object with no config-source is counted as
  # kept and left alone — "not ours to reason about". That contract is why one provenance KEY as a LABEL
  # (0.16.0) replaced two concatenated annotations: the sweeper and a human runbook select on the same field,
  # so they cannot disagree about what owns an object.
  #
  # The failure mode a cap once caught has not gone away — at 0.16.0 a label-value migration left 36 objects
  # whose config-source named no CR. It is now surfaced rather than blocked: the candidate count and the live
  # CR list are logged before anything is deleted, so "429 orphaned against 5 live policies" is visible in the
  # log as the contradiction it is. Deletes are paced and retried instead of refused.
  limit: 0

  # Between individual deletes, not around the batch. Each delete revokes access, and a burst of hundreds
  # competes with the operator's own reconcile of the same objects.
  pauseSeconds: 1
  # A conflict or timeout mid-reconcile is worth retrying; only the last attempt keeps stderr, so a genuine
  # failure is explained once instead of three times. A delete that never succeeds FAILS the run — reporting
  # a clean sweep while a grant is still live is worse than failing.
  retries: 3
  retryDelaySeconds: 2

  backoffLimit: 2
  # Was 300, which capped the sweep at five minutes — fine for a handful of orphans, not for an uncapped run
  # pacing itself at pauseSeconds per delete. Matches the sibling group-sync relabel Job's 1800.
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# -------------------- Operator image override (CSV patch) --------------------
# Runs our own build of the operator instead of the catalog's image.
#
# OLM has no supported operator-image override: Subscription.spec.config carries no image
# field, and RELATED_IMAGE_MANAGER is an *operand* hint that this operator ignores (proven —
# docs/local-testing/LOCAL_TEST_operator_image_override.md). What DOES work is patching the
# installed CSV: OLM treats spec.install.spec.deployments[] as the source of truth for the
# operator Deployment and re-applies it within seconds. A Job does that patch, replacing the
# Kyverno image-rewrite policy.
#
# TRADE-OFF vs Kyverno: Kyverno enforced at admission, so it self-healed. The patch Job is one-shot —
# an OLM operator upgrade installs a fresh CSV and the upstream image comes back — and the `reconcile`
# CronJob below (on by default) is what reapplies it. Set `reconcile.enabled: false` for one-shot behaviour.
operatorImage:
  # ON: this chart now owns the operator image. The Kyverno policies that used to do it
  # (replace-operator-image-to-dockerhub, inject-dockerhub-secret) have been deleted — they
  # would fight this Job, mutating the Deployment back to docker.io at admission and making
  # the Job's propagation check fail. Both are backed up in docs/local-testing/kyverno-backup/.
  enabled: true

  # The image to run. Must be pullable by the cluster (set imagePullSecret if private).
  repository: quay.io/ephico2real/namespace-configuration-operator
  tag: latest
  # Always, so a moving ":latest" tag is re-pulled on every pod start.
  pullPolicy: Always

  # SELF-HEAL AN ORPHANED CSV. Leave this ON if anything automated manages the release.
  #
  # `helm uninstall` deletes the Subscription and OLM leaves the CSV behind with no ownerReferences, so
  # nothing collects it. The next install cannot resolve — "clusterserviceversion ... exists and is not
  # referenced by a subscription" — and with installPlanApproval: Manual the symptom is the image-override
  # hook burning its full waitSeconds and then blaming InstallPlan approval, which is not the cause.
  #
  # ArgoCD is the reason this defaults to true: a declarative sync has no human to run
  # `oc delete csv`, so a Subscription stuck on ResolutionFailed fails every sync forever. With this on,
  # the hook reclaims the orphan and OLM re-resolves by itself — install and re-install are one shot.
  #
  # It deletes something the chart does not own, so it is fenced by six conditions checked together:
  # our Subscription reports ResolutionFailed, the CSV is in the install namespace, its name matches the
  # package, it has no ownerReferences, no Subscription reports it installed, and it is NOT an OLM copy.
  # That last one is load-bearing — AllNamespaces mode copies this CSV into every namespace (104 of them
  # on the test cluster) and every copy looks unowned and unreferenced. Only the source blocks resolution.
  #
  # Set false to make the hook fail loudly instead, leaving the orphan for a human to remove:
  #   oc delete csv -n <namespace> <package>.vX.Y.Z
  reclaimOrphanedCSV: true

  # How long the reclaim hook waits for OLM to publish a verdict on the Subscription — either an
  # installed CSV (healthy, nothing to do) or ResolutionFailed (act). Straight after a sync neither is
  # set yet, so it has to poll; sampling once is how this silently became dependent on the reconcile
  # CronJob firing. Measured: a healthy upgrade resolves on the first poll and the hook exits in ~1s,
  # so this ceiling only applies when something is actually wrong.
  reclaimWaitSeconds: 90

  # Safety guard. The patch is applied only when the CSV's current image either sits in the
  # `repository` above (a tag bump — always in policy) or matches this pattern. Anything else
  # is refused rather than silently overwritten, which is what makes the unattended reconcile
  # CronJob safe. Widen it if you fork from a different upstream.
  expectedImagePattern: '^quay\.io/redhat-cop/namespace-configuration-operator(@sha256:[0-9a-f]{64}|:[A-Za-z0-9_.-]+)$'

  # Where inside the CSV to patch. Both are matched BY NAME and the array indices are
  # discovered at runtime — in v1.2.6 the manager is containers[1] and kube-rbac-proxy is
  # containers[0], and that ordering is a bundle detail, not a contract.
  csvDeploymentName: namespace-configuration-operator-controller-manager
  containerName: manager

  # Pull secret for a private registry, written into the CSV deployment's podSpec. Leave
  # empty for a public image — the default quay repo is public, so none is needed.
  # (This is the knob that replaces the `inject-dockerhub-secret` Kyverno policy.)
  imagePullSecret: ""

  # Periodic drift correction — the Kyverno-equivalent self-healing. Each run is idempotent
  # and exits early when the CSV is already correct. Leave off if you would rather the image
  # revert visibly on an operator upgrade than be silently re-patched.
  # ON: Kyverno used to enforce the image continuously at admission, and deleting it removed
  # that self-healing. Without this CronJob an OLM operator upgrade would silently revert the
  # operator to the upstream catalog image. Each run is a cheap no-op when the CSV is correct.
  reconcile:
    enabled: true
    schedule: "*/10 * * * *"
    startingDeadlineSeconds: 120
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 3

  job:
    # `oc` client image. The openshift/cli imagestream ships on every OpenShift cluster and
    # needs no pull credentials.
    image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
    # Per-wait budget: how long to wait for the CSV to appear, for OLM to propagate the
    # patch, and for the rollout. Generous, because with installPlanApproval=Manual the
    # InstallPlan may sit unapproved for a while.
    waitSeconds: 300
    backoffLimit: 3
    activeDeadlineSeconds: 1200
    ttlSecondsAfterFinished: 3600
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

# -------------------- Namespace Pod Security --------------------
# NCO's controller runs with elevated privileges. The live operator namespace sets
# audit/warn to "privileged" (non-enforcing — they only log/warn, never block).
# Applied only when createNamespace is true.
podSecurity:
  audit: privileged
  warn: privileged

# -------------------- RBAC Policies (NamespaceConfig CRs) --------------------
# THIS EXTENDS THE CHART'S SCOPE, deliberately, and Chart.yaml's description says so.
#
# Until now this chart installed the OPERATOR and nothing else, and the policies under
# working-sessions/policies were applied by hand. That split costs something real: a policy applied
# with `oc apply` has no owner, no release history and no `helm diff` — the only way to know what is
# on the cluster is to look. Bringing a policy in here makes it versioned with the operator that
# reads it, which is the thing it cannot work without.
#
# The raw YAML under working-sessions/policies/ IS NOT REPLACED. It stays as the readable reference
# and the record of why each access model exists; this stanza is the deployable form. A policy is
# converted one at a time, each behind its own flag, so a chart upgrade cannot adopt a policy the
# operator did not ask for.
#
# A FIRST INSTALL ON A BARE CLUSTER IS ONE COMMAND. No two-step, no pre-applied CRD, no flags to flip
# and flip back — for `helm install` and for an ArgoCD sync alike. Two mechanisms make that true, and
# they are not interchangeable:
#
#   crds/                  These flags being on means the manifest contains NamespaceConfig and
#                          GroupConfig objects, and Helm resolves every kind against API discovery
#                          BEFORE it applies anything — so on a cluster with no operator the install
#                          would fail outright with `no matches for kind "NamespaceConfig" ... ensure
#                          CRDs are installed first`. No hook weight and no sync-wave can fix that:
#                          both are read long after the failure. Helm applies crds/ before it renders
#                          templates, which is early enough, and it is the only mechanism Helm offers.
#                          See charts/openshift-rbac-automation/crds/ for the measured proof and
#                          for why OLM, not Helm, still owns those CRDs at runtime.
#   operatorWait           The CRDs existing is not the operator being able to serve them. The wait Job
#                          blocks until the CSV is Succeeded, the operator has a ready replica and both
#                          CRDs report Established. Measured on a bare-cluster install: its first poll
#                          saw the CSV still `Installing`, so it is doing real work, not decorating.
#
# Verified end to end on a bare cluster (every NCO CRD, CSV and policy CR deleted first): one
# `helm install` → revision 1 deployed in 3m21s, 2/2 CRDs, CSV Succeeded, operator ready, 5/5 policy
# CRs, and the 42 operator-managed RBAC objects rebuilt.
#
# ON BY DEFAULT — a deliberate choice, with CI asserting "defaults render what values declares"
# rather than "defaults render nothing". A plain `helm install` with stock values therefore
# CREATES RBAC: the two baseline NamespaceConfigs and the cluster GroupConfig render immediately
# (bdp and customGroupConfig still ship off). Set this false — and clusterRbac.enabled below — before
# installing anywhere that must not receive the baseline.
namespaceConfigPolicy:
  # Master switch for every policy below. With this false, no policy renders whatever its own flag
  # says — one place to stop the chart writing RBAC at all.
  enabled: true

  # -------- company.net/oud-group --------
  # The label holds the WHOLE group name and the template uses it verbatim:
  #
  #   company.net/oud-group: bda-rbac-trino-alpha-users   ->   bound as-is
  #
  # rather than holding a fragment that the template prefixes. That makes it explicit —
  # `oc get ns --show-labels` shows exactly what gets bound, and `oc get group <value>` works with no
  # transformation — and family-agnostic: one config binds app-ocp-rbac-*, bda-rbac-*, or a future
  # family, instead of one config per family with the prefix baked in.
  #
  # THE COST, stated: the hardcoded prefix was a guardrail that made it impossible for a namespace to
  # bind anything outside its family. With the full name in the label that constraint has to live
  # somewhere else, so it lives in Kyverno — working-sessions/policies/kyverno-namespace-oud-group.yaml
  # — where it is visible and auditable rather than buried in an objectTemplate.
  oudGroup:
    # Master switch for EVERY policy below.
    enabled: true

    # A MAP OF POLICIES, one CR each — the same shape as namespaceConfigPolicy.baseline.policies, and
    # for the same reason: each family selects on its own label and defines its own Role, so each needs
    # its own CR.
    #
    # WHY A MAP AND NOT AN `entries` LIST like customGroupConfig uses. An entries list renders multiple
    # objectTemplates INSIDE ONE CR, sharing that CR's single labelSelector. These policies each select
    # on their OWN labelKey and define their OWN Role, so they cannot share a CR — they are separate
    # NamespaceConfigs.
    #
    # TWO POLICIES MAY SHARE A labelKey — since 0.20.0, and only when every sharer narrows itself with
    # its own DISJOINT groupPrefix. That is what lets one label key carry several group families:
    #
    #   bdp:   { labelKey: company.net/oud-group, groupPrefix: bda-rbac-spark }
    #   trino: { labelKey: company.net/oud-group, groupPrefix: bda-rbac-trino }
    #
    # Anything more ambiguous is REFUSED at render time — sharing without a groupPrefix on every
    # sharer, or prefixes where one is a prefix of the other. Unguarded sharing was measured to fail
    # SILENTLY (both policies contest one RoleBinding name; roleRef is immutable; the operator
    # error-loops while both CRs log success), which is why the refusal is loud and names both
    # policies.
    #
    # Each policy renders: one namespace-scoped Role from its `rules`, plus one RoleBinding whose subject
    # is the VALUE of its labelKey, used verbatim.
    policies:
      # ---- the bdp oud-group family ----
      # OFF here, ON per cluster. This example policy grants nothing from stock values; crc-values.yaml
      # turns it on for the test cluster. Unlike the baseline namespace policies and clusterRbac, which
      # ship on, it defaults off.
      bdp:
        enabled: false

        # The CR's name, and the value written into every generated object's
        # rbac.ocp.io/source-namespaceconfig ANNOTATION — so a generated Role can be traced back to what
        # made it. Annotation, not a label: `oc -l` will not match it, so use
        # rbac.ocp.io/config-source below to select this policy's objects.
        #
        # EMPTY = derive from the map key above: `bdp` -> bdp-oud-group-rbac. Set it explicitly only
        # to pin a name a cluster already has.
        #
        # CHANGING EITHER — the key or this name — IS A REVOCATION, not an orphaning. Helm treats a
        # renamed resource as delete-plus-create: the old CR's namespaceconfig-controller finalizer
        # revokes every object it made and the new CR rebuilds them. Measured on this cluster: 6 objects
        # (3 Roles + 3 RoleBindings) gone in ~4s, back within ~50s. Nothing is left behind — an earlier
        # version of this comment claimed objects would be orphaned, which is the opposite of what happens
        # and would have led someone to hunt for stale objects instead of planning a window.
        name: ''

        # THE LABEL, and it does two jobs: the CR selects namespaces that HAVE it, and the template binds
        # whatever its VALUE says. Both, from one key — which is why the template refuses to render when
        # it is empty rather than selecting every namespace and binding a group called "".
        labelKey: company.net/oud-group

        # OPTIONAL: narrow this policy to label VALUES in one group family, so several policies can
        # share the labelKey above and be told apart by the value. ALWAYS a prefix match, and the
        # spelling is normalized — these three mean the identical guard:
        #
        #   groupPrefix: bda-rbac-spark
        #   groupPrefix: bda-rbac-spark-
        #   groupPrefix: bda-rbac-spark-*     # the group-sync chart's groupCn spelling, accepted for
        #                                     # consistency; the star adds nothing here
        #
        # All three narrow to values starting "bda-rbac-spark-" — the hyphen is appended
        # deliberately, so bda-rbac-sparkles can never match a bda-rbac-spark policy. A "*" anywhere
        # but trailing is refused at render time. Case-sensitive.
        #
        # UNLIKE the other two groupPrefix fields in this file (clusterRbac's and customGroupConfig's,
        # which only DOCUMENT a family on the group-pattern annotation), THIS ONE NARROWS. It can:
        # for this policy the label value IS the group name, so a prefix on the value is a prefix on
        # the group. Enforced by a guard the OPERATOR evaluates per namespace, not by the CR's
        # labelSelector — matchExpressions has no wildcard operator (see 13-'s header for what
        # happens when an unsupported selector is tried).
        #
        # EMPTY = every NON-EMPTY value (a value of "" is skipped either way — before 0.20.0 it
        # error-looped the operator on a RoleBinding named "-rb"; now both templates render empty for
        # such a namespace). Required whenever another enabled policy shares this labelKey.
        #
        # ADDING THIS TO A POLICY THAT IS ALREADY DEPLOYED needs one manual step, measured on CRC:
        # the operator does not reliably remove the objects the narrowing displaces (1 of 3
        # namespaces cleaned; the rest kept a live, still-granting binding). After the upgrade,
        # delete this policy's objects from every namespace it no longer matches:
        #   oc delete role,rolebinding -n <namespace> -l rbac.ocp.io/config-source=<cr-name>
        # The operator recreates what it still wants within seconds. Details in Chart.yaml's 0.20.0
        # entry, including why re-triggering reconciles cannot do this for you.
        groupPrefix: ''

        # The Role this policy creates — one per namespace, from the first template — and what its
        # RoleBinding points at.
        #
        # CHANGING THIS IS SELF-HEALING on a plain `helm upgrade` — no manual step. It takes a detour
        # worth knowing about, because roleRef is IMMUTABLE in Kubernetes:
        #   1. the operator creates the new Role and removes the old one
        #   2. it CANNOT repoint the existing RoleBinding, so that patch fails with "cannot change
        #      roleRef" and the binding is left referencing a Role that is gone — granting nothing
        #   3. the orphan sweeper deletes any RoleBinding whose Role does not exist, and the operator
        #      rebuilds it from the CR with the correct roleRef
        # Measured end to end: 3 bindings repointed within 15 seconds of the upgrade, grants intact.
        # The sweep is scoped to roleRef kind=Role for a reason — see templates/14-orphan-sweeper-script.
        roleName: spark-job-submitter-role

        # The TIER, written to rbac.ocp.io/role-type on both the Role and the RoleBinding — the same key
        # every policy uses, so one query finds every tier across all of them. Descriptive only: it grants
        # nothing, `rules` below is the grant.
        roleType: spark-job-submitter

        # Paths the operator never enforces on the objects it creates: set at creation, then left alone.
        #
        # THE CHART'S POLICY, [.status, .spec.replicas], is added to this list by 12- at render time, so
        # what you write here is the EXTRA paths for this policy. Listing the two anyway keeps values
        # reading the same as the rendered CR. .metadata is NOT here any more: rendered labels and
        # annotations are enforced (10-'s header has the history and the ordering requirement).
        #
        # Adding .metadata (or .metadata.labels / .metadata.annotations) back is REFUSED at render time
        # unless allowMetadataExcluded is true. It would
        # make this policy's rendered labels and annotations set-once again and quietly undo the 0.22.0
        # migration for this policy, which is exactly what a values file written before 0.22.0 does.
        # Set the flag only when set-once metadata on this policy's objects is the intent.
        allowMetadataExcluded: false
        excludedPaths:
          - .status
          - .spec.replicas

        # THE ACTUAL PERMISSIONS. Namespace-scoped, so nothing here can grant cluster-wide access — a
        # Role bound by a RoleBinding in one namespace.
        #
        # `deletecollection` is the one worth noticing: it lets the holder delete every pod in the
        # namespace in one call. That is intended for a workload submitter cleaning up a run, and it is
        # also the verb to remove first if this is ever narrowed.
        #
        # pods/log is a separate rule because it is a SUBRESOURCE — listing it beside `pods` in the same
        # rule would grant get/list/create/delete on it too, and `oc auth can-i get pods/log` answers
        # `no` even on a correct grant because it reads pods/log as a resource NAME. Use
        # --subresource=log to check it.
        rules:
          - apiGroups: [""]
            resources:
              - pods
              - services
              - configmaps
              - persistentvolumeclaims
            verbs:
              - create
              - get
              - list
              - watch
              - delete
              - deletecollection
              - patch
              - update
          - apiGroups: [""]
            resources:
              - secrets
            verbs:
              - create
              - get
              - watch
              - delete
              - update
              - patch
          - apiGroups: [""]
            resources:
              - pods/log
            verbs:
              - get
              - list


      # ---- two more families SHARING ONE labelKey, showing the 0.20.0 shape. Commented out, so
      # nothing new is granted by upgrading; uncomment to use. Each narrows the shared key to its own
      # group family via groupPrefix — the prefixes must be disjoint, and the template refuses the
      # render (naming both policies) if they overlap or if a sharer omits its groupPrefix. ----
      # spark:
      #   enabled: true
      #   labelKey: company.net/oud-group
      #   groupPrefix: app-bdp-rbac-spark        # values starting app-bdp-rbac-spark-
      #   roleName: spark-submitter-role
      #   roleType: spark-job-submitter
      #   excludedPaths:
      #     - .status
      #     - .spec.replicas
      #   rules:
      #     - apiGroups: [""]
      #       resources: ["pods", "pods/log"]
      #       verbs: ["get", "list", "watch"]
      # trino:
      #   enabled: true
      #   labelKey: company.net/oud-group
      #   groupPrefix: app-bdp-rbac-trino-*      # the groupsync -* spelling; identical meaning
      #   roleName: trino-submitter-role
      #   roleType: trino-job-submitter
      #   excludedPaths:
      #     - .status
      #     - .spec.replicas
      #   rules:
      #     - apiGroups: [""]
      #       resources: ["pods", "pods/log"]
      #       verbs: ["get", "list", "watch"]

  # -------- the BASELINE: mnemonic + environment --------
  # THIS IS WHAT EVERY TEAM GETS. A namespace that declares a mnemonic and an environment receives the
  # standard access tiers for that environment, with no per-namespace configuration. oudGroup above is
  # a PoC beside it; this is the documented flow the README's install steps run.
  #
  # ONE TEMPLATE SERVES BOTH nonprod AND prod because they differ only in data — which environments and
  # which roles. See the header of
  # charts/openshift-rbac-automation/templates/rbac-policies/10-baseline-namespaceconfig-rbac.yaml for when a future policy earns its own file
  # instead of an entry here.
  #
  # THESE BIND OPENSHIFT'S BUILT-IN CLUSTERROLES (edit and view, as configured below) through RoleBindings, which
  # grants them in one namespace only. They are aggregated roles maintained by the platform; defining
  # local copies would drift as OpenShift adds APIs. ClusterRoleBindings are a different thing and
  # live in the GroupConfig policies, not here.
  baseline:
    # ON BY DEFAULT, with the parent switch: the baseline is what this chart is for.
    #
    # TURNING IT BACK OFF IS A REVOCATION, NOT A NO-OP. The CR carries the finalizer
    # redhatcop.redhat.io/namespaceconfig-controller, so removing it makes the operator delete every
    # RoleBinding it created. Measured on CRC: 36 RoleBindings gone in 2 seconds, and
    # `oc auth can-i delete pods` for a bound group went from yes to no. Re-enabling restored all of
    # them 44 seconds after the delete — so a flag flip on a shared cluster is a 44-second window with
    # no namespace access for anyone this grants. Same applies to renaming a policy's `name`: Helm
    # deletes the old resource and creates the new one.
    enabled: true

    # The group family. Combined with the mnemonic and the role, this produces
    # app-ocp-rbac-<mnemonic>-ns-<role> — the convention
    # working-sessions/policies/kyverno-group-naming-app-ocp-rbac.yaml already validates, and the
    # family GroupSync syncs from LDAP. Changing it here does not change what Kyverno enforces.
    groupPrefix: app-ocp-rbac

    # THE TWO SELECTOR LABELS, and both do double duty:
    #   mnemonicLabelKey     selects namespaces that have it, AND its value names the bound groups
    #   environmentLabelKey  selects on its value, AND that value is recorded on every RoleBinding
    # The template refuses to render when either is empty rather than matching every namespace, or
    # letting a prod namespace collect the nonprod grants.
    mnemonicLabelKey: company.net/mnemonic
    environmentLabelKey: company.net/app-environment


    policies:
      # ---- non-production: rnd / eng / qa / uat ----
      nonprod:
        enabled: true
        name: baseline-nonprod-rbac
        description: "Nonprod RBAC: developer (edit) and audit (view) access for rnd/eng/qa/uat environments only"

        # AN EXPLICIT ALLOW-LIST, not "everything that is not prod". An environment nobody has ruled on
        # gets nothing, rather than silently inheriting non-production access — which is why
        # `production` (a real label value on this cluster, distinct from `prod`) matches neither
        # policy and receives no bindings at all.
        environments:
          - rnd
          - eng
          - qa
          - uat

        # Redundant against the allow-list above, and kept on purpose: if somebody adds prod to
        # `environments`, this still refuses it. A second lock on the same door, visible here rather
        # than assumed. Rendered as a NotIn expression only when non-empty.
        excludeEnvironments:
          - prod

        # `name` names the group and the binding; `clusterRole` IS the grant. Everything else — the
        # RoleBinding name, role-type, bound-role, group name — derives from these two; see
        # working-sessions/docs/templating-guide.md §3 for the full derivation table. clusterRole is
        # explicit because it is NOT derivable from the tier (developer -> edit, audit -> view) and
        # because it is the field an auditor reads.
        #
        # ns-admin WAS REMOVED FROM THIS LIST, and removing it did NOT fully revoke it. Of its 10
        # RoleBindings, 4 disappeared and 6 SURVIVED still granting ClusterRole/admin — see the warning on
        # clusterRbac.roles for the mechanism. They had to be deleted by hand:
        #   oc delete rolebinding -A -l rbac.ocp.io/config-source=baseline-nonprod-rbac,rbac.ocp.io/role-type=ns-admin
        # Do the same for any tier taken out of this list, and verify the count reaches zero.
        roles:
          - name: developer
            clusterRole: edit
          - name: audit
            clusterRole: view

      # ---- production ----
      # ON, because the baseline means BOTH halves. A cluster running the baseline with only the
      # nonprod half would give prod namespaces no managed access at all, which is not a safer state —
      # it is an unmanaged one, and somebody would fill the gap with hand-made bindings.
      #
      # PROD RBAC THEREFORE SHIPS BY DEFAULT: the two switches above it — namespaceConfigPolicy.enabled
      # and baseline.enabled — are both true, so a plain `helm install` creates the prod CR too. This flag decides what the baseline CONTAINS, and the answer is: the full baseline. Turn it
      # off only to deploy the nonprod half alone.
      prod:
        enabled: true
        name: baseline-prod-rbac
        description: "Prod RBAC: audit (view) access for prod environments only (no admin, no developer)"
        environments:
          - prod
        # Nothing to exclude: the allow-list is already a single value.
        excludeEnvironments: []

        # NO admin, DELIBERATELY, and this is the whole reason prod is a separate policy rather than
        # another environment in the nonprod list. Namespace-admin in production is granted by a
        # reviewed exception, never by a namespace label. Adding an admin entry here would hand it to
        # every prod namespace at once.
        roles:
          - name: audit
            clusterRole: view

# ---------------------------------------------------------------------------
# Cluster-wide baseline RBAC  (GroupConfig -> ClusterRoleBinding)
# ---------------------------------------------------------------------------
# ITS OWN TOP-LEVEL KEY, not a child of namespaceConfigPolicy above, because the two parents mirror
# the two CRDs: namespaceConfigPolicy renders NamespaceConfig CRs that emit RoleBindings; this renders
# a GroupConfig CR that emits ClusterRoleBindings. Filing a GroupConfig under a key named for
# NamespaceConfig would misdescribe half of what that key controls.
#
# The accepted cost of separate parents: there is no single master switch for "all chart-managed
# RBAC". Turning everything off is two flags, this one and namespaceConfigPolicy.enabled.
#
# THE CLUSTER-WIDE HALF OF THE BASELINE. namespaceConfigPolicy.baseline grants access inside a
# namespace that carries a mnemonic; this grants it across ALL namespaces to groups whose NAME ends in
# a cluster tier. Both are keyed on the same app-ocp-rbac-* family synced from LDAP.
clusterRbac:
  # ON BY DEFAULT, like the namespace baseline.
  #
  # TURNING IT BACK OFF IS A REVOCATION, NOT A NO-OP. The CR carries the finalizer
  # redhatcop.redhat.io/groupconfig-controller, so removing it makes the operator delete every
  # ClusterRoleBinding it created. Measured on the namespace equivalent: 39 objects gone in 2 seconds,
  # restored 44 seconds later. On a shared cluster that is a window with no cluster-wide access for
  # anyone this grants.
  enabled: true

  # ONE CR for all three tiers. The three source policies under working-sessions/policies/ are three
  # separate CRs; this is deliberately one, because they share an identical selector and differ only
  # in data. Renaming this ORPHANS nothing but DOES delete and recreate: the operator revokes the old
  # CR's bindings and the new CR rebuilds them.
  # RENAMING THIS IS RELIABLE, unlike removing a role from the list below — the two look similar and
  # behave differently, so it is worth knowing which you are doing. A rename is delete-plus-create: the
  # old CR's finalizer removes every ClusterRoleBinding it made and the new CR recreates all of them.
  # Measured on this rename: 12 objects rebuilt within 6 seconds, every one carrying the new name in its
  # rbac.ocp.io/source-groupconfig annotation, and ZERO left claiming the old one. Removing a role
  # instead leaves orphans — see the warning above the roles list.
  #
  # The window is real though: for those few seconds nobody this policy grants has cluster-wide access.
  name: baseline-cluster-rbac
  description: "Cluster RBAC baseline: admin/view/edit ClusterRoles for the cluster tiers of synced groups"

  # SYNCED GROUPS ONLY, and this is the only thing narrowing the selector. GroupSync sets this label
  # on every Group it manages, so a locally-created Group cannot collect cluster-wide access from a
  # policy meant for the directory. The template refuses to render when it is empty.
  syncProviderLabelKey: group-sync-operator.redhat-cop.io/sync-provider

  # Documents which group family this is for, on each binding's rbac.ocp.io/group-pattern annotation.
  # It does NOT narrow anything: the guard inside each objectTemplate matches on the SUFFIX, so a
  # group from another family ending in -cluster-admin would still match. Kyverno enforces the naming
  # (working-sessions/policies/kyverno-group-naming-app-ocp-rbac.yaml); this records it.
  groupPrefix: app-ocp-rbac


  # ONE objectTemplate PER ROLE, generated by ranging over this list — the same construction
  # namespaceConfigPolicy.baseline uses. Each template guards on `-cluster-<name>` and renders empty
  # for groups of other tiers.
  #
  # `name` supplies the suffix the guard matches and the role-type label. `clusterRole` IS the grant,
  # and it is NOT derivable from the name — note audit -> view. Everything else derives; see the
  # template header for the five derivations.
  #
  # A TIER IS PRESENT OR IT IS NOT IN THIS LIST. There is no per-role enabled flag, deliberately —
  # one way to express one thing.
  #
  # REMOVING AN ENTRY DOES NOT RELIABLY REVOKE WHAT IT CREATED. Measured on this cluster when ns-admin
  # was dropped from the baseline policy: of its 10 RoleBindings, 4 went and 6 SURVIVED — recreated by an
  # in-flight reconcile a second before the operator shut down their per-object controllers ("Shutdown
  # signal received" in the manager log). Those 6 still granted ClusterRole/admin, carried no
  # ownerReferences so Kubernetes GC would never collect them, and nothing would ever reconcile them
  # again. The operator does NOT prune the tier on the next reconcile — believing it does leaves live
  # grants behind.
  #
  # SO AFTER REMOVING A TIER, DELETE ITS OBJECTS EXPLICITLY and check the count reaches zero:
  #   oc delete clusterrolebinding -l rbac.ocp.io/config-source=baseline-cluster-rbac,rbac.ocp.io/role-type=cluster-admin
  #   oc get clusterrolebinding -l rbac.ocp.io/config-source=baseline-cluster-rbac,rbac.ocp.io/role-type=cluster-admin
  # The provenance labels survive on the orphans, which is exactly what makes them selectable — one more
  # reason config-source and role-type are on every object.
  roles:
    - name: admin
      clusterRole: admin
    - name: audit
      clusterRole: view
    - name: developer
      clusterRole: edit

# ---------------------------------------------------------------------------
# EXTRA access  (GroupConfig -> RoleBindings in a platform namespace)

# ---------------------------------------------------------------------------
# CUSTOM ClusterRoles  (GroupConfig -> ClusterRoleBinding or RoleBinding)
# ---------------------------------------------------------------------------
# The counterpart to clusterRbac above. That binds OpenShift's BUILT-IN aggregated ClusterRoles
# (admin / edit / view) to the three -cluster-* tiers. This binds ClusterRoles the platform does NOT
# ship — ones we define — to any group-name suffix we choose. For custom roles, and for CRD access.
#
# THIS CHART DOES NOT CREATE THE CLUSTERROLE, and that is deliberate. A chart that both defines a
# privileged ClusterRole and binds it hides the grant's contents in a values file; keeping them apart
# means the role is reviewed wherever roles are reviewed. Nor can the template check existence: Helm's
# `lookup` is empty during `helm template` and `--dry-run=client`, so the check would be a false
# negative half the time.
#
# SO KNOW THE FAILURE MODE. A binding whose roleRef names a ClusterRole that does not exist is created
# SUCCESSFULLY, reports healthy, and grants NOTHING. If a grant seems inert, check the role first:
#   oc get clusterrole <name>
#
# THE SELECTOR IS FIXED, THOUGH EVERYTHING ELSE IS FREE-FORM. Free-form selectors on this CRD fail
# dangerously and the repo has proof: working-sessions/docs/examples/redhat-cop-custom-crd-access.yaml
# writes a regex selector that the API silently PRUNES, leaving a CR with no selector — which
# apimachinery resolves to labels.Everything(), i.e. EVERY group. The template hardcodes the
# combination proven to narrow (sync-provider Exists, plus a per-entry hasSuffix guard) and lets you
# vary only the axes where variation is safe.

customGroupConfig:
  # OFF is chart safety. Turning it back off is a REVOCATION: the CR carries the
  # groupconfig-controller finalizer, so the operator deletes every binding it made.
  enabled: false

  name: custom-cluster-rbac
  description: "Custom RBAC: bind ClusterRoles defined outside this chart to chosen group suffixes"

  # SYNCED GROUPS ONLY — the only thing narrowing the selector, and the template refuses it empty.
  syncProviderLabelKey: group-sync-operator.redhat-cop.io/sync-provider

  # Documents the group family on each binding's rbac.ocp.io/group-pattern annotation. It does NOT
  # narrow anything — the suffix guard does that.
  groupPrefix: app-ocp-rbac

  # FREE-FORM BY DESIGN: any suffix you choose, bound to any ClusterRole you have defined. Three axes
  # vary — the suffix, the role, and whether the grant is cluster-wide or confined to one namespace.
  # Add an entry per pairing. Two entries MAY share a suffix (a group gets both roles), because the
  # binding name includes the entry name; what must be unique is `name`.
  #
  # scope: cluster    -> ClusterRoleBinding. The role applies in EVERY namespace. Use for genuinely
  #                      cluster-wide grants.
  # scope: namespace  -> RoleBinding in targetNamespace. The role applies THERE ONLY, however broad it
  #                      is. Use for operator/CRD access that lives in one namespace.
  #
  # Guards refuse, at render time: a missing name/suffix/clusterRole, a duplicate name, a suffix
  # without its leading hyphen (hasSuffix "admin" would also match -cluster-admin and -ns-admin), a
  # scope that is not exactly cluster or namespace, and scope namespace with no targetNamespace.
  entries:
    # THE SHIPPED EXAMPLE, from working-sessions/policies/database-admin-groupconfig-rbac.yaml, whose
    # roleRef comment — "Custom ClusterRole (must exist)" — is where this stanza came from.
    #
    # Inert today, and correctly so: the database-admin ClusterRole does not exist on the reference
    # cluster, the repo does not define it, and 0 groups end in -database-admin. It is here as the
    # worked shape, not as a live grant.
    - name: database-admin
      suffix: -database-admin
      # OPTIONAL, defaults to `name`. Set here because the default would stutter — the group already
      # ends in -database-admin, so <group>-database-admin reads twice. `crb` reproduces the source
      # policy's exact binding name. Two entries may not resolve to the same value; the template
      # refuses that, because the binding names would collide.
      bindingSuffix: crb
      scope: cluster
      clusterRole: database-admin

    # WHAT CRD ACCESS LOOKS LIKE — commented, not shipped. The pattern
    # working-sessions/docs/examples/redhat-cop-custom-crd-access.yaml was reaching for, expressed in a
    # way that actually narrows: an operator's own ClusterRole, bound in the operator's namespace.
    # - name: tekton-pipelines-edit
    #   suffix: -ns-developer
    #   scope: namespace
    #   targetNamespace: openshift-pipelines
    #   clusterRole: tekton-pipelines-edit
