{{- /*
groupPrefix NORMALIZATION, the single source of truth — used by the pre-pass and by the guard
construction in the render range, so the two can never drift. Trailing "*" is dropped, then a
trailing "-", then one "-" is appended: `bda-rbac-spark`, `bda-rbac-spark-` and `bda-rbac-spark-*`
all become "bda-rbac-spark-". The "-*" spelling is accepted for consistency with the group-sync
chart's groupCn convention; the appended hyphen is what stops `bda-rbac-sparkles` matching a
`bda-rbac-spark` policy. Empty in -> empty out.

Defined ABOVE the file's enable-gate because Go templates only allow `define` at top level — inside
the `if` it is a parse error ("unexpected <define> in command").
*/}}
{{- define "nco.oudGroupPrefixNormalized" -}}
{{- if . -}}{{ printf "%s-" (trimSuffix "-" (trimSuffix "*" .)) }}{{- end -}}
{{- end -}}
{{- if and .Values.namespaceConfigPolicy.enabled .Values.namespaceConfigPolicy.oudGroup.enabled }}
{{- $og := .Values.namespaceConfigPolicy.oudGroup }}
{{- if not $og.policies }}
{{- fail "namespaceConfigPolicy.oudGroup.policies is empty, so this would render nothing while the flag is on — a silent no-op. Give it at least one policy, or disable oudGroup." }}
{{- end }}
{{- /*
PRE-PASS: groupPrefix syntax, and disjointness across policies sharing a labelKey. Runs BEFORE the
main range so a bad combination refuses to render at all rather than rendering the good policies and
skipping the bad one. Maps range in sorted key order, so the first failure is deterministic.
*/}}
{{- $byLabelKey := dict }}
{{- range $key, $p := $og.policies }}
{{- if and $p.enabled $p.labelKey }}
{{- $normalized := include "nco.oudGroupPrefixNormalized" $p.groupPrefix }}
{{- if $normalized }}
{{- if contains "*" $normalized }}
{{- fail (printf "namespaceConfigPolicy.oudGroup.policies.%s groupPrefix %q has a \"*\" that is not the trailing character. The only wildcard spelling accepted is a TRAILING \"-*\" (the group-sync chart's groupCn convention), and it means the same as no star at all — this field is always a prefix match. A star elsewhere would be matched literally against label values, which never contain one, so the policy would silently grant nothing." $key $p.groupPrefix) }}
{{- end }}
{{- if eq $normalized "-" }}
{{- fail (printf "namespaceConfigPolicy.oudGroup.policies.%s groupPrefix %q normalizes to nothing — it would match every non-empty value while pretending to narrow. Omit groupPrefix instead, or give it a real family prefix such as bda-rbac-spark." $key $p.groupPrefix) }}
{{- end }}
{{- if gt (len $normalized) 62 }}
{{- fail (printf "namespaceConfigPolicy.oudGroup.policies.%s groupPrefix %q normalizes to %d characters. A label value caps at 63 and must extend the prefix by at least one, so this policy could never match anything — it would deploy healthy and grant nothing." $key $p.groupPrefix (len $normalized)) }}
{{- end }}
{{- end }}
{{- $sharers := get $byLabelKey $p.labelKey | default dict }}
{{- range $prevKey, $prevPrefix := $sharers }}
{{- if or (not $normalized) (not $prevPrefix) }}
{{- fail (printf "namespaceConfigPolicy.oudGroup.policies %q and %q are both enabled on labelKey %q and at least one has no groupPrefix. Without disjoint prefixes both select the SAME namespaces and contest the same RoleBinding — roleRef is immutable, so the second policy creates zero bindings while the operator error-loops and both CRs log success (measured; see the header below). Give every policy sharing a labelKey its own groupPrefix, or use distinct labelKeys." $prevKey $key $p.labelKey) }}
{{- end }}
{{- if or (hasPrefix $prevPrefix $normalized) (hasPrefix $normalized $prevPrefix) }}
{{- fail (printf "namespaceConfigPolicy.oudGroup.policies %q (groupPrefix -> %q) and %q (groupPrefix -> %q) overlap on labelKey %q: one prefix is a prefix of the other, so a label value can match BOTH policies — the same silent RoleBinding contest disjoint prefixes exist to prevent. Make the family prefixes disjoint." $prevKey $prevPrefix $key $normalized $p.labelKey) }}
{{- end }}
{{- end }}
{{- $_ := set $byLabelKey $p.labelKey (merge (dict $key $normalized) $sharers) }}
{{- end }}
{{- end }}
# =============================================================================
# NamespaceConfig — oud-group families, ONE CR PER POLICY
# =============================================================================
# Ranges over namespaceConfigPolicy.oudGroup.policies and renders a separate NamespaceConfig for each,
# exactly as 10-baseline- does for nonprod/prod, so each family gets its own CR.
#
# WHY A MAP OF POLICIES AND NOT AN `entries` LIST, which is what 13-custom-groupconfig- uses. An entries
# list renders multiple objectTemplates INSIDE ONE CR, and they all share that CR's single labelSelector.
# These policies each select on their OWN labelKey and define their OWN Role, so they cannot share a CR.
# Different selector -> different CR. That is also why two policies on the same labelKey are refused
# below: both would match the same namespaces and create the same RoleBinding name with different roles,
# and the operator would rewrite one over the other on every reconcile.
#
# CONTEXT INSIDE THE RANGE: `.` is the POLICY, not the chart root, so the shared label block is included
# as `$` — `include "nco.labels" $`. Using `.` there fails with "nil pointer evaluating interface
# {}.Name", which is how this was caught the first time.
# Converted from working-sessions/policies/oud-group-namespaceconfig.yaml, which STAYS in the repo as
# the readable reference and the record of why this access model exists. This file is the deployable
# form; that file is the explanation. Neither replaces the other.
#
# ── TWO TEMPLATE ENGINES, SAME { } DELIMITERS ──────────────────────────────
# Helm renders this file at install; the OPERATOR renders each objectTemplate later, once per matching
# namespace, where .Name is the namespace and .Labels are its labels. Expressions meant for the operator are BUILT AS STRINGS below so
# Helm cannot evaluate them — if it does, it tests an undefined .Name, renders the object away, and
# reports success. There is no error, only a missing grant.
#
# A `#` COMMENT IS NOT A HELM COMMENT — it is YAML, and Helm processes this file as text first, so an
# action inside one IS evaluated. Never `| quote` a built string either: the operator renders each
# objectTemplate as a Go template FIRST and parses YAML SECOND, so a backslash-quote breaks the parse.
#
# Full explanation, including how $group is derived three different ways:
#   working-sessions/docs/templating-guide.md
{{- $ns := "{{ .Name }}" }}
{{- range $key, $p := $og.policies }}
{{- if not $p.enabled }}
{{- else }}
{{- if not $p.labelKey }}
{{- fail (printf "namespaceConfigPolicy.oudGroup.policies.%s has no labelKey. It is the label the NamespaceConfig selects on AND the label whose VALUE becomes the bound group, so empty would select EVERY namespace and bind a group called \"\"." $key) }}
{{- end }}
{{- if not $p.roleName }}
{{- fail (printf "namespaceConfigPolicy.oudGroup.policies.%s has no roleName. The RoleBinding's roleRef names it, and a RoleBinding pointing at a Role that does not exist is created successfully, reports healthy, and grants NOTHING." $key) }}
{{- end }}
{{- if not $p.rules }}
{{- fail (printf "namespaceConfigPolicy.oudGroup.policies.%s has no rules, so it would create an empty Role that grants nothing while looking configured." $key) }}
{{- end }}
# SHARING A labelKey IS SUPPORTED — when every sharer narrows itself with a DISJOINT groupPrefix, and
# the pre-pass above REFUSES anything else at render time. Until 0.20.0 this header said sharing could
# not be guarded, and the reasoning was half right: whether two policies collide on a NAMESPACE is a
# fact about the cluster. But whether their VALUE PATTERNS can both match one value is a fact about
# values, and that is what the pre-pass decides — no groupPrefix on a sharer, or one prefix a prefix
# of the other, fails the render naming both policies.
#
# WHY THE REFUSAL EXISTS — the failure it replaces was silent, measured by trying it:
#   - both Roles are created and coexist; only the RoleBinding is contested
#   - the second policy creates ZERO RoleBindings, because roleRef is immutable:
#       RoleBinding "…-rb" is invalid: roleRef: Invalid value: …: cannot change roleRef
#   - the operator error-loops on that patch while the CR logs "resources processed successfully"
#
# So the CR read healthy and the grant was absent. If a grant here is ever missing, grep the manager
# log for "cannot change roleRef" first.
#
# HOW THE NARROWING WORKS: not in the labelSelector — matchExpressions has no wildcard operator, and
# 13-'s header records what happens when an unsupported selector is tried (silently pruned to
# match-everything). Each policy's selector stays `labelKey Exists`; a DEFERRED guard the OPERATOR
# evaluates per namespace wraps BOTH objectTemplates below — an if on
#
#   hasPrefix "bda-rbac-spark-" (index .Labels "company.net/oud-group")
#
# (shown here without its action braces, because a # comment is NOT a Helm comment — see the header —
# and the braced form in a comment once opened a real, unclosed `if` and broke the whole parse.)
#
# Both objects, not just the binding: the Role has a FIXED name per policy, so unguarded it would
# render into the other family's namespaces — unbound, but present where the policy does not apply.
# In a namespace whose value matches no sharer, every template renders EMPTY. What the operator does
# with that depends on its build:
#   - builds from v1.2.6-84-gbc60603 on (quay :latest since 2026-09-04) understand this guard BEFORE
#     rendering — hasPrefix on a label value is part of their template filter — and skip the
#     namespace with one debug-level "skipping namespace" line. Zero error lines, measured on CRC
#     with two policies and four namespaces (Chart.yaml 0.21.3 has the numbers).
#   - older builds only understood hasSuffix/contains on the namespace NAME, so they rendered, hit
#     the empty output and LOGGED IT AT ERROR LEVEL — "Object 'Kind' is missing in 'null'" then
#     "unable to process template for", once per non-matching namespace per reconcile — before
#     skipping it. The grant was still right (the closing "resources processed successfully …
#     resources:<n>" line was the verdict); only the log was wrong. Those lines in a manager log
#     mean the cluster runs an old image.
#
# TWO MORE MEASURED FACTS, in Chart.yaml's 0.20.0 entry at full length: adding groupPrefix to an
# ALREADY-DEPLOYED policy does not reliably remove the objects it displaces (delete them by
# config-source label in each namespace the policy no longer matches — a stale binding still
# GRANTS), and objects created before the change never gain the group-pattern annotation without a
# delete-and-recreate (roleRef is immutable).
#
# ONE roleName PER POLICY across DIFFERENT labelKeys still matters, with a worse failure: two policies
# sharing a roleName whose selectors overlap on a namespace are two CRs reconciling ONE Role object —
# and rules are SPEC, which propagates, so each reconcile rewrites the other's rules and the
# namespace's effective permissions oscillate between the two lists. Nothing errors and both CRs log
# success. That remains unguardable at render time: whether selectors on different labelKeys overlap
# is a fact about the cluster, not about values. (Sharers of ONE labelKey with disjoint prefixes may
# share a roleName safely — the guards partition the namespaces.)
# NAME IS DERIVED FROM THE MAP KEY, so the key is the single place a policy's identity is written.
# values.yaml ships name: '' and this fills it in: key `bdp` gives the CR name bdp-oud-group-rbac.
# Setting name explicitly overrides the derivation — the escape hatch for a policy that must keep a
# name it already has on a cluster. The rbac.ocp.io/config-source label always carries the CR name;
# it is not separately settable, so name (or the key) is also the selector for this policy's objects.
#
# THE CONSEQUENCE OF DERIVING, worth knowing before renaming a key: the CR name IS cluster identity,
# and Helm treats a renamed resource as delete-plus-create — the old CR's finalizer revokes every
# object it made and the new CR rebuilds them. Measured elsewhere in this chart at ~4s to revoke and
# ~50s to restore. Rename deliberately, not while tidying.
{{- $name := $p.name | default (printf "%s-oud-group-rbac" $key) }}
{{- $group := printf "{{ index .Labels %s%s%s }}" "\"" $p.labelKey "\"" }}
{{- /*
The value guard, deferred to the operator — built as a string for the same reason $group is, and with
the quotes as printf ARGUMENTS, never `| quote` (the operator Go-template-renders first and
YAML-parses second; a backslash-quote breaks the parse — templating-guide.md §2d).

Three shapes, one per configuration:
  groupPrefix set    {{- if hasPrefix "<family>-" (index .Labels "<key>") }}   family narrowing
  groupPrefix unset  {{- if (index .Labels "<key>") }}                         non-empty value only
The unset shape is new in 0.20.0 and deliberate: `Exists` matches a namespace whose value is "", and
unguarded that rendered RoleBinding "-rb" with subject "" — rejected by the API (DNS-1123), operator
error-looping while the CR logged success. Truthiness of "" is false in Go templates, so both objects
now simply render empty for such a namespace.
*/}}
{{- $q := "\"" }}
{{- $labelRef := printf "(index .Labels %s%s%s)" $q $p.labelKey $q }}
{{- $prefix := include "nco.oudGroupPrefixNormalized" $p.groupPrefix }}
{{- $guard := printf "{{- if %s }}" $labelRef }}
{{- if $prefix }}
{{- $guard = printf "{{- if hasPrefix %s%s%s %s }}" $q $prefix $q $labelRef }}
{{- end }}
{{- $endif := "{{- end }}" }}
{{- /*
excludedPaths always carries the operator's own defaults, [.status, .spec.replicas] since operator build
v1.2.6-131 (10-'s header has the history; .metadata is no longer among them, so rendered labels and
annotations are now enforced). The operator unions its defaults into the live CR on reconcile whatever
the source declares, so a declared list that is shorter is a permanent ArgoCD diff, and with selfHeal
on ArgoCD reverts and the operator re-adds, forever. The union here makes the rendered CR what the
operator will leave it as; paths values adds on top are kept. Requires that operator build.
*/}}
{{- $excluded := concat (list ".status" ".spec.replicas") ($p.excludedPaths | default (list)) | uniq }}
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: NamespaceConfig
metadata:
  name: {{ $name }}
  labels:
    {{- include "nco.labels" $ | nindent 4 }}
    app.kubernetes.io/component: rbac-automation
    rbac.ocp.io/scope: namespace-scoped
    rbac.ocp.io/kind: NamespaceConfig
    # LDAP-backed, like every policy in this chart — the groups this binds are synced from the directory,
    # so `-l rbac.ocp.io/identity-source=ldap-groups` must find this one too.
    rbac.ocp.io/identity-source: ldap-groups
    # AND THE AXIS THAT MAKES THIS POLICY DIFFERENT: the group name is the namespace label's value,
    # verbatim, with no prefix and no tier suffix. The other three compute theirs from the naming
    # convention and are labelled `pattern`.
    rbac.ocp.io/group-naming: namespace-label
    # CUSTOM, because this policy DEFINES its own namespace-scoped Role from a permission set in
    # values — a workload submitter no built-in tier expresses. The baseline policies bind
    # OpenShift's admin/edit/view instead, and are labelled `baseline`. So the two kinds are one
    # query apart across both CRDs:
    #   oc get namespaceconfig,groupconfig -l rbac.ocp.io/policy-family=custom
    # Before this label existed, that query returned only 13-custom-'s CR and silently omitted this
    # one — the sort of gap that makes an inventory look complete when it is not.
    rbac.ocp.io/policy-family: custom
  annotations:
    # One description key, on every policy — the "no prefix is added" fact is stated selectably by
    # rbac.ocp.io/group-naming: namespace-label above, so it does not need a second annotation here.
    description: "Namespace RBAC: bind the group named by the {{ $p.labelKey }} label value, verbatim and with no prefix added"
{{- if $p.groupPrefix }}
    # The family this policy narrows to, in the SAME `<prefix>*` shape 11- and 13- record on theirs —
    # because for this policy the label value IS the group name, the value pattern and the group
    # pattern are the same string. Absent when groupPrefix is unset: the policy binds whatever the
    # label names, and there is no wildcard to record.
    rbac.ocp.io/group-pattern: "{{ $prefix }}*"
{{- end }}
    # After the operator is installed and its CSV is running. A NamespaceConfig applied before the CRD
    # exists fails the release; applied before the controller is up it simply sits there.
    argocd.argoproj.io/sync-wave: "3"
    # ArgoCD dry-runs every resource BEFORE applying it, and a dry-run against a kind the cluster does not
    # serve yet fails with "the server could not find the requested resource" — which fails THE WHOLE SYNC,
    # not just this document. That is the exact shape of a first sync here: this CRD is not in the manifest
    # (it belongs to the operator's OLM bundle) and arrives mid-sync, when OLM installs the CSV in wave 0.
    # The ArgoCD docs call out this case explicitly — "the CRD is not part of the sync, but it could be
    # created in another way, e.g. by a controller in the cluster".
    #
    # It does NOT weaken validation once the operator is installed: "The dry run will still be executed if
    # the CRD is already present in the cluster." So on every sync after the first, this document is
    # dry-run exactly as before, and a malformed spec is still caught here rather than at apply time.
    #
    # It does NOT help plain `helm install`, which resolves every kind against API discovery before applying
    # anything and has no equivalent escape. That path still needs the two-step first install documented at
    # namespaceConfigPolicy.enabled in values.yaml.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  labelSelector:
    matchExpressions:
      # The ONLY requirement. No mnemonic, no environment — the label says everything.
      - key: {{ $p.labelKey }}
        operator: Exists
  templates:
    # -------------------------------------------------------------------------
    # Namespace-scoped submitter Role
    # -------------------------------------------------------------------------
    - excludedPaths:
        {{- toYaml $excluded | nindent 8 }}
      # The $guard / $endif pair wraps the WHOLE object — the operator evaluates the guard per
      # namespace, so where the label value is outside this policy's family (or empty) the template
      # renders empty and nothing is created. The Role is guarded like the binding deliberately: its
      # name is fixed per policy, so unguarded it would appear, unbound, in the other family's
      # namespaces. (Named without braces here — in a # comment Helm would substitute them.)
      objectTemplate: |
        {{ $guard }}
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: {{ $p.roleName }}
          namespace: "{{ $ns }}"
          labels:
            # This is the Role, not a binding — so no group-name and no bound-role. A Role has no
            # subject to name, and it IS the role rather than referencing one. It is also one per
            # NAMESPACE, not one per group (fixed name {{ $p.roleName }}), so tying it to a single
            # group name would be wrong rather than merely redundant.
            app.kubernetes.io/managed-by: namespace-configuration-operator
            # The CR that created this object. A LABEL, so it can be selected on — see
            # working-sessions/docs/labels-and-annotations.md for the full contract.
            rbac.ocp.io/config-source: {{ $name }}
            # Which CRD owns it, so config-source and this pair up without a lookup. Also a label:
            #   oc get rolebinding,role -A -l rbac.ocp.io/source-kind=NamespaceConfig
            rbac.ocp.io/source-kind: NamespaceConfig
            rbac.ocp.io/role-type: {{ $p.roleType }}
            rbac.ocp.io/scope: namespace-scoped
          annotations:
            # The CR that created this object, readable. Same value as the config-source LABEL above:
            # the label is what you select on, this is what you read in `oc get -o yaml` / `oc describe`
            # — which is also why the old `oc -l`-on-an-annotation trap is now harmless.
            rbac.ocp.io/source-namespaceconfig: {{ $name }}
        rules:
          {{- toYaml $p.rules | nindent 10 }}
        {{ $endif }}

    # -------------------------------------------------------------------------
    # RoleBinding — subject is the label value, used VERBATIM
    #
    # AN EMPTY LABEL VALUE WAS A REACHABLE BAD STATE until 0.20.0: `labelKey Exists` matches a
    # namespace whose value is "", and unguarded this binding rendered name "-rb" with subject "" —
    # which the API REJECTS (DNS-1123), so the operator error-looped on the create while the CR
    # logged "resources processed successfully": no grant, no visible error. The guard closes it:
    # "" is falsy to the truthiness guard and matches no prefix, so both templates render empty for
    # such a namespace. The Kyverno allowlist still audits the value but does not block (Audit
    # mode). If this policy's grant is missing in one namespace, check the label VALUE against the
    # policy's groupPrefix before reading the operator log.
    # -------------------------------------------------------------------------
    - excludedPaths:
        {{- toYaml $excluded | nindent 8 }}
      objectTemplate: |
        {{ $guard }}
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: "{{ $group }}-rb"
          namespace: "{{ $ns }}"
          labels:
            app.kubernetes.io/managed-by: namespace-configuration-operator
            # The CR that created this object. A LABEL, so it can be selected on — see
            # working-sessions/docs/labels-and-annotations.md for the full contract.
            rbac.ocp.io/config-source: {{ $name }}
            # Which CRD owns it, so config-source and this pair up without a lookup. Also a label:
            #   oc get rolebinding,role -A -l rbac.ocp.io/source-kind=NamespaceConfig
            rbac.ocp.io/source-kind: NamespaceConfig
            rbac.ocp.io/role-type: {{ $p.roleType }}
            rbac.ocp.io/bound-role: {{ $p.roleName }}
            rbac.ocp.io/scope: namespace-scoped
            # THE SAME KEY EVERY POLICY USES for the bound group, so one query finds every grant to a
            # group across all of them:
            #   oc get rolebinding,clusterrolebinding -A -l rbac.ocp.io/group-name=<group>
            rbac.ocp.io/group-name: "{{ $group }}"
          annotations:
            # The CR that created this object, readable. Same value as the config-source LABEL above:
            # the label is what you select on, this is what you read in `oc get -o yaml` / `oc describe`.
            rbac.ocp.io/source-namespaceconfig: {{ $name }}
{{- if $p.groupPrefix }}
            # The family this policy narrows to — same `<prefix>*` shape as 11-/13-. Recorded here
            # because with groupPrefix set the bound group IS matched against a wildcard.
            rbac.ocp.io/group-pattern: "{{ $prefix }}*"
{{- else }}
            # No group-pattern: with groupPrefix unset this policy's group comes from a NAMESPACE
            # LABEL with no wildcard involved, so there is nothing to record. Correct, not a gap.
{{- end }}
        subjects:
          - kind: Group
            name: "{{ $group }}"
            apiGroup: rbac.authorization.k8s.io
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: {{ $p.roleName }}
        {{ $endif }}
{{- end }}
{{- end }}
{{- end }}
