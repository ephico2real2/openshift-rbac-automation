{{- if .Values.subscription.autoApproveInstallPlan.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nco.approver.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nco.labels" . | nindent 4 }}
    app.kubernetes.io/component: installplan-approver
  annotations:
    # Wave 0, with the Job that mounts it and the Subscription it unblocks. See the header of
    # 09-installplan-approver-job.yaml: the Job cannot be in a later wave, and a script the Job
    # mounts cannot arrive in a later wave than the Job.
    argocd.argoproj.io/sync-wave: "0"
data:
  approve-installplan.sh: |
    #!/bin/bash
    # Approves ONLY the InstallPlan that installs the pinned CSV.
    #
    # WHY: installPlanApproval=Manual is the upgrade gate we want, but it also blocks the
    # FIRST install — OLM stages an unapproved InstallPlan and waits for a human, so an
    # unattended `helm install` never completes and the image-override hook times out waiting
    # for .status.installedCSV. Approving only the pinned version gives both halves: the
    # version the chart declares installs unattended, and anything else waits for a person.
    #
    # The pin is therefore the approval authority. To adopt a new version you bump
    # subscription.startingCSV in values and re-sync — a reviewable change in git — rather
    # than approving an InstallPlan by hand on the cluster.
    set -euo pipefail

    log()  { printf '%s  %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$*"; }
    fail() { log "ERROR: $*"; exit 1; }

    : "${NAMESPACE:?}" "${SUBSCRIPTION:?}" "${APPROVE_CSV:?}" "${WAIT_SECONDS:?}"

    log "namespace=${NAMESPACE} subscription=${SUBSCRIPTION} approving-only=${APPROVE_CSV}"

    # AN EMPTY READ IS NOT THE SAME AS "Automatic". `-o jsonpath ... 2>/dev/null || true` collapses three
    # very different states into one empty string:
    #
    #   the field is genuinely absent   OLM defaults to Automatic and approves its own plans — nothing to do
    #   the Subscription is not there   this hook ran before the resource it depends on
    #   the read failed                 Forbidden, an API timeout, a wrong namespace
    #
    # Only the first is "nothing to do". The other two are failures, and reporting them as
    # "OLM approves its own InstallPlans. Nothing to do." and exiting 0 is a FALSE SUCCESS — the operator
    # never installs, and the log actively points away from the cause. Observed exactly that: a run logging
    # "approval mode is '<none>', not Manual" while the Subscription on the cluster plainly said Manual.
    # Same conflation that let 0.19.1's sweeper read Forbidden as not-found and delete every RoleBinding it
    # managed, so it is separated here the same way: keep the exit status, and branch on it.
    #
    # AND EVERY OLM RESOURCE IS NAMED IN FULL — subscriptions.operators.coreos.com, never `subscription`.
    # That is what the empty read turned out to be. Once the failure was surfaced instead of swallowed, it
    # said:
    #
    #     Error from server (Forbidden): subscriptions.messaging.knative.dev "…" is forbidden:
    #     … cannot get resource "subscriptions" in API group "messaging.knative.dev"
    #
    # `subscriptions` is not a unique resource name. Whatever else on the cluster serves that plural — Knative
    # Eventing here — competes for the short name, and which one `oc` binds is decided by API discovery, which
    # changes as CRDs come and go. The container has HOME=/tmp and a cold discovery cache on every run, so the
    # binding is not even stable between two runs of the same Job. A fully qualified name cannot be
    # misrouted, and it makes a Forbidden mean what it says: this ServiceAccount lacks the verb in THAT group.
    if ! APPROVAL_MODE="$(oc get subscriptions.operators.coreos.com "$SUBSCRIPTION" -n "$NAMESPACE" \
                            -o jsonpath='{.spec.installPlanApproval}' 2>&1)"; then
      case "$APPROVAL_MODE" in
        *NotFound*|*"not found"*)
          fail "Subscription ${SUBSCRIPTION} does not exist in ${NAMESPACE}.
      This hook runs at helm.sh/hook-weight 5 and ArgoCD sync-wave 0, both of which are AFTER the
      Subscription is applied — so if it is missing, either subscription.packageName does not match the
      Subscription this chart creates, or the release was applied with the Subscription template disabled.
      Inspect: oc get subscriptions.operators.coreos.com -n ${NAMESPACE}" ;;
        *)
          fail "could not read Subscription ${SUBSCRIPTION} in ${NAMESPACE}: ${APPROVAL_MODE}
      The resource is named in full, so a Forbidden here means exactly what it says: this ServiceAccount
      lacks 'get' on subscriptions in the operators.coreos.com group. (Before the name was qualified, this
      same failure was a MISROUTED request — `subscription` resolved to messaging.knative.dev, where the
      Role grants nothing — and it was swallowed into an empty string that read as "Automatic".)
      Inspect: oc auth can-i get subscriptions.operators.coreos.com -n ${NAMESPACE} \\
                 --as=system:serviceaccount:${NAMESPACE}:\$(oc get sa -n ${NAMESPACE} -o name | grep approver | cut -d/ -f2)" ;;
      esac
    fi
    if [ "$APPROVAL_MODE" != "Manual" ]; then
      log "Subscription approval mode is '${APPROVAL_MODE:-Automatic (field absent)}', not Manual — OLM approves its own InstallPlans. Nothing to do."
      exit 0
    fi

    # Report an unapproved InstallPlan that this hook will NOT approve, and why. Deliberately not silent:
    # the pin is the approval authority, so a plan for any other version is left for a human — but a
    # pending upgrade that nothing mentions looks exactly like an approver that failed to notice it.
    report_unapproved_others() {
      local found=0 ip owner csvs approved
      for ip in $(oc get installplans.operators.coreos.com -n "$NAMESPACE" -o name 2>/dev/null || true); do
        owner="$(oc get "$ip" -n "$NAMESPACE" \
                  -o jsonpath='{.metadata.ownerReferences[?(@.kind=="Subscription")].name}' 2>/dev/null || true)"
        case " $owner " in *" $SUBSCRIPTION "*) ;; *) continue ;; esac
        approved="$(oc get "$ip" -n "$NAMESPACE" -o jsonpath='{.spec.approved}' 2>/dev/null || true)"
        [ "$approved" = "true" ] && continue
        csvs="$(oc get "$ip" -n "$NAMESPACE" -o jsonpath='{.spec.clusterServiceVersionNames[*]}' 2>/dev/null || true)"
        case " $csvs " in
          *" $APPROVE_CSV "*) ;;
          *) found=1
             log "PENDING UPGRADE, deliberately NOT approved: ${ip} installs [${csvs}]."
             log "  The pin is the approval authority — this hook only ever approves ${APPROVE_CSV}, so a"
             log "  channel upgrade cannot install itself. To adopt it, bump subscription.startingCSV in"
             log "  values to the version above and re-run; that is a reviewable change in git rather than"
             log "  an InstallPlan approved by hand on a cluster." ;;
        esac
      done
      [ "$found" = 0 ] && log "no other unapproved InstallPlans are waiting"
      return 0
    }

    # Already installed at the pinned version? Then there is nothing to approve, and saying so
    # is better than waiting out the timeout on every re-sync.
    INSTALLED="$(oc get subscriptions.operators.coreos.com "$SUBSCRIPTION" -n "$NAMESPACE" \
                  -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)"
    if [ "$INSTALLED" = "$APPROVE_CSV" ]; then
      log "already installed at ${APPROVE_CSV}; no InstallPlan to approve"
      # This early exit is why a pending upgrade used to go unmentioned: it returns before the search loop
      # below, which is the only place that logged a non-matching plan. In the steady state — installed at
      # the pin, an upgrade waiting in the channel — that made a deliberate refusal look like an oversight.
      report_unapproved_others
      exit 0
    fi

    # --- Find an InstallPlan for the pinned CSV, owned by OUR Subscription ----------------
    # Ownership matters: several operators can share a namespace, and approving another
    # operator's InstallPlan would install software this chart knows nothing about.
    deadline=$(( $(date +%s) + WAIT_SECONDS ))
    TARGET=""
    while [ "$(date +%s)" -lt "$deadline" ]; do
      for ip in $(oc get installplans.operators.coreos.com -n "$NAMESPACE" -o name 2>/dev/null || true); do
        OWNER="$(oc get "$ip" -n "$NAMESPACE" \
                  -o jsonpath='{.metadata.ownerReferences[?(@.kind=="Subscription")].name}' 2>/dev/null || true)"
        case " $OWNER " in *" $SUBSCRIPTION "*) ;; *) continue ;; esac

        APPROVED="$(oc get "$ip" -n "$NAMESPACE" -o jsonpath='{.spec.approved}' 2>/dev/null || true)"
        [ "$APPROVED" = "true" ] && continue

        # Space-separated list; an InstallPlan may carry dependencies alongside the operator.
        CSVS="$(oc get "$ip" -n "$NAMESPACE" \
                 -o jsonpath='{.spec.clusterServiceVersionNames[*]}' 2>/dev/null || true)"
        case " $CSVS " in
          *" $APPROVE_CSV "*)
            TARGET="$ip"
            log "match: ${ip} installs [${CSVS}]"
            break
            ;;
          *)
            log "SKIP ${ip}: installs [${CSVS}], which is not the pinned ${APPROVE_CSV}. Left unapproved for a human to review."
            ;;
        esac
      done
      [ -n "$TARGET" ] && break
      log "waiting for an unapproved InstallPlan for ${APPROVE_CSV}..."
      sleep 5
    done

    if [ -z "$TARGET" ]; then
      # Non-fatal by design. A staged upgrade nobody has approved is a normal steady state;
      # failing here would turn every routine `helm upgrade` red for as long as a newer
      # version sits in the channel.
      log "no unapproved InstallPlan for ${APPROVE_CSV} found within ${WAIT_SECONDS}s"
      log "current state: installedCSV=${INSTALLED:-<none>}"
      exit 0
    fi

    log "approving ${TARGET}"
    oc patch "$TARGET" -n "$NAMESPACE" --type=merge -p '{"spec":{"approved":true}}'

    # --- Confirm OLM acted on the approval ------------------------------------------------
    deadline=$(( $(date +%s) + WAIT_SECONDS ))
    while [ "$(date +%s)" -lt "$deadline" ]; do
      PHASE="$(oc get "$TARGET" -n "$NAMESPACE" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
      [ "$PHASE" = "Complete" ] && break
      log "waiting for ${TARGET} to complete (phase=${PHASE:-<none>})"
      sleep 5
    done
    [ "$PHASE" = "Complete" ] \
      || fail "${TARGET} is phase '${PHASE:-<none>}' after ${WAIT_SECONDS}s. Inspect: oc describe ${TARGET} -n ${NAMESPACE}"

    log "OK: ${APPROVE_CSV} installed via ${TARGET}"
{{- end }}
