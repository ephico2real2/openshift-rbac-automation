apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ .Values.subscription.packageName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nco.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  channel: {{ .Values.subscription.channel }}
  name: {{ .Values.subscription.packageName }}
  source: {{ .Values.subscription.source }}
  sourceNamespace: {{ .Values.subscription.sourceNamespace }}
  installPlanApproval: {{ .Values.subscription.installPlanApproval }}
  {{- with .Values.subscription.startingCSV }}
  startingCSV: {{ . }}
  {{- end }}
  # spec.config injects operator env (OLM-supported override). No WATCH_NAMESPACE —
  # NCO installs AllNamespaces and watches every namespace. The operator IMAGE cannot be
  # set here: OLM's spec.config has no image field. A custom image is applied by patching
  # the installed CSV instead — see operatorImage.enabled in values.yaml.
  config:
    env:
      - name: ZAP_LOG_LEVEL
        value: {{ .Values.subscription.zapLogLevel | quote }}
      - name: ZAP_DEVEL
        value: {{ .Values.subscription.zapDevel | quote }}
      # RELATED_IMAGE_MANAGER is DISABLED — this operator does not support it.
      #
      # Tested on-cluster: the env var is injected into the Deployment correctly, but the
      # manager image stays upstream. RELATED_IMAGE_* tells an operator which image to use
      # for the workloads IT deploys (its operands); NCO deploys no operand pods, so there
      # is nothing for it to act on, and it never sets the operator's own image.
      # See docs/local-testing/LOCAL_TEST_operator_image_override.md §4a.
      #
      # Use operatorImage.enabled instead — it patches the image into the installed CSV,
      # which is the mechanism that actually works (charts/openshift-rbac-automation/README.md).
      #
      # Left commented rather than deleted so this is not re-attempted. Note the block below
      # is plain text: a "#" does NOT disable a Helm action, because templating runs before
      # YAML parsing, so a commented-out {{`{{- with }}`}} would still be evaluated.
      #
      #   - name: RELATED_IMAGE_MANAGER
      #     value: <.Values.subscription.relatedImageManager>
      #
      {{- with .Values.subscription.extraEnv }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- with .Values.subscription.resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
