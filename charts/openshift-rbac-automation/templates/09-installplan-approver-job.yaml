{{- if .Values.subscription.autoApproveInstallPlan.enabled }}
{{- $approveCSV := .Values.subscription.autoApproveInstallPlan.csv | default .Values.subscription.startingCSV }}
{{- if not $approveCSV }}
{{- fail "subscription.autoApproveInstallPlan is enabled but there is no CSV to approve: set subscription.startingCSV (the pinned version) or subscription.autoApproveInstallPlan.csv. Approving an unpinned InstallPlan would auto-approve arbitrary channel upgrades, which defeats installPlanApproval: Manual." }}
{{- end }}
# Approves the pinned InstallPlan so a Manual-approval Subscription can still install
# unattended. Runs at a LOWER hook weight than the image-override Job (10), because that Job
# waits on .status.installedCSV, which never appears until this approval happens.
#
# THE SAME SYNC-WAVE AS THE SUBSCRIPTION (0), AND `hook: Sync` NOT `PostSync`. Both were wrong, and each
# deadlocked a first ArgoCD sync on its own. ArgoCD advances to the next wave only when the current wave is
# HEALTHY, and this Subscription is the thing that cannot become healthy until this Job runs:
#
#   installPlanApproval defaults to Manual, so on a FIRST install OLM leaves the InstallPlan unapproved and
#   sets InstallPlanPending/RequiresApproval with .status.state=UpgradePending. ArgoCD's built-in health check
#   for operators.coreos.com/Subscription forgives exactly that pair — but ONLY when .status.installedCSV is
#   already set, which marks it as an upgrade awaiting approval:
#
#       if condition.type == "InstallPlanPending" and condition.reason == "RequiresApproval" then
#         if obj.status.installedCSV ~= nil then isManualApprovalPending = true end
#
#   On a first install installedCSV is nil, so the forgiveness does not apply and the condition is counted:
#   numPending > 0, and the Subscription reports Progressing forever. At wave 1 this Job would wait on a wave
#   that is waiting on this Job. `PostSync` is the same trap one level up: it runs only after the whole sync
#   succeeds, and the sync cannot succeed while the Subscription is Progressing.
#
# Same wave as the Subscription means ArgoCD applies both together and this Job clears the condition, so the
# wave goes healthy and the later waves — the readiness wait (2) and the policy CRs (3) — proceed.
#
# Under plain Helm the wave is inert and the ordering comes from the hook weight. Nothing to match there: the
# Subscription is an ordinary resource, and Helm applies every ordinary resource before any post-install hook,
# so the Subscription always exists by the time this runs. The weight only orders this against the other
# hooks — after the CSV reclaim (0), before the readiness wait (6) and the image override (10).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nco.approver.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nco.labels" . | nindent 4 }}
    app.kubernetes.io/component: installplan-approver
  annotations:
    # Wave 0 — the Subscription's own wave. See the header: any later wave deadlocks a first sync.
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    # See 05-image-override-job.yaml: a Job's spec.template is immutable, so the previous run
    # must be deleted before this one is created or the next sync fails.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.subscription.autoApproveInstallPlan.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.subscription.autoApproveInstallPlan.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.subscription.autoApproveInstallPlan.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "nco.labels" . | nindent 8 }}
        app.kubernetes.io/component: installplan-approver
    spec:
      serviceAccountName: {{ include "nco.approver.name" . }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: approve-installplan
          image: {{ .Values.operatorImage.job.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/scripts/approve-installplan.sh"]
          env:
            - name: NAMESPACE
              value: {{ .Values.namespace | quote }}
            - name: SUBSCRIPTION
              value: {{ .Values.subscription.packageName | quote }}
            - name: APPROVE_CSV
              value: {{ $approveCSV | quote }}
            - name: WAIT_SECONDS
              value: {{ .Values.subscription.autoApproveInstallPlan.waitSeconds | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.operatorImage.job.resources | nindent 12 }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            # oc writes a cache under $HOME; the root filesystem is read-only.
            - name: home
              mountPath: /.kube
      volumes:
        - name: scripts
          configMap:
            name: {{ include "nco.approver.name" . }}
            defaultMode: 0555
        - name: home
          emptyDir: {}
{{- end }}
