name: CI

# Deliberately small. This repo had NO checks at all until now, and a breaking chart change
# merged unvalidated — so the bar here is "the chart lints and every policy actually renders",
# not comprehensive coverage. Add jobs when a real failure justifies one.
on:
  pull_request:
  push:
    branches:
      - main
  # So helm.yaml can gate publishing on exactly these checks rather than duplicating them.
  workflow_call:

env:
  CHART: charts/openshift-rbac-automation

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint "$CHART"

      # The policies now ship ENABLED by default — that is the deliberate standard, so this no longer
      # asserts zero. What still has to hold is that the OFF switches work, because they are the only
      # way to stop the chart writing RBAC. A master switch that silently does nothing would be the
      # dangerous failure here.
      - name: The off switches actually switch off
        run: |
          n=$(helm template release "$CHART" \
                --set namespaceConfigPolicy.enabled=false \
                --set clusterRbac.enabled=false \
                --set customGroupConfig.enabled=false \
                | grep -cE '^kind: (NamespaceConfig|GroupConfig)' || true)
          echo "policy CRs with every switch off: $n"
          [ "$n" -eq 0 ] || { echo "::error::expected 0 policy CRs with all switches off, got $n"; exit 1; }

      # And the master switch alone must be enough: namespaceConfigPolicy.enabled=false has to stop
      # BOTH NamespaceConfig policies regardless of their own per-policy flags.
      - name: The master switch overrides per-policy flags
        run: |
          n=$(helm template release "$CHART" \
                --set namespaceConfigPolicy.enabled=false \
                --set namespaceConfigPolicy.baseline.enabled=true \
                --set namespaceConfigPolicy.oudGroup.enabled=true \
                | grep -cE '^kind: NamespaceConfig' || true)
          echo "NamespaceConfigs with master off but children on: $n"
          [ "$n" -eq 0 ] || { echo "::error::master switch did not override, got $n"; exit 1; }

      # The committed defaults must render what values.yaml actually declares — computed from values,
      # not hardcoded, so this does not need editing every time a flag flips.
      - name: Defaults render exactly the enabled policies
        run: |
          python3 - <<'EOF' > /tmp/expected
          import yaml
          v=yaml.safe_load(open("charts/openshift-rbac-automation/values.yaml"))
          n=0
          ncp=v["namespaceConfigPolicy"]
          if ncp.get("enabled"):
              # BOTH children are maps of policies, and both must be counted per-policy. This arm used to
              # add 1 for oudGroup whenever its master switch was on, which was right when oudGroup was a
              # single stanza and silently wrong from 0.14.0, when it became a map. It stayed green only
              # because the one policy in it happened to be enabled; disabling that policy is what exposed
              # it. Count the same way for both, so restructuring either cannot drift again.
              for child in ("oudGroup", "baseline"):
                  c = ncp.get(child) or {}
                  if c.get("enabled"):
                      n += sum(1 for p in (c.get("policies") or {}).values() if p.get("enabled"))
          if v["clusterRbac"].get("enabled"): n+=1
          if v["customGroupConfig"].get("enabled"): n+=1
          print(n)
          EOF
          want=$(cat /tmp/expected)
          got=$(helm template release "$CHART" | grep -cE '^kind: (NamespaceConfig|GroupConfig)' || true)
          echo "values declares $want enabled policies; chart renders $got"
          [ "$want" -eq "$got" ] || { echo "::error::values declares $want, chart renders $got"; exit 1; }

      # THE PER-CLUSTER OVERLAY MUST RENDER WHAT IT DECLARES. crc-values.yaml is the committed
      # "everything on" configuration, so it is the honest thing to check: it exercises the same file an
      # operator actually deploys with, and the expectation is computed from the MERGED values rather than
      # hardcoded, so adding or renaming a policy cannot make this check stale. The previous version set
      # every master switch with --set and asserted 5, which broke the moment an individual policy shipped
      # disabled — the switch was on, the policy was not.
      - name: The crc overlay renders exactly the policies it declares
        run: |
          python3 - <<'EOF' > /tmp/expected
          import yaml
          def merge(a, b):
              out = dict(a)
              for k, v in (b or {}).items():
                  out[k] = merge(a.get(k) or {}, v) if isinstance(v, dict) and isinstance(a.get(k), dict) else v
              return out
          base = yaml.safe_load(open("charts/openshift-rbac-automation/values.yaml"))
          over = yaml.safe_load(open("charts/openshift-rbac-automation/crc-values.yaml"))
          v = merge(base, over)
          n = 0
          ncp = v["namespaceConfigPolicy"]
          if ncp.get("enabled"):
              for child in ("oudGroup", "baseline"):
                  c = ncp.get(child) or {}
                  if c.get("enabled"):
                      n += sum(1 for p in (c.get("policies") or {}).values() if p.get("enabled"))
          if v["clusterRbac"].get("enabled"): n += 1
          if v["customGroupConfig"].get("enabled"): n += 1
          print(n)
          EOF
          want=$(cat /tmp/expected)
          got=$(helm template release "$CHART" -f "$CHART/crc-values.yaml" \
                  | grep -cE '^kind: (NamespaceConfig|GroupConfig)' || true)
          echo "crc-values declares $want enabled policies; chart renders $got"
          [ "$want" -eq "$got" ] || { echo "::error::crc-values declares $want, chart renders $got"; exit 1; }
          [ "$got" -gt 0 ] || { echo "::error::the overlay rendered no policies at all"; exit 1; }

      # The operator's own template expressions must reach the cluster UNEVALUATED. If Helm ever
      # evaluates one it tests an undefined .Name, renders the object away, and reports success — there is
      # no error, only a missing grant.
      #
      # Tests the MECHANISM, not specific values: that unevaluated Go-template actions are still present.
      # It deliberately does not name a label key or a group suffix, because those are values.yaml's to
      # change and a check that restates them goes stale the moment they do — which is exactly what
      # happened to the two count checks above.
      - name: Operator expressions survive Helm unevaluated
        run: |
          out=$(helm template release "$CHART" -f "$CHART/crc-values.yaml")
          echo "$out" | grep -q 'hasSuffix' \
            || { echo "::error::no hasSuffix guard survived Helm — a group-suffix conditional was evaluated at render time"; exit 1; }
          echo "$out" | grep -q 'index .Labels' \
            || { echo "::error::no 'index .Labels' expression survived Helm — a namespace-label lookup was evaluated at render time"; exit 1; }
          # The oudGroup value guards, added in 0.20.0. The crc overlay's shared-labelKey split renders
          # hasPrefix guards; Helm evaluating one would silently drop a family's Role AND RoleBinding
          # from the objectTemplates while everything else still rendered — green, and a missing grant.
          echo "$out" | grep -q 'hasPrefix' \
            || { echo "::error::no hasPrefix guard survived Helm — an oudGroup groupPrefix conditional was evaluated at render time"; exit 1; }
          echo "operator expressions intact: $(echo "$out" | grep -c 'hasSuffix') hasSuffix, $(echo "$out" | grep -c 'hasPrefix') hasPrefix, $(echo "$out" | grep -c 'index .Labels') index .Labels"

      # The 0.20.0 groupPrefix validation must REFUSE what it exists to refuse. Each case measured the
      # silent failure it prevents before the guard existed (see 12-'s header): a mid-pattern star is
      # matched literally and grants nothing; two policies sharing a labelKey without disjoint
      # prefixes contest one RoleBinding — roleRef is immutable, the operator error-loops, both CRs
      # log success. The message must name the offending policies, or the refusal is a puzzle.
      #
      # DEPENDS on crc-values.yaml's bdp/trino split sharing company.net/oud-group: the last two cases
      # perturb trino against bdp. If the overlay ever drops that split, give these cases their own
      # small overlay instead of quietly deleting them.
      - name: Malformed groupPrefix configurations are refused
        run: |
          set -uo pipefail
          fails=0
          must_refuse() {
            label="$1"; needle="$2"; shift 2
            if out=$(helm template release "$CHART" -f "$CHART/crc-values.yaml" "$@" 2>&1); then
              echo "::error::[$label] rendered successfully but should have been refused"
              fails=$((fails + 1))
            elif ! grep -q "$needle" <<<"$out"; then
              echo "::error::[$label] refused, but not by the expected guard. Got:"
              grep -o 'namespaceConfigPolicy[^\\]*' <<<"$out" | head -2
              fails=$((fails + 1))
            else
              echo "ok  [$label]"
            fi
          }
          P="namespaceConfigPolicy.oudGroup.policies"
          must_refuse "mid-pattern star" 'not the trailing character' \
            --set "$P.bdp.groupPrefix=bda*rbac"
          must_refuse "star only" 'normalizes to nothing' \
            --set "$P.bdp.groupPrefix=*"
          must_refuse "shared labelKey, prefix missing" 'at least one has no groupPrefix' \
            --set "$P.trino.groupPrefix="
          must_refuse "overlapping prefixes" 'one prefix is a prefix of the other' \
            --set "$P.trino.groupPrefix=bda-rbac-spark-alpha"
          [ "$fails" -eq 0 ] || exit 1

      # Every rendered excludedPaths block carries the chart's policy [.status, .spec.replicas] whatever an
      # overlay declares (12- adds it at render time; 10-, 11- and 13- declare it). The history: older
      # operators wrote their own list into the live CR, and a Git list that differed was a rewrite loop under
      # ArgoCD selfHeal (0.21.0); from the build that applies defaults in memory the list is the chart's alone.
      #
      # The overlay probes: a pre-0.22.0 values file that still lists .metadata (or .metadata.labels or
      # .metadata.annotations) on an oud-group policy must be REFUSED by 12-'s guard, because rendering it would
      # make that policy's metadata set-once again and undo the migration while this workflow stayed green; a
      # quoted "false" acknowledgement must be refused too; .metadata.finalizers must still render; and the
      # acknowledged overlay must render with .metadata kept and the chart's policy on every block.
      - name: excludedPaths always carry the chart's policy
        run: |
          P='namespaceConfigPolicy.oudGroup.policies.bdp'
          # Each refusal must come from 12-'s guard. Helm prints "Error: execution error at (<template>:<line>):
          # <message>" as its FIRST line beginning "Error:" (a coalesce warning about a --set that reshapes a value
          # can precede it; measured), and the guard's message starts with its E_ marker, so the marker must follow
          # the first ")" of that line. Another fail's text can carry a user value that contains the marker
          # (groupPrefix is printed %q) or even a line break followed by a forged "Error:" line (a policy map key;
          # 12- refuses such keys before anything else), but only after the genuine first Error line (both measured).
          refused_by_guard() {
            label="$1"; shift
            if out=$(helm template release "$CHART" -f "$CHART/crc-values.yaml" "$@" 2>&1); then
              echo "::error::[$label] rendered without allowMetadataExcluded"; exit 1
            fi
            grep -m1 '^Error:' <<<"$out" \
              | grep -Eq '^Error: execution error at \([^)]*12-custom-oud-group[^)]*\): E_METADATA_EXCLUDED_UNACKNOWLEDGED: ' \
              || { echo "::error::[$label] refused, but not by 12-'s guard. Got:"; echo "$out"; exit 1; }
            echo "[$label] refused by 12-"
          }
          refused_by_guard ".metadata, flag absent"      --set "$P.excludedPaths={.metadata}"
          refused_by_guard ".metadata, string false"     --set "$P.excludedPaths={.metadata}" --set-string "$P.allowMetadataExcluded=false"
          refused_by_guard ".metadata, string yes"       --set "$P.excludedPaths={.metadata}" --set-string "$P.allowMetadataExcluded=yes"
          refused_by_guard ".metadata.labels"            --set "$P.excludedPaths={.metadata.labels}"
          refused_by_guard ".metadata.annotations"       --set "$P.excludedPaths={.metadata.annotations}"
          refused_by_guard ".metadata.labels.<key>"      --set "$P.excludedPaths={.metadata.labels.example}"
          # a --set-string that reshapes rules makes Helm print a coalesce warning BEFORE the error line
          refused_by_guard ".metadata, after a coalesce warning" --set "$P.excludedPaths={.metadata}" --set-string "$P.rules.foo=bar"
          # .metadata.finalizers touches neither labels nor annotations: it must render.
          helm template release "$CHART" -f "$CHART/crc-values.yaml" --set "$P.excludedPaths={.metadata.finalizers}" >/dev/null \
            || { echo "::error::.metadata.finalizers as an extra was refused; only labels/annotations paths should be"; exit 1; }
          echo "[.metadata.finalizers] renders"
          out=$(helm template release "$CHART" -f "$CHART/crc-values.yaml" \
                  --set "$P.excludedPaths={.metadata}" --set "$P.allowMetadataExcluded=true")
          kept=$(echo "$out" | grep -c '^        - \.metadata$' || true)
          [ "$kept" -eq 2 ] || { echo "::error::acknowledged overlay should keep .metadata on bdp's 2 templates, found $kept"; exit 1; }
          # crc-values renders 11 templates (10-: 3, 11-: 3, 12-: 4, 13-: 1). Adding a template to a fixture
          # policy changes this number on purpose; update it with the fixture.
          blocks=$(echo "$out" | grep -c '^    - excludedPaths:' || true)
          [ "$blocks" -eq 11 ] || { echo "::error::expected 11 excludedPaths blocks from crc-values, found $blocks"; exit 1; }
          # Every block must carry BOTH .status and .spec.replicas; a block closes on the next non-item line
          # or on the next block header (an empty block followed directly by a header is counted too).
          missing=$(echo "$out" | awk '
            function closeb() { if (inb && (!st || !rep)) m++; inb=0; st=0; rep=0 }
            /^    - excludedPaths:/ { closeb(); inb=1; next }
            inb && /^        - /    { if ($2 == ".status") st=1; if ($2 == ".spec.replicas") rep=1; next }
            inb                     { closeb() }
            END                     { closeb(); print m+0 }')
          echo "excludedPaths blocks: $blocks, missing the chart policy: $missing"
          [ "$missing" -eq 0 ] || { echo "::error::$missing excludedPaths block(s) lack .status or .spec.replicas"; exit 1; }

      # Install and uninstall ordering: policy CRs deleted BEFORE the Subscription, the sweep applied
      # AFTER the CRs, every resource declaring an explicit wave, no two hooks sharing a weight.
      #
      # THE LOGIC LIVES IN THE REPO, NOT HERE, and that is the point. Inline it was lost once in an
      # editing accident and nobody could run it before pushing. As a script it is reviewable, it runs
      # locally, and it DISCOVERS what to check — charts by glob, overlays by glob, policy CRs by API
      # group — so adding a template or a cluster overlay needs no edit to this workflow and none to
      # the script. Its own header documents the three rules that keep it from going stale.
      - name: Every oc call names its resource in full
        # A short name can bind to a DIFFERENT API GROUP. Measured on a live cluster: `oc get subscription`
        # resolved to subscriptions.messaging.knative.dev and returned Forbidden, and because that read
        # discarded stderr the approver reported a successful no-op. These scripts run with HOME=/tmp and a
        # cold discovery cache every time, so the binding is not stable between two runs of the same Job.
        run: working-sessions/scripts/check-qualified-resources.py

      - name: Ordering is declared, not accidental
        run: working-sessions/scripts/check-ordering.py

      # Chart.yaml's version must move when the chart does, or chart-releaser silently publishes
      # nothing (skip_existing) and the repo's index quietly stops matching the source.
      - name: Chart version bumped
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q origin "${{ github.base_ref }}"
          if git diff --quiet "origin/${{ github.base_ref }}" -- "$CHART"; then
            echo "chart unchanged — no bump needed"; exit 0
          fi
          old=$(git show "origin/${{ github.base_ref }}:$CHART/Chart.yaml" 2>/dev/null \
                  | awk '/^version:/{print $2}')
          new=$(awk '/^version:/{print $2}' "$CHART/Chart.yaml")
          echo "chart changed: $old -> $new"
          [ "$old" != "$new" ] \
            || { echo "::error::$CHART changed but version is still $new"; exit 1; }
